<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Grid Sandbox</title>
<style>
  :root{ --cyan:#38f2ff; --ink:#dff3ff; --muted:#6f86a8; --panel:rgba(10,15,28,.82); --border:#183153; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#04060c;color:var(--ink);overflow:hidden;
    font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;user-select:none;-webkit-user-select:none}
  #stage{position:fixed;inset:0}
  canvas{display:block;background:#20422a;touch-action:none;cursor:crosshair}
  /* HUD */
  .hud{position:fixed;background:var(--panel);border:1px solid var(--border);border-radius:10px;
    backdrop-filter:blur(4px);box-shadow:0 4px 24px rgba(0,0,0,.4)}
  #info{top:14px;left:14px;padding:10px 14px;font-size:13px;line-height:1.7}
  #info b{color:var(--cyan)}
  #info .t{font-size:15px;font-weight:700;letter-spacing:.04em;margin-bottom:2px}
  #info .t span{color:var(--cyan)}
  #hint{bottom:14px;left:50%;transform:translateX(-50%);padding:8px 16px;font-size:13px;color:var(--muted);white-space:nowrap}
  #zoom{bottom:14px;right:14px;padding:8px;display:flex;flex-direction:column;gap:8px;align-items:center}
  #zoom button{width:40px;height:40px;font-size:20px;line-height:1;background:#111830;color:var(--ink);
    border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:.15s;font-family:inherit}
  #zoom button:hover{background:#1b294a;border-color:var(--cyan);color:var(--cyan)}
  #zoom .rc{font-size:12px;height:auto;padding:6px 4px;width:40px}
  @media (max-width:600px){ #hint{font-size:11px;white-space:normal;max-width:90vw;text-align:center} }
  /* title screen */
  #title{position:fixed;inset:0;z-index:100;background:#000;display:flex;flex-direction:column;
    align-items:center;justify-content:center;cursor:pointer;gap:4vh;opacity:1;transition:opacity .35s ease}
  #title.fade{opacity:0}
  #title img{width:min(82vw,1100px);height:auto;image-rendering:auto;-webkit-user-drag:none;user-drag:none}
  #title .start{color:#a11414;font-size:clamp(14px,2.4vw,26px);letter-spacing:.35em;text-transform:uppercase;
    font-weight:700;opacity:.85;animation:tpulse 1.6s ease-in-out infinite}
  @keyframes tpulse{0%,100%{opacity:.35}50%{opacity:.95}}
</style>
</head>

<script>
/* ============================================================================
   Grid Sandbox — a blank 50x50 grid with one player.
   • Click / tap a cell  -> player LERPs there.
   • Mouse wheel / pinch  -> zoom anchored on the cursor / pinch midpoint.
   • Drag (mouse or 1 finger) -> pan the view (Google-Maps style).
   ============================================================================ */

/* --- config --- */
const BUILD = 'build 2026-08-25 · j';   // shown on the title screen — bump the letter on every deploy
const GRID = 300;         // cells per side — tiles read as 3m squares; internally each cell stays 1m
const TILE = 3;           // cells per tile — one 3m tile holds at most ONE object (a tree, a bush, …)
const CELL = 40;          // world units per cell
const WORLD = GRID * CELL; // total world size
const MOVE_SPEED = CELL * 2.4; // world units / second (world pace cut 20% — was CELL*3)
const C_CYAN  = '#38f2ff';
const C_GREEN = '#4dff8f';
const C_BUSH  = '#57d76b';
const C_WATER = '#2a9df0';
const C_CAT   = '#d68a3a';   // cattail head (brown)
const C_BUCK  = '#7a5c31';   // buck  (dark brown)
const C_DOE   = '#9c7c47';   // doe   (brown)
const C_FAWN  = '#bf9e5e';   // fawn  (tan)
const SPAWN = { x: Math.floor(GRID/2), y: Math.floor(GRID/2) };  // centre cell

/* --- deer behaviour tuning --- */
const BUCK_SPEED = CELL * 0.84; // world units / second (calm; 20% slower world pace)
const RUN_SPEED  = CELL * 1.68; // 2x calm speed — a running bolt from the player (20% slower world pace)
const CHARGE_SPEED = CELL * 2.56; // an aggressive buck charging the player (20% slower world pace)
const BUCK_ATTACK_CD = 4;       // seconds between buck attacks
const BUCK_DAMAGE = 6;          // HP points per hit
const BOSS_HP = 200;            // the goblin boss is a fortress of meat
const BOULDER_CD = 3;           // seconds between boss boulder throws
const BOULDER_DMG = 5;          // explosion damage to every player within the blast
const BOULDER_RADIUS_T = 3;     // blast radius in tiles
const DMG_FLASH = 1.0;          // seconds the lost-HP white chunks linger
const TURTLE_SPEED = CELL * 0.88;  // turtles paddle home slowly (20% slower world pace)
const TURTLE_RUN   = CELL * 2.08;  // turtles bolt for deep water when scared (20% slower world pace)
const TURTLE_FLEE_R = 3;           // player within this many tiles -> dive
const TURTLE_SAFE_R = 5;           // player this far from the dive spot -> resurface
const TURTLE_HIDE_MIN = 10;        // seconds a turtle stays underwater no matter what
const HUNGER_TIME = 60;         // seconds between getting hungry
const EAT_TIME = 7;             // seconds to eat a bush
const FOLLOW_DIST = 8;          // tiles: does follow the buck if farther than this
const FAWN_FOLLOW = 4;          // tiles: fawns stay closer to their mother
const NURSE_TIME = 5;           // seconds a fawn feeds from its mother
const BUSH_RESPAWN = 300;       // seconds for an eaten bush to grow back (5 minutes)
const STARVE_TIME = 90;         // seconds a hungry deer survives without eating — death only under real scarcity, not traffic
const BUSHES_PER_DEER = 9;      // grown bushes needed per living deer for the herd to keep breeding (carrying capacity)
const GROW_TIME = 10;           // seconds a respawned bush/tree takes to scale up

/* --- terrain generation tuning --- */
const FIXED_SEED = 61803398;   // locks the map layout (change via R for a new map)
const GEN = {
  treeClusters: 400,     // number of tree clumps (scaled for 300x300)
  clusterMin: 2, clusterMax: 4,   // clump radius in 3m TILES (each tree claims one full tile)
  treeDensity: 0.72,     // fill probability at a clump centre (one tree per tile)
  bushBase: 0.045,       // bush chance PER TILE on open ground anywhere (max one bush per tile)
  bushNearTree: 0.5,     // bush chance per tile beside the woods
  cattailClump: 0.35,    // chance of a cattail clump on a shallow bank TILE (one clump per tile)
};

/* --- canvas / DPR --- */
const DEDICATED = (typeof globalThis!=='undefined' && globalThis.__DEDICATED__)===true;   // true when running headless in Node as an always-on server
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let DPR = 1;
function resize(){
  DPR = window.devicePixelRatio || 1;
  const w = window.innerWidth, h = window.innerHeight;
  canvas.width  = Math.round(w * DPR);
  canvas.height = Math.round(h * DPR);
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  recomputeZoomLimits();
  clampCam();
}

/* --- 3/4 (oblique top-down) projection ---
   Axis-aligned grid, foreshortened in depth so the board tilts away from you.
   world (wx,wy) -> proj (px,py) = (wx, wy*TILT). Camera & zoom operate in proj
   space, so the pan/zoom/anchor math below is unchanged — only the map differs. */
const TILT = 0.62;                        // depth foreshortening (1 = flat top-down)
function projOf(wx, wy){ return { x: wx, y: wy * TILT }; }
function projInv(px, py){ return { x: px, y: py / TILT }; }
// proj-space bounding box of the whole grid (a foreshortened rectangle)
const PROJ_MINX = 0, PROJ_MINY = 0, PROJ_W = WORLD, PROJ_H = WORLD * TILT;

/* --- camera : screen = (proj - ox,oy) * scale  (device px) --- */
const cam = { scale: 1, ox: 0, oy: 0 };
let fitScale = 1, minScale = 0.2, maxScale = 8;
function recomputeZoomLimits(){
  fitScale = Math.min(canvas.width/(PROJ_W*1.08), canvas.height/(PROJ_H*1.18));
  minScale = fitScale * 15;      // same on-screen framing as the old 5×–10× band (fitScale shrank 3× with the wider world)
  maxScale = fitScale * 30;
}
function worldToScreen(wx, wy){ const p=projOf(wx,wy); return { x:(p.x-cam.ox)*cam.scale, y:(p.y-cam.oy)*cam.scale }; }
function screenToWorld(sx, sy){ const px=cam.ox+sx/cam.scale, py=cam.oy+sy/cam.scale; return projInv(px,py); }

function zoomAt(sx, sy, factor){   // anchor the point under the cursor
  const px = cam.ox + sx/cam.scale, py = cam.oy + sy/cam.scale;
  const free = typeof player!=='undefined' && player.freeCam;         // the cheat hero roams the lens at will
  const lo = free ? fitScale*0.5 : minScale, hi = free ? fitScale*90 : maxScale;
  cam.scale = Math.max(lo, Math.min(hi, cam.scale * factor));
  cam.ox = px - sx/cam.scale;
  cam.oy = py - sy/cam.scale;
  clampCam();
}
function panBy(dxDev, dyDev){ cam.ox -= dxDev/cam.scale; cam.oy -= dyDev/cam.scale; clampCam(); }
function clampCam(){
  const viewW = canvas.width/cam.scale, viewH = canvas.height/cam.scale;
  const m = CELL * 4; // margin you can pan past the grid edge
  if(viewW >= PROJ_W + 2*m) cam.ox = PROJ_MINX + (PROJ_W - viewW)/2;
  else cam.ox = Math.max(PROJ_MINX - m, Math.min(cam.ox, PROJ_MINX + PROJ_W + m - viewW));
  if(viewH >= PROJ_H + 2*m) cam.oy = PROJ_MINY + (PROJ_H - viewH)/2;
  else cam.oy = Math.max(PROJ_MINY - m, Math.min(cam.oy, PROJ_MINY + PROJ_H + m - viewH));
}
function recenter(){
  cam.scale = fitScale;
  cam.ox = PROJ_MINX + (PROJ_W - canvas.width/cam.scale)/2;
  cam.oy = PROJ_MINY + (PROJ_H - canvas.height/cam.scale)/2;
  clampCam();
}

/* --- world / terrain ---------------------------------------------------------

   Walkable = open or shallow.  Blocked = tree, mid water, deep water.           */
const world = { terrain:new Uint8Array(GRID*GRID), moist:new Uint8Array(GRID*GRID),
                trees:[], bushes:[], cattails:[], water:[], moistCells:[], moistRing:[], stumps:[], bushRespawn:[], campDirt:[], shopDirt:[], shopProps:[], shopBlock:new Set(), crops:new Map(), bridge:[], bridgeSet:new Set(), sites:[] };
const gi = (x,y)=> y*GRID+x;
const inGrid = (x,y)=> x>=0&&y>=0&&x<GRID&&y<GRID;

// deterministic PRNG so the map layout stays the same every load (mulberry32)

let worldSeed = FIXED_SEED;   // change only via R (new map); default is fixed

function generateWorld(){
  const rnd = mulberry32(worldSeed);
  const t = world.terrain; t.fill(0);
  const trees=[];

  // Everything on the ground is built from whole 3m tiles: terrain never changes value
  // inside a tile, so all coloring & shading lands exactly on the visible grid squares.
  const TGRID = GRID/TILE;                                   // the world in tiles (100x100)
  const fillTile=(tx,ty,v)=>{ const x0=tx*TILE, y0=ty*TILE;
    for(let dy=0;dy<TILE;dy++) for(let dx=0;dx<TILE;dx++) t[gi(x0+dx,y0+dy)]=v; };
  const tVal=(tx,ty)=> (tx<0||ty<0||tx>=TGRID||ty>=TGRID) ? -1 : t[gi(tx*TILE,ty*TILE)];   // a tile is uniform: sample its corner

  // --- creek: a meandering band 4-5 TILES wide (12-15 m), carved a whole tile at a time ---
  const rightSide = rnd()<0.5;
  const tcx0 = Math.round(rightSide ? TGRID*0.72 : TGRID*0.26);
  let tcx = tcx0, w = 4;
  for(let ty=0; ty<TGRID; ty++){
    if(rnd()<0.28) w = 4 + Math.floor(rnd()*2);   // 4..5 tiles wide (deep water needs 5)
    if(rnd()<0.5)  tcx += (rnd()<0.5?-1:1);
    tcx = Math.max(tcx0-2, Math.min(tcx0+2, tcx));
    let left = tcx - (w>>1);
    left = Math.max(1, Math.min(TGRID-1-w, left));
    for(let tx=left; tx<left+w; tx++) fillTile(tx,ty,2);
  }

  // --- trees in organic clumps: each tree claims exactly ONE 3m tile (a 3x3 cell block,
  //     tile-aligned) so the world keeps its one-object-per-tile standard ---
  const tileOpen = (tx,ty)=>{ if(tx<0||ty<0||tx>=TGRID||ty>=TGRID) return false;
    const x0=tx*TILE, y0=ty*TILE;
    for(let dy=0;dy<TILE;dy++) for(let dx=0;dx<TILE;dx++) if(t[gi(x0+dx,y0+dy)]!==0) return false;
    return true; };
  const placeTree = (tx,ty)=>{ const x0=tx*TILE, y0=ty*TILE;
    for(let dy=0;dy<TILE;dy++) for(let dx=0;dx<TILE;dx++) t[gi(x0+dx,y0+dy)]=1;
    trees.push({x:x0,y:y0}); };                              // stored as the tile's top-left cell
  for(let c=0; c<GEN.treeClusters; c++){
    const sx = 1+Math.floor(rnd()*(TGRID-2)), sy = 1+Math.floor(rnd()*(TGRID-2));
    const R  = GEN.clusterMin + Math.floor(rnd()*(GEN.clusterMax-GEN.clusterMin+1));   // radius in tiles

  const clr=3;

  for(let i=trees.length-1;i>=0;i--){ const tr=trees[i];
    let hit=false; for(let dy=0;dy<TILE&&!hit;dy++) for(let dx=0;dx<TILE&&!hit;dx++) if(inClear(tr.x+dx,tr.y+dy)) hit=true;
    if(hit){ for(let dy=0;dy<TILE;dy++) for(let dx=0;dx<TILE;dx++) t[gi(tr.x+dx,tr.y+dy)]=0; trees.splice(i,1); }
  }
  for(let ty=Math.floor((SPAWN.y-clr)/TILE); ty<=Math.floor((SPAWN.y+clr)/TILE); ty++)
    for(let tx=Math.floor((SPAWN.x-clr)/TILE); tx<=Math.floor((SPAWN.x+clr)/TILE); tx++){
      if(tVal(tx,ty)===2) fillTile(tx,ty,0);               // pull the creek back a whole tile at a time
    }

  // --- classify water in whole tiles: a shallow(3, walkable) tile rings the bank,
  //     then a mid(4, blocked) tile ring, deep(2, blocked) beyond ---
  const shal=[];
  for(let ty=0;ty<TGRID;ty++) for(let tx=0;tx<TGRID;tx++){
    if(tVal(tx,ty)!==2) continue;
    if([[1,0],[-1,0],[0,1],[0,-1]].some(([dx,dy])=>{ const v=tVal(tx+dx,ty+dy); return v!==2 && v!==4; })) shal.push([tx,ty]);
  }
  for(const [tx,ty] of shal) fillTile(tx,ty,3);
  const rimMid=[];
  for(let ty=0;ty<TGRID;ty++) for(let tx=0;tx<TGRID;tx++){
    if(tVal(tx,ty)!==2) continue;
    if([[1,0],[-1,0],[0,1],[0,-1]].some(([dx,dy])=> tVal(tx+dx,ty+dy)===3)) rimMid.push([tx,ty]);
  }
  for(const [tx,ty] of rimMid) fillTile(tx,ty,4);

  // --- water list (ring kind) + creek bounds ---
  const water=[]; let creekMinX=GRID, creekMaxX=-1;
  for(let y=0;y<GRID;y++) for(let x=0;x<GRID;x++){

  }
  // --- bushes: at most ONE per 3m tile, planted at the tile's centre cell (mostly near the woods) ---
  const nearTree = (x,y)=>{ for(let dy=-TILE;dy<=TILE;dy++)for(let dx=-TILE;dx<=TILE;dx++) if(isTree(x+dx,y+dy)) return true; return false; };
  const bushes=[];
  for(let ty=0;ty<TGRID;ty++) for(let tx=0;tx<TGRID;tx++){
    if(!tileOpen(tx,ty)) continue;                         // the tile already holds something (tree/water)
    const x=tx*TILE+1, y=ty*TILE+1;                        // centre cell of the tile
    const p = nearTree(x,y) ? GEN.bushNearTree : GEN.bushBase;

  // --- moisture: darker grass in whole 3m tiles beside water and under/around the woods ---
  const moist=world.moist; moist.fill(0); const moistCells=[];
  const waterT=(tx,ty)=>{ const v=tVal(tx,ty); return v===2||v===3||v===4; };
  const moistT=new Uint8Array(TGRID*TGRID);

    if(waterT(tx,ty)) continue;                             // water is drawn over the grass
    let wet=false;
    for(let dy=-1;dy<=1&&!wet;dy++)for(let dx=-1;dx<=1;dx++){ const v=tVal(tx+dx,ty+dy); if(v===1||v===2||v===3||v===4){ wet=true; break; } }

  }
  // a transition ring one TILE around the moist region (intermediate shade -> smoother edge)
  const ringCells=[];
  for(let ty=0;ty<TGRID;ty++) for(let tx=0;tx<TGRID;tx++){
    if(moistT[ty*TGRID+tx] || waterT(tx,ty)) continue;
    let nb=false;
    for(let dy=-1;dy<=1&&!nb;dy++)for(let dx=-1;dx<=1;dx++){ const nx=tx+dx, ny=ty+dy;
      if(nx>=0&&ny>=0&&nx<TGRID&&ny<TGRID&&moistT[ny*TGRID+nx]){ nb=true; break; } }
    if(nb){ const x0=tx*TILE, y0=ty*TILE;
      for(let dy=0;dy<TILE;dy++)for(let dx=0;dx<TILE;dx++) ringCells.push({x:x0+dx,y:y0+dy}); }
  }
  world.moistCells=moistCells;
  world.moistRing=ringCells;
  // --- cattails: ONE clump per 3m tile, on shallow tiles that touch the bank ---
  const cattails=[];
  for(let ty=0;ty<TGRID;ty++) for(let tx=0;tx<TGRID;tx++){
    if(tVal(tx,ty)!==3) continue;                          // shallow water tile
    const banked=[[1,0],[-1,0],[0,1],[0,-1]].some(([dx,dy])=>{ const v=tVal(tx+dx,ty+dy); return v===0||v===1; });
    if(banked && rnd()<GEN.cattailClump) cattails.push({x:tx*TILE+1, y:ty*TILE+1});   // the tile's centre cell
  }
  world.trees=trees; world.bushes=bushes; world.cattails=cattails; world.water=water;
  world.creekMinX=creekMinX; world.creekMaxX=creekMaxX; world.bushRespawn=[]; world.stumps=[];
  world.crops=new Map();
  // the crafting shops are BUILT by players now — the meadow starts empty
  world.sites=[]; world.shopDirt=[]; world.shopProps=[]; world.shopBlock=new Set(); world._dirtTiles=new Set();
  shop.placed=false; stall.placed=false; butcher.placed=false; armorShop.placed=false;
  placeBridge();
  buildRoad();
  placeHenge();
  placeCave();
}
/* --- the goblin cave: a rocky den in the northwest with a locked door.
       Only the Goblin Key (won from the boss) opens it — and once one player turns
       the key, the cave stands open for everyone. --- */
const cave = { placed:false, x:0, y:0, w:5, h:5, door:{x:0,y:0}, unlocked:false };
function placeCave(){
  cave.placed=false; cave.unlocked=false; world.caveBlock=new Set(); world.caveFloor=[]; world.caveRocks=[];
  const ok=(x0,y0)=>{ for(let y=y0-1;y<y0+6;y++)for(let x=x0-1;x<x0+6;x++){
    if(!inGrid(x,y) || isWater(x,y) || (world.bridgeSet&&world.bridgeSet.has(gi(x,y)))) return false; } return true; };
  const rng=mulberry32((worldSeed ^ 0x1b873593)>>>0);
  let s=null;
  for(let i=0;i<400 && !s;i++){ const x0=3+((rng()*18)|0), y0=3+((rng()*14)|0); if(ok(x0,y0)) s={x0,y0}; }   // the northwest corner
  for(let y0=3;y0<25 && !s;y0++) for(let x0=3;x0<30 && !s;x0++) if(ok(x0,y0)) s={x0,y0};
  if(!s) return;
  cave.x=s.x0; cave.y=s.y0; cave.placed=true;
  for(let y=s.y0-1;y<s.y0+6;y++)for(let x=s.x0-1;x<s.x0+6;x++){ if(!inGrid(x,y)) continue;   // clear the hillside

      if(x>=t.x&&x<t.x+TILE&&y>=t.y&&y<t.y+TILE){
        for(let dy=0;dy<TILE;dy++) for(let dx=0;dx<TILE;dx++) if(inGrid(t.x+dx,t.y+dy)&&world.terrain[gi(t.x+dx,t.y+dy)]===1) world.terrain[gi(t.x+dx,t.y+dy)]=0;

    for(let i=world.bushes.length-1;i>=0;i--){ if(world.bushes[i].x===x&&world.bushes[i].y===y) world.bushes.splice(i,1); }
    for(let i=world.cattails.length-1;i>=0;i--){ if(world.cattails[i].x===x&&world.cattails[i].y===y) world.cattails.splice(i,1); }
    if(world.terrain[gi(x,y)]===1) world.terrain[gi(x,y)]=0;
  }
  cave.door={x:s.x0+2, y:s.y0+4};                                     // a great door in the boulder's south face
  for(let y=s.y0;y<s.y0+5;y++)for(let x=s.x0;x<s.x0+5;x++) world.caveBlock.add(gi(x,y));   // one solid 5x5 boulder
}
function setCaveUnlocked(){ if(!cave.placed || cave.unlocked) return;

  world.caveBlock.delete(gi(cave.door.x, cave.door.y-1)); }    // …into a dark hollow within the rock
/* ============================================================================
   THE GOBLIN DUNGEON — a second 100x100 map behind the cave's locked door.
   The mine gives way to hewn stone halls, torch-lit rooms, iron & silver to
   dig, a forge, and at the far end the Goblin King on his throne.

let mapMode='forest';                       // 'forest' | 'dungeon'
let savedForest=null, savedDungeon=null;
const dungeon={ exit:{x:0,y:0}, forge:{x:0,y:0}, throne:{x:0,y:0}, rooms:[] };
function snapshotMapState(){
  return { world:Object.assign({}, world), goblins:goblins.slice(), deer:allDeer.slice(), turtles:turtles.slice(),
    campfire, falling:fallingTrees.slice(), particles:particles.slice(), floats:floats.slice(),
    placed:{ shop:shop.placed, stall:stall.placed, butcher:butcher.placed, armor:armorShop.placed, henge:henge.placed, cave:cave.placed },
    px:player.px, py:player.py };
}
function applyMapState(s, withPlayer){
  Object.assign(world, s.world);
  goblins.length=0; goblins.push(...s.goblins);
  allDeer.length=0; allDeer.push(...s.deer);
  turtles.length=0; turtles.push(...s.turtles);
  fallingTrees.length=0; fallingTrees.push(...s.falling);
  particles.length=0; particles.push(...s.particles);

  henge.placed=s.placed.henge; cave.placed=s.placed.cave;

    player.carcassTarget=null; player.soulTarget=null; player.harvestTarget=null; player.propTarget=null;
    player.goShop=false; player.goStall=false; player.goButcher=false; player.goArmor=false; player.goAltar=false; player.goCave=false; player.goExit=false; player.goForge=false;

}
function ensureDungeonState(){                          // build the dungeon world without visiting it (a partner went down first)
  if(savedDungeon || mapMode==='dungeon') return;
  const cur=snapshotMapState();
  generateDungeon();                                    // (generates into the live globals)
  const dg=snapshotMapState();
  applyMapState(cur, false);
  savedDungeon=dg;
}
function travelTo(name){                                // THIS player travels; a partner elsewhere stays where they are
  if(mapMode===name) return;
  const cur=snapshotMapState();
  if(mapMode==='forest') savedForest=cur; else savedDungeon=cur;
  mapMode=name;
  const dest=(name==='dungeon')?savedDungeon:savedForest;
  if(dest) applyMapState(dest, true);
  else generateDungeon();
  if(name==='dungeon'){ player.px=(dungeon.exit.x+0.5)*CELL; player.py=(dungeon.exit.y-1+0.5)*CELL;
    addFloat('You descend into the goblin dungeon…', player.px, player.py-CELL*2, '#c7b6f2'); }
  else { player.px=(cave.door.x+0.5)*CELL; player.py=(cave.door.y+1.5)*CELL;
    addFloat('Daylight again — the forest.', player.px, player.py-CELL*2, '#cfe3a8'); }

function enterDungeon(){ travelTo('dungeon'); }
function exitDungeon(){ travelTo('forest'); }
/* --- dual-map simulation: while the partner is on the OTHER map, the host swaps worlds
       each frame, ticks that map for them, streams them a snapshot, and swaps back. --- */
let simRemoteOnly=false;                                // true while ticking a map the local player is NOT on
function tickWorld(dt){                                 // world-side simulation (no local-player systems)

  for(const d of allDeer){ updateDeer(d, dt); if(!d.dead && !d.gone) separate(d, dt); }
  if(pendingDeer.length){ for(const nd of pendingDeer) if(allDeer.length<DEER_CAP) allDeer.push(nd); pendingDeer.length=0; }
  for(const t of turtles) updateTurtle(t, dt);

    if(!allDeer.some(d=>!d.dead && !d.gone)){ herdRespawnT+=dt; if(herdRespawnT>=300){ herdRespawnT=0; respawnHerd(); } }
    else herdRespawnT=0;

  }

}
function simulateOtherMap(dt){
  if(typeof net==='undefined' || net.mode!=='host' || !net.connected) return;
  const otherName=(mapMode==='forest')?'dungeon':'forest';
  if(!net.clients.some(c=>c.open && c.p.active && (c.p.map||'forest')===otherName)) return;   // no one is over there — nothing else to run
  if(otherName==='dungeon') ensureDungeonState();
  let other=(otherName==='dungeon')?savedDungeon:savedForest;
  if(!other) return;
  const mine=snapshotMapState(), myMode=mapMode;
  applyMapState(other, false); mapMode=otherName; simRemoteOnly=true;

    if(net.otherQueue && net.otherQueue.length){        // relayed actions aimed at this map
      const q=net.otherQueue; net.otherQueue=[]; for(const qm of q) netOnData(qm);
    }
    tickWorld(dt);

    applyMapState(mine, false); mapMode=myMode; simRemoteOnly=false;
  }
}

function generateDungeon(){

  world.trees=[]; world.bushes=[]; world.cattails=[]; world.water=[]; world.moistCells=[]; world.moistRing=[]; world.sites=[];
  world.stumps=[]; world.bushRespawn=[]; world.campDirt=[]; world.shopDirt=[]; world.pathDirt=[];
  world.shopProps=[]; world.shopBlock=new Set(); world.crops=new Map(); world.bridge=[]; world.bridgeSet=new Set();

/* --- the stone henge: a ring of standing stones ~7 tiles across with an altar at its heart.

const henge = { placed:false, cx:0, cy:0, altar:{x:0,y:0}, stones:[] };
function placeHenge(){
  henge.placed=false; henge.stones=[]; world.hengeBlock=new Set();
  const rng=mulberry32((worldSeed ^ 0x2545f491)>>>0);
  const roadSet=new Set((world.pathDirt||[]).map(c=>gi(c.x,c.y)));
  const ok=(cx,cy)=>{
    if(cx<7||cx>GRID-8||cy<7||cy>GRID-8) return false;
    if(shopDist(cx,cy)<16) return false;                                  // clear of the village
    if(campfire && Math.hypot(cx-campfire.x, cy-campfire.y)<12) return false;   // clear of the goblin camp
    for(let dy=-5;dy<=5;dy++)for(let dx=-5;dx<=5;dx++){ const x=cx+dx, y=cy+dy;
      if(!inGrid(x,y) || isWater(x,y) || (world.bridgeSet&&world.bridgeSet.has(gi(x,y)))) return false;
      if(Math.hypot(dx,dy)<=4.5 && roadSet.has(gi(x,y))) return false; }  // the ring itself stays off the road
    return true;
  };
  let spot=null;
  for(let i=0;i<600 && !spot;i++){                                        // prefer the eastern reaches of the map
    const cx=Math.min(GRID-8, 55+((rng()*40)|0)), cy=7+((rng()*(GRID-14))|0);
    if(ok(cx,cy)) spot={cx,cy};
  }
  for(let cy=7;cy<GRID-8 && !spot;cy++) for(let cx=7;cx<GRID-8 && !spot;cx++) if(ok(cx,cy)) spot={cx,cy};
  if(!spot) return;
  henge.cx=spot.cx; henge.cy=spot.cy; henge.placed=true;
  const R=3.5;                                                            // ring radius → ~7-tile diameter
  for(let dy=-5;dy<=5;dy++)for(let dx=-5;dx<=5;dx++){                     // clear the sacred ground
    const x=spot.cx+dx, y=spot.cy+dy; if(!inGrid(x,y) || Math.hypot(dx,dy)>5) continue;
    for(let i=world.trees.length-1;i>=0;i--){ const t=world.trees[i];
      if(x>=t.x&&x<t.x+TILE&&y>=t.y&&y<t.y+TILE){
        for(let ddy=0;ddy<TILE;ddy++) for(let ddx=0;ddx<TILE;ddx++) if(inGrid(t.x+ddx,t.y+ddy)&&world.terrain[gi(t.x+ddx,t.y+ddy)]===1) world.terrain[gi(t.x+ddx,t.y+ddy)]=0;
        world.trees.splice(i,1); } }
    for(let i=world.bushes.length-1;i>=0;i--){ if(world.bushes[i].x===x&&world.bushes[i].y===y) world.bushes.splice(i,1); }
    for(let i=world.cattails.length-1;i>=0;i--){ if(world.cattails[i].x===x&&world.cattails[i].y===y) world.cattails.splice(i,1); }
    if(world.terrain[gi(x,y)]===1) world.terrain[gi(x,y)]=0;
  }
  const N=8, seen=new Set();
  for(let k=0;k<N;k++){                                                   // standing stones on the ring; a gap at the south for the entrance
    const a=k/N*Math.PI*2 + Math.PI/8;
    if(Math.abs(a-Math.PI/2)<0.3) continue;                               // the southern entrance
    const x=Math.round(spot.cx+Math.cos(a)*R), y=Math.round(spot.cy+Math.sin(a)*R);
    const key=gi(x,y); if(seen.has(key) || !inGrid(x,y)) continue; seen.add(key);
    henge.stones.push({x,y}); world.hengeBlock.add(key);
  }
  henge.altar={x:spot.cx, y:spot.cy}; world.hengeBlock.add(gi(spot.cx,spot.cy));
}
// a worn dirt road: from the east end of the bridge, along the storefronts, out to the east edge of the map.
// It meanders like a footpath (seeded, so every player generates the identical road), straightening only
// through the village so it fronts the doors — and the verges are kept clear: no tree or bush within 1 tile.
function buildRoad(){
  world.pathDirt=[]; const TG=GRID/TILE, ps=new Set();                    // ps holds road TILE keys
  if(!world.bridge.length) return;
  const rng=mulberry32((worldSeed ^ 0x517cc1b7)>>>0);                     // the road's own seeded wobble
  const tKey=(tx,ty)=> ty*TG+tx;
  const maxX=Math.max(...world.bridge.map(b=>b.x));                       // east end of the bridge
  const rows=world.bridge.filter(b=>b.x===maxX).map(b=>b.y);
  const frontTY=Math.floor(Math.min(...rows)/TILE);                       // hold loosely to the bridge's line — no village to straighten for
  const carve=(tx,ty)=>{                                                  // pave one whole 3m tile
    if(tx<0||ty<0||tx>=TG||ty>=TG || ps.has(tKey(tx,ty))) return;
    const x0=tx*TILE, y0=ty*TILE;
    for(let dy=0;dy<TILE;dy++) for(let dx=0;dx<TILE;dx++){ const x=x0+dx, y=y0+dy;
      if(isWater(x,y) || world.bridgeSet.has(gi(x,y))) return;            // never pave water or the planks
      if(isShopCell(x,y)||isStallCell(x,y)||isButcherCell(x,y)||isArmorCell(x,y)) return; }
    ps.add(tKey(tx,ty));
    for(let dy=0;dy<TILE;dy++) for(let dx=0;dx<TILE;dx++){ const x=x0+dx, y=y0+dy;
      if(world.terrain[gi(x,y)]===1) world.terrain[gi(x,y)]=0;            // tree-marked ground is cleared as the road is cut
      world.pathDirt.push({x,y,edge:false}); }
  };
  let ty=Math.floor(Math.min(...rows)/TILE);                              // pick the trail up right off the bridge planks
  for(let tx=Math.floor((maxX+1)/TILE); tx<TG; tx++){
    const pty=ty;
    if(rng()<0.34) ty += (rng()<0.5?-1:1);                                // wander a tile…
    if(ty<frontTY-2) ty++; else if(ty>frontTY+2) ty--;                    // …but stay loosely along the same line of travel
    ty=Math.max(1, Math.min(TG-2, ty));
    if(ty!==pty) carve(tx, pty);                                          // fill the bend so turns read as steps, not gaps
    carve(tx, ty);
  }
  // keep the verges open: fell every tree and pull every bush within 1 TILE of the road
  const nearT=(tx,ty)=>{ for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){ const nx=tx+dx, ny=ty+dy;
    if(nx>=0&&ny>=0&&nx<TG&&ny<TG&&ps.has(tKey(nx,ny))) return true; } return false; };
  for(let i=world.trees.length-1;i>=0;i--){ const t=world.trees[i];
    if(nearT((t.x/TILE)|0,(t.y/TILE)|0)){
      for(let dy=0;dy<TILE;dy++) for(let dx=0;dx<TILE;dx++) if(inGrid(t.x+dx,t.y+dy)&&world.terrain[gi(t.x+dx,t.y+dy)]===1) world.terrain[gi(t.x+dx,t.y+dy)]=0;
      world.trees.splice(i,1); } }
  for(let i=world.bushes.length-1;i>=0;i--){ const b=world.bushes[i]; if(nearT((b.x/TILE)|0,(b.y/TILE)|0)) world.bushes.splice(i,1); }
  for(let i=world.cattails.length-1;i>=0;i--){ const c=world.cattails[i]; if(nearT((c.x/TILE)|0,(c.y/TILE)|0)) world.cattails.splice(i,1); }
}
// lot helpers: every cleared plot and dirt lot lands on whole 3m tiles — no sub-tile coloring
function lotRect(x0,y0,x1,y1){                        // snap a cell rect outward to tile boundaries (cell coords back)
  const T=GRID/TILE;
  const tx0=Math.max(0,Math.floor(x0/TILE)), ty0=Math.max(0,Math.floor(y0/TILE));
  const tx1=Math.min(T-1,Math.floor(x1/TILE)), ty1=Math.min(T-1,Math.floor(y1/TILE));
  return {tx0,ty0,tx1,ty1, X0:tx0*TILE, Y0:ty0*TILE, X1:tx1*TILE+TILE-1, Y1:ty1*TILE+TILE-1};
}
function clearLot(r){                                 // flatten terrain + pull trees/bushes/cattails off the tiles
  for(let y=r.Y0;y<=r.Y1;y++) for(let x=r.X0;x<=r.X1;x++) world.terrain[gi(x,y)]=0;
  world.trees   = world.trees.filter(t=> t.x+TILE-1<r.X0 || t.x>r.X1 || t.y+TILE-1<r.Y0 || t.y>r.Y1);
  world.bushes  = world.bushes.filter(b=> b.x<r.X0 || b.x>r.X1 || b.y<r.Y0 || b.y>r.Y1);
  world.cattails= world.cattails.filter(c=> c.x<r.X0 || c.x>r.X1 || c.y<r.Y0 || c.y>r.Y1);
}
function pushDirtLot(r){                              // dirt ground tile by tile — uniform: shading works in whole tiles
  if(!world._dirtTiles) world._dirtTiles=new Set();
  for(let ty=r.ty0;ty<=r.ty1;ty++) for(let tx=r.tx0;tx<=r.tx1;tx++){
    const k=ty*(GRID/TILE)+tx; if(world._dirtTiles.has(k)) continue;   // lots can touch — never double-pave a tile
    world._dirtTiles.add(k);
    for(let dy=0;dy<TILE;dy++) for(let dx=0;dx<TILE;dx++) world.shopDirt.push({x:tx*TILE+dx, y:ty*TILE+dy, edge:false});
  }
}

// a wooden plank bridge spanning the creek near the vertical centre of the map
function placeBridge(){
  world.bridge=[]; world.bridgeSet=new Set();
  const rowHasWater=(y)=>{ if(!inGrid(0,y)) return false; for(let x=0;x<GRID;x++) if(isWater(x,y)) return true; return false; };
  const colHasWater=(x)=>{ if(!inGrid(x,0)) return false; for(let y=0;y<GRID;y++) if(isWater(x,y)) return true; return false; };
  // creek bounding box → orientation. A wider-than-tall creek runs east-west (cross it north-south) & vice-versa.
  let wx0=GRID,wy0=GRID,wx1=-1,wy1=-1, any=false;
  for(let y=0;y<GRID;y++) for(let x=0;x<GRID;x++) if(isWater(x,y)){ any=true;
    wx0=Math.min(wx0,x); wx1=Math.max(wx1,x); wy0=Math.min(wy0,y); wy1=Math.max(wy1,y); }
  if(!any) return;
  const horiz = (wx1-wx0) >= (wy1-wy0);   // creek elongated in x → runs east-west → bridge crosses north-south
  if(horiz){
    // horizontal creek: a 2-column-wide bridge spanning ALL water rows (+2 land each end) so both banks connect
    let bx=Math.round((wx0+wx1)/2);
    for(let off=0; off<GRID; off++){ if(colHasWater(bx+off)){ bx=bx+off; break; } if(colHasWater(bx-off)){ bx=bx-off; break; } }
    const btx=Math.max(0,Math.min(GRID-TILE,Math.floor(bx/TILE)*TILE));       // the bridge fills one whole tile column
    const cols=[btx, btx+1, btx+2];
    let miny=GRID, maxy=-1;
    for(const x of cols) for(let y=0;y<GRID;y++) if(isWater(x,y)){ miny=Math.min(miny,y); maxy=Math.max(maxy,y); }
    if(maxy<0) return;
    const y0=Math.max(0,Math.floor((miny-2)/TILE)*TILE), y1=Math.min(GRID-1,Math.floor((maxy+2)/TILE)*TILE+TILE-1);   // span snaps to tiles
    for(const x of cols) for(let y=y0; y<=y1; y++){ if(inGrid(x,y)){
      world.bridge.push({x,y, vertical:true, edge:(x===cols[0]?'w':x===cols[2]?'e':null), post:(y===y0||y===y1)}); world.bridgeSet.add(gi(x,y)); } }
  } else {
    // vertical creek: a 2-row-tall bridge spanning ALL water columns (+2 land each end)
    let by=Math.round((wy0+wy1)/2);
    for(let off=0; off<GRID; off++){ if(rowHasWater(by+off)){ by=by+off; break; } if(rowHasWater(by-off)){ by=by-off; break; } }
    const bty=Math.max(0,Math.min(GRID-TILE,Math.floor(by/TILE)*TILE));       // one whole tile row
    const rows=[bty, bty+1, bty+2];
    let minx=GRID, maxx=-1;
    for(const y of rows) for(let x=0;x<GRID;x++) if(isWater(x,y)){ minx=Math.min(minx,x); maxx=Math.max(maxx,x); }
    if(maxx<0) return;
    const x0=Math.max(0,Math.floor((minx-2)/TILE)*TILE), x1=Math.min(GRID-1,Math.floor((maxx+2)/TILE)*TILE+TILE-1);
    for(const y of rows) for(let x=x0; x<=x1; x++){ if(inGrid(x,y)){
      world.bridge.push({x,y, vertical:false, edge:(y===rows[0]?'n':y===rows[2]?'s':null), post:(x===x0||x===x1)}); world.bridgeSet.add(gi(x,y)); } }
  }
}

/* --- tile-grade pathfinding: on the FOREST map every walker travels tile-centre to

const TGRD = GRID/TILE;

  if(tx<0||ty<0||tx>=TGRD||ty>=TGRD) return false;
  const x0=tx*TILE, y0=ty*TILE;
  for(let dy=0;dy<TILE;dy++) for(let dx=0;dx<TILE;dx++) if(isBlocked(x0+dx,y0+dy)) return false;
  return true;
}
function findPathTiles(scx,scy,tcx,tcy){
  const N=TGRD*TGRD;

function findPath(sx,sy,tx,ty,size){

  size=size||1;

    for(let dy=0;dy<size;dy++)for(let dx=0;dx<size;dx++) if(isBlocked(x+dx,y+dy)) return true; return false; };
  if(!inGrid(tx,ty) || blk(tx,ty)) return null;
  if(sx===tx && sy===ty) return [];

  const N=GRID*GRID;
  if(!_pfG || _pfG.length!==N){ _pfG=new Float32Array(N); _pfPrev=new Int32Array(N); _pfMark=new Int32Array(N); _pfGen=0; }
  const gen=++_pfGen, G=_pfG, PREV=_pfPrev, MARK=_pfMark;   // MARK: gen = open/seen this run · -gen = closed this run

  const heap=[], hf=[];
  const hpush=(k,f)=>{ heap.push(k); hf.push(f); let i=heap.length-1;
    while(i>0){ const p=(i-1)>>1; if(hf[p]<=hf[i]) break;
      const tk=heap[p]; heap[p]=heap[i]; heap[i]=tk; const tf=hf[p]; hf[p]=hf[i]; hf[i]=tf; i=p; } };
  const hpop=()=>{ const k=heap[0], last=heap.pop(), lf=hf.pop();
    if(heap.length){ heap[0]=last; hf[0]=lf; let i=0;
      for(;;){ const l=2*i+1, r=l+1; let m=i;
        if(l<heap.length && hf[l]<hf[m]) m=l; if(r<heap.length && hf[r]<hf[m]) m=r; if(m===i) break;
        const tk=heap[m]; heap[m]=heap[i]; heap[i]=tk; const tf=hf[m]; hf[m]=hf[i]; hf[i]=tf; i=m; } }

  G[sk]=0; MARK[sk]=gen; PREV[sk]=-1; hpush(sk, H(sx,sy));

function fireGoblinArrow(g, T){            // loose an arrow at a player (5 HP on hit)

function goblinPathTo(g, cx, cy, size){

/* --- goblins are wary of town: unless a player has drawn their blood (aggro), they keep 15 tiles clear of the shops --- */
const SHOP_AVOID = 15;
function shopDist(cx,cy){                   // distance from a cell to the nearest shop building

    const dx=Math.max(s.x-cx, 0, cx-(s.x+s.w-1)), dy=Math.max(s.y-cy, 0, cy-(s.y+s.h-1));
    best=Math.min(best, Math.hypot(dx,dy)); }
  return best;
}
const inShopZone=(cx,cy)=> shopDist(cx,cy) < SHOP_AVOID;
function nearestShopCenter(cx,cy){

function goblinWander(g, minR, maxR){       // pick a reachable cell a good distance off and path there

function coopFoes(){                                    // player-like targets on the map CURRENTLY being simulated

function nearestFoe(x,y){                               // closest living target to (x,y) in world units

function coopHit(tp, amount, blood, ignoreArmor){       // apply an enemy's blow to whichever target it landed on

function updateMelee(g, dt){

    }

    if(!k.gpath.length || k.repathG<=0){ goblinPathTo(k, cellOf(T.px), cellOf(T.py), 1); k.repathG=0.5; }
    goblinMove(k, MOVE_SPEED*0.5, dt);
  } else { k.gpath=[]; k.atkCD=(k.atkCD||0)-dt;
    if(pd<=2.2 && k.atkCD<=0){ k.atkCD=1.5; coopHit(T, 10, true); } }
}
function updateBat(bt, dt){
  bt.wing=(bt.wing||0)+dt*16;
  const T=nearestFoe(bt.px, bt.py);
  const pd=Math.hypot(cellOf(bt.px)-cellOf(T.px), cellOf(bt.py)-cellOf(T.py));
  const tryMove=(dx,dy,sp)=>{ const nx=bt.px+dx*sp*dt, ny=bt.py+dy*sp*dt;
    if(!isBlocked(cellOf(nx), cellOf(ny))){ bt.px=nx; bt.py=ny; if(Math.abs(dx)>0.05) bt.faceLeft=dx<0; } };
  if(!T.dead && pd<=6){                         // swoop!
    const d=Math.hypot(T.px-bt.px, T.py-bt.py)||1;
    tryMove((T.px-bt.px)/d, (T.py-bt.py)/d, CELL*2.4);
    bt.atkCD=(bt.atkCD||0)-dt;
    if(pd<=1.1 && bt.atkCD<=0){ bt.atkCD=2; coopHit(T, 1, true); }
  } else {                                      // flutter around its roost
    bt.driftA=(bt.driftA||0)+dt*(0.6+Math.sin(bt.wing*0.13)*0.4);
    tryMove(Math.cos(bt.driftA), Math.sin(bt.driftA*1.3), CELL*0.9);
    const hd=Math.hypot(cellOf(bt.px)-bt.homeX, cellOf(bt.py)-bt.homeY);
    if(hd>7){ const d=Math.hypot((bt.homeX+0.5)*CELL-bt.px, (bt.homeY+0.5)*CELL-bt.py)||1;
      tryMove(((bt.homeX+0.5)*CELL-bt.px)/d, ((bt.homeY+0.5)*CELL-bt.py)/d, CELL*1.4); }
  }
}
function updateRat(rt, dt){
  const T=nearestFoe(rt.px, rt.py);
  const pd=Math.hypot(cellOf(rt.px)-cellOf(T.px), cellOf(rt.py)-cellOf(T.py));
  rt.hopAmt=0;
  if(!T.dead && pd<=5){                          // scurries in to bite
    if(pd<=1.2){ rt.gpath=[]; rt.faceLeft=T.px<rt.px; rt.atkCD=(rt.atkCD||0)-dt;
      if(rt.atkCD<=0){ rt.atkCD=1.5; coopHit(T, 2, true); } }
    else { rt.repathG=(rt.repathG||0)-dt;
      if(!rt.gpath.length || rt.repathG<=0){ goblinPathTo(rt, cellOf(T.px), cellOf(T.py), 1); rt.repathG=0.35; }
      goblinMove(rt, MOVE_SPEED*1.1, dt); }
  } else {                                       // idle scurrying
    if(rt.gpath && rt.gpath.length){ goblinMove(rt, MOVE_SPEED*0.7, dt); return; }
    rt.wanderCD=(rt.wanderCD||0)-dt;
    if(rt.wanderCD<=0){ if(goblinWander(rt, 2, 5)) rt.wanderCD=1.5+Math.random()*3; else rt.wanderCD=1; }
  }
}
function updateGoblins(dt){
  for(const g of goblins){
    if(g.dead){ g.deadT=(g.deadT||0)+dt; if(g.deadT>=180) g.gone=true; continue; }   // corpse -> bones(60s) -> gone(180s)
    tickSwing(g, dt);                                                // advance an in-progress club swing (lands the hit mid-swing)
    if(g.kind==='witch'){ updateWitch(g, dt); continue; }            // the goblin witch roams & raises the dead
    if(g.kind==='skeleton'||g.kind==='bigskel'){ updateSkeleton(g, dt); continue; }   // skeletons (and the king's bone-giants) hunt the player
    if(g.kind==='king'){ updateKing(g, dt); continue; }              // the Goblin King holds his court
    if(g.kind==='bat'){ updateBat(g, dt); continue; }                // cave bats flutter and swoop
    if(g.kind==='rat'){ updateRat(g, dt); continue; }                // giant rats scurry and bite
    if(g.kind==='archer'){ updateArcher(g, dt); continue; }          // archers shoot from range
    updateMelee(g, dt);                                              // claws (1 DMG) & boss club (8 DMG) chase & strike
  }
  for(const g of goblins){ if(!g.dead && !g.gone && g.kind!=='boss') separate(g, dt); }      // goblins avoid sharing a tile
  if(pendingGoblins.length){ for(const ng of pendingGoblins) goblins.push(ng); pendingGoblins.length=0; }   // add newly-raised skeletons
}

/* --- turtles: bask in the shallows, dive into deep water when the player nears --- */
const turtles = [];
const onBridge=(x,y)=> world.bridgeSet && world.bridgeSet.has(gi(x,y));
function segCrossesBridge(cx0,cy0,cx1,cy1){     // does a straight swim from A to B pass over any bridge cell?
  if(!world.bridgeSet || !world.bridgeSet.size) return false;
  const steps=Math.max(1, Math.ceil(Math.hypot(cx1-cx0, cy1-cy0)));
  for(let i=0;i<=steps;i++){ const t=i/steps; if(onBridge(Math.round(cx0+(cx1-cx0)*t), Math.round(cy0+(cy1-cy0)*t))) return true; }
  return false;
}
function nearestDeep(cx,cy){                    // closest deep-water tile (ring 2) that isn't under / across a bridge
  let best=null, bd=1e9, fb=null, fbd=1e9;
  for(const c of world.water){ if(c.ring!==2 || onBridge(c.x,c.y)) continue; const dd=Math.hypot(c.x-cx, c.y-cy);
    if(dd<fbd){ fbd=dd; fb=c; }                                              // fallback: nearest deep, ignoring bridge crossings
    if(!segCrossesBridge(cx,cy,c.x,c.y) && dd<bd){ bd=dd; best=c; } }        // preferred: no bridge in the way
  const pick=best||fb; return pick ? {x:pick.x, y:pick.y} : null;
}
function randShallowNear(cx,cy,minR,maxR){      // a random shallow tile a few tiles away (for turtle wandering) — never a bridge tile
  const opts=[];
  for(const c of world.water){ if(c.ring!==0 || onBridge(c.x,c.y)) continue; const dd=Math.hypot(c.x-cx,c.y-cy);
    if(dd>=minR&&dd<=maxR && !segCrossesBridge(cx,cy,c.x,c.y)) opts.push(c); }
  return opts.length ? opts[(Math.random()*opts.length)|0] : null;
}
const turtleWanderCD = ()=> 10+Math.random()*10;   // 10-20s between wanders
function spawnTurtles(){
  turtles.length=0;
  const shallow=world.water.filter(c=>c.ring===0 && !onBridge(c.x,c.y));   // don't hatch a turtle under a bridge
  if(!shallow.length) return;
  const used=new Set();
  for(let n=0;n<15;n++){
    let c=null;
    for(let i=0;i<60;i++){ const p=shallow[(Math.random()*shallow.length)|0];
      if(!used.has(p.y*GRID+p.x) && nearestDeep(p.x,p.y)){ c=p; break; } }
    if(!c) break;
    used.add(c.y*GRID+c.x);
    turtles.push({ hx:c.x, hy:c.y, px:(c.x+0.5)*CELL, py:(c.y+0.5)*CELL, state:'idle', dive:null, face:'S', rippleT:0, wanderCD:turtleWanderCD(), wander:null });
  }
}
function turtleMoveTo(t, tx, ty, speed, dt){    // swim straight toward a target tile centre; returns true on arrival
  const dx=tx-t.px, dy=ty-t.py, d=Math.hypot(dx,dy);
  if(d<0.001) return true;
  t.face=face8(dx,dy);
  const step=speed*dt;
  if(d<=step){ t.px=tx; t.py=ty; waterWake(t,dt); return true; }
  t.px+=dx/d*step; t.py+=dy/d*step; waterWake(t,dt);
  return false;
}
function updateTurtle(t, dt){
  const pd=Math.hypot(cellOf(t.px)-cellOf(player.px), cellOf(t.py)-cellOf(player.py));
  if(t.state==='idle'){
    if(pd<=TURTLE_FLEE_R){ const dv=nearestDeep(cellOf(t.px),cellOf(t.py)); if(dv){ t.dive=dv; t.state='flee'; return; } }
    t.wanderCD-=dt;                                                   // amble to a new shallow spot every 10-20s
    if(t.wanderCD<=0){ const w=randShallowNear(cellOf(t.px),cellOf(t.py),2,7); t.wanderCD=turtleWanderCD();
      if(w){ t.wander={x:w.x,y:w.y}; t.state='wander'; } }
  } else if(t.state==='wander'){
    if(pd<=TURTLE_FLEE_R){ const dv=nearestDeep(cellOf(t.px),cellOf(t.py)); if(dv){ t.dive=dv; t.state='flee'; return; } }  // scared mid-amble
    if(turtleMoveTo(t, (t.wander.x+0.5)*CELL, (t.wander.y+0.5)*CELL, TURTLE_SPEED, dt)){ t.hx=t.wander.x; t.hy=t.wander.y; t.state='idle'; }
  } else if(t.state==='flee'){
    if(turtleMoveTo(t, (t.dive.x+0.5)*CELL, (t.dive.y+0.5)*CELL, TURTLE_RUN, dt)){
      spawnSplash(t.px, t.py); t.state='hidden'; t.hideT=0;            // reached deep water -> vanish
    }
  } else if(t.state==='hidden'){
    t.hideT=(t.hideT||0)+dt;
    const pdd=Math.hypot(t.dive.x-cellOf(player.px), t.dive.y-cellOf(player.py));
    if(t.hideT>=TURTLE_HIDE_MIN && pdd>=TURTLE_SAFE_R){                // stays down at least 10s, then surfaces once the player is far
      t.px=(t.dive.x+0.5)*CELL; t.py=(t.dive.y+0.5)*CELL; spawnSplash(t.px, t.py); t.state='return';
    }
  } else if(t.state==='return'){
    if(pd<=TURTLE_FLEE_R){ const dv=nearestDeep(cellOf(t.px),cellOf(t.py)); if(dv){ t.dive=dv; t.state='flee'; return; } }  // caught again
    if(turtleMoveTo(t, (t.hx+0.5)*CELL, (t.hy+0.5)*CELL, TURTLE_SPEED, dt)) t.state='idle';
  }
}
function moveTo(wx, wy){
  const cx = Math.max(0,Math.min(GRID-1, Math.floor(wx/CELL)));
  const cy = Math.max(0,Math.min(GRID-1, Math.floor(wy/CELL)));
  const dest = nearestOpen(cx,cy); if(!dest) return;
  const scx = Math.max(0,Math.min(GRID-1, Math.floor(player.px/CELL)));
  const scy = Math.max(0,Math.min(GRID-1, Math.floor(player.py/CELL)));
  const cells = findPath(scx,scy,dest.x,dest.y); if(!cells) return;
  player.path = cells.map(c=>({ x:(c.x+0.5)*CELL, y:(c.y+0.5)*CELL }));
  player.targetCell = dest;
  camFollow=true;                                   // setting out — the camera falls back in behind the hero
}

function updatePlayer(dt){
  if(!player.path.length){
    player.targetCell=null;
    if(player.goShop){ const d=shopDoorCell();                    // arrived at the door → open the shop
      if(Math.abs(cellOf(player.px)-d.x)<=2 && Math.abs(cellOf(player.py)-d.y)<=2) openShop(); else player.goShop=false; }
    if(player.goStall){ const d=stallDoorCell();
      if(Math.abs(cellOf(player.px)-d.x)<=2 && Math.abs(cellOf(player.py)-d.y)<=2) openStall(); else player.goStall=false; }
    if(player.goButcher){ const d=butcherDoorCell();
      if(Math.abs(cellOf(player.px)-d.x)<=2 && Math.abs(cellOf(player.py)-d.y)<=2) openButcher(); else player.goButcher=false; }
    if(player.goArmor){ const d=armorDoorCell();
      if(Math.abs(cellOf(player.px)-d.x)<=2 && Math.abs(cellOf(player.py)-d.y)<=2) openArmor(); else player.goArmor=false; }
    if(player.goAltar){ const a=henge.altar;
      if(Math.abs(cellOf(player.px)-a.x)<=2 && Math.abs(cellOf(player.py)-a.y)<=2) openAltar(); else player.goAltar=false; }
    if(player.goCave){ const d2=cave.door;
      if(Math.abs(cellOf(player.px)-d2.x)<=2 && Math.abs(cellOf(player.py)-d2.y)<=2){
        if(!cave.unlocked){
          if(player.goblinKey){ setCaveUnlocked();
            if(typeof net!=='undefined' && net.mode==='guest' && net.connected) netSend({t:'cave'});
            addFloat('The Goblin Key turns — the cave stands open!', player.px, player.py-CELL*2.2, '#e7c877'); }
          else addFloat('Locked tight — it needs the Goblin Key', player.px, player.py-CELL*2.2, '#cfd6de');
        }
        else enterDungeon(true);                          // the door stands open — descend
      }
      player.goCave=false; }
    if(player.goExit){ const e2=dungeon.exit;
      if(mapMode==='dungeon' && Math.abs(cellOf(player.px)-e2.x)<=1 && Math.abs(cellOf(player.py)-e2.y)<=1) exitDungeon(true);
      player.goExit=false; }
    if(player.goForge){ const f2=dungeon.forge;
      if(mapMode==='dungeon' && Math.abs(cellOf(player.px)-f2.x)<=1 && Math.abs(cellOf(player.py)-f2.y)<=1){
        openShopUI('The Forge', FORGE_ITEMS); player.goForge=false; player.path=[]; player.targetCell=null;
        player.face=face8((f2.x+0.5)*CELL-player.px, (f2.y+0.5)*CELL-player.py); }
      else player.goForge=false; }
    return;
  }
  const node = player.path[0];
  const dx = node.x-player.px, dy = node.y-player.py, d = Math.hypot(dx,dy);
  if(d>0.001){ player.angle = Math.atan2(dy,dx); player.face = face8(dx,dy); }
  const step = MOVE_SPEED*(player.speedMul||1)*dt;
  if(d<=step){ player.px=node.x; player.py=node.y; player.path.shift(); if(!player.path.length) player.targetCell=null; }
  else { player.px += dx/d*step; player.py += dy/d*step; }
}

const buildUI = { open:false };
const siteUI  = { open:false, id:null };
let buildMode = null;                 // {kind, tx, ty} — tx/ty in TILES; null tx = nothing hovered yet
let _buildConfirmBox = null;          // screen-space "Build here" button while the ghost is green
let _siteSeq = 1;
function buildingPlaced(kind){ return kind==='shop'?shop.placed : kind==='armor'?armorShop.placed : kind==='stall'?stall.placed : butcher.placed; }
function siteById(id){ return (world.sites||[]).find(s=>s.id===id); }
function siteAt(cx,cy){ for(const s of (world.sites||[])){ const n=BUILDINGS[s.kind].tiles*TILE;
  if(cx>=s.tx*TILE && cx<s.tx*TILE+n && cy>=s.ty*TILE && cy<s.ty*TILE+n) return s; } return null; }
function buildFootprintFree(kind, tx, ty){          // every cell of the claimed tiles must be open ground
  const B=BUILDINGS[kind]; if(!B) return false;
  const n=B.tiles*TILE, x0=tx*TILE, y0=ty*TILE;
  if(tx<0||ty<0||x0+n>GRID||y0+n>GRID) return false;
  for(let dy=0;dy<n;dy++) for(let dx=0;dx<n;dx++){ const x=x0+dx, y=y0+dy;
    if(isBlocked(x,y) || world.terrain[gi(x,y)]!==0 || isCrop(x,y)) return false;
    if(world.bridgeSet && world.bridgeSet.has(gi(x,y))) return false; }
  for(const s of (world.sites||[])){ const sn2=BUILDINGS[s.kind].tiles;   // don't overlap another site
    if(!(tx+B.tiles<=s.tx || s.tx+sn2<=tx || ty+B.tiles<=s.ty || s.ty+sn2<=ty)) return false; }
  return true;
}
function addSite(kind, tx, ty){                     // authoritative (host / solo)
  if(!BUILDINGS[kind] || buildingPlaced(kind)) return null;
  if((world.sites||[]).some(s=>s.kind===kind)) return null;      // one site per building kind
  if(!buildFootprintFree(kind, tx, ty)) return null;
  const s={ id:_siteSeq++, kind, tx, ty, need:BUILDINGS[kind].cost, have:0 };
  world.sites.push(s); return s;
}
function siteAddWood(s, n){                         // authoritative
  if(!s || n<=0) return; s.have=Math.min(s.need, s.have+n);
  if(s.have>=s.need) completeSite(s);
}
function completeSite(s){
  const x0=s.tx*TILE, y0=s.ty*TILE;
  if(s.kind==='shop') placeShopAt(x0+1, y0+1);                   // 4x4 building centred in its 2x2 claimed tiles
  else if(s.kind==='armor') placeArmorShopAt(x0+1, y0+1);
  else if(s.kind==='stall') placeStallAt(x0, y0);                // 2x2 stall in its single tile
  else if(s.kind==='butcher') placeButcherAt(x0, y0);
  const i=world.sites.indexOf(s); if(i>=0) world.sites.splice(i,1);
  if(!DEDICATED) addFloat('The '+BUILDINGS[s.kind].name+' is built!', (x0+1.5)*CELL, y0*CELL, '#ffd44d');
}
function confirmBuildSite(){

function siteContribute(){                          // the Add Wood button on a site's panel
  const s=siteById(siteUI.id); if(!s){ siteUI.open=false; return; }
  const dTiles=Math.hypot(player.px/CELL-(s.tx*TILE+BUILDINGS[s.kind].tiles*TILE/2), player.py/CELL-(s.ty*TILE+BUILDINGS[s.kind].tiles*TILE/2));
  if(dTiles>5){ shop.msg='Walk closer to the site'; shop.msgT=2; return; }
  const n=Math.min(5, s.need-s.have, player.wood); if(n<=0){ shop.msg=player.wood<=0?'You have no wood':''; shop.msgT=2; return; }

  if(typeof net!=='undefined' && net.mode==='guest' && net.connected){ s.have=Math.min(s.need, s.have+n); netSend({t:'siteWood', map:mapMode, i:s.id, n}); }
  else siteAddWood(s, n);

function craftItem(it){                             // buy an item, paid in its currency (wood by default, skins for armor)
  if(it.has && it.has()){ shop.msg='Already owned'; shop.msgT=2.5; return; }   // single-instance items
  if(ITEM_LBS[it.key]!=null && !(player[it.key]>0) && packTypesUsed()+1>packSlots()){   // a NEW kind of item needs a free pack slot
    shop.msg='No room in your pack! ('+packTypesUsed()+'/'+packSlots()+' slots)'; shop.msgT=2.5; return; }
  if(it.can && it.pay){                             // forge work: custom costs (iron + silver)
    if(it.can()){ it.pay(); it.give(); shop.msg=it.name+' '+(it.verb||'forged')+'!'; shop.msgT=2.5; }
    else { shop.msg=it.fail?it.fail():'Not enough materials'; shop.msgT=2.5; }
    return;
  }
  const cur=it.cur||'wood';
  if(player[cur]>=it.cost){ player[cur]-=it.cost; it.give();
    shop.msg=it.name.replace(' (+10)','').replace(' (+5)','')+' '+(it.verb||'crafted')+'!'; shop.msgT=2.5; }
  else { shop.msg='Not enough '+cur+' ('+player[cur]+'/'+it.cost+')'; shop.msgT=2.5; }
}
/* --- altar rites: souls (and the Eye of the Witch) buy magic, blessed onto ONE chosen piece of gear --- */

function altarGear(){                                // everything you carry that the stones can bless

function altarBless(k, major){                       // pay the stones; the chosen item drinks the magic
  const tier=player.magic[k]||0;
  if(major){
    if(tier>=1){ shop.msg='It is already enchanted'; }
    else if(player.souls<20){ shop.msg='Not enough souls ('+player.souls+'/20)'; }
    else if(player.witchEye<1){ shop.msg='Requires the Eye of the Witch'; }
    else { player.souls-=20; player.witchEye--; player.magic[k]=1; shop.msg='Enchantment granted — +100%!'; }
  } else {
    if(tier>=1){ shop.msg='It is already enchanted'; }
    else if(tier>=0.2){ shop.msg='It is already blessed'; }
    else if(player.souls<5){ shop.msg='Not enough souls ('+player.souls+'/5)'; }
    else { player.souls-=5; player.magic[k]=0.2; shop.msg='Blessing granted — +20%!'; }

function altarLayout(){
  const pw=Math.min(canvas.width*0.94, Math.max(540, 460*DPR));
  const headH=Math.max(50,48*DPR), descH=Math.max(66,60*DPR), rowH=Math.max(54,48*DPR), footH=Math.max(56,50*DPR);
  const gear=altarGear();
  const ph=headH+descH+Math.max(1,gear.length)*rowH+footH;
  const px=(canvas.width-pw)/2, py=(canvas.height-ph)/2, pad=pw*0.045;
  const cs=Math.max(22,24*DPR);
  const closeBtn={ x:px+pw-pad*0.6-cs, y:py+pad*0.5, w:cs, h:cs };
  const bw=pw*0.155, gap=pad*0.35;
  const rows=gear.map((g,i)=>{ const y=py+headH+descH+i*rowH, bh=rowH*0.6;
    return { g, y, h:rowH,
      minor:{ x:px+pw-pad-bw*2-gap, y:y+(rowH-bh)/2, w:bw, h:bh },
      major:{ x:px+pw-pad-bw,       y:y+(rowH-bh)/2, w:bw, h:bh } }; });
  return { px,py,pw,ph,pad,headH,descH,rowH,footH,closeBtn,rows,gear };
}

function altarClick(cx,cy){

    if(inR(row.minor)){ altarBless(row.g.k, false); return; }

function setTool(t){                                // switching tools cancels whatever we were doing

// Taps land in world space at the creature's FEET, but the sprite's body rises ~1m above them

function tapDist(wx,wy,px,py){ return Math.min(Math.hypot(px-wx, py-wy), Math.hypot(px-wx, (py-CELL*0.7)-wy)); }
function creatureAt(wx,wy){                         // nearest living deer/goblin under a tap

  for(const d of allDeer){ if(d.dead||d.gone) continue; const dd=tapDist(wx,wy,d.px,d.py); if(dd<bd){ bd=dd; best={kind:'deer', ref:d}; } }
  for(const g of goblins){ if(g.dead) continue; const gx=(g.px!=null?g.px:(g.x+0.5)*CELL), gy=(g.py!=null?g.py:(g.y+0.5)*CELL); const dd=tapDist(wx,wy,gx,gy); if(dd<bd){ bd=dd; best={kind:'goblin', ref:g}; } }

}
function carcassAt(wx,wy){                           // nearest FRESH deer carcass (before it rots to bones) under a tap

function startCarcass(d){                            // walk to a carcass, then harvest it for stamina

function updateCarcass(dt){

/* --- souls: loot a slain enemy's fresh body for its soul. Tougher enemies yield more. --- */

function pathNearCreature(A){
  const p=creaturePos(A.kind, A.ref); const tcx=cellOf(p.x), tcy=cellOf(p.y);
  const dest=nearestOpen(tcx,tcy); if(!dest) return;
  const cells=findPath(cellOf(player.px), cellOf(player.py), dest.x, dest.y);
  if(cells) { player.path=cells.map(c=>({x:(c.x+0.5)*CELL, y:(c.y+0.5)*CELL})); player.targetCell=dest; }
}
function killCreature(kind, cr, fromRemote){
  const p=creaturePos(kind, cr);
  spawnBlood(p.x, p.y-CELL*0.35, 26, true);         // big bloody spray on death
  if(kind==='deer'){ deerDies(cr); spookNearbyDeer(cr); }   // no skins on the kill — you must skin the carcass
  else { goblinDies(cr); if(cr.kind==='boss') bossSlain(fromRemote); if(cr.kind==='king') kingSlain(fromRemote); }
}
function spookNearbyDeer(dead){                     // a fresh kill panics the herd: deer within 10 tiles bolt 20 away
  for(const d of allDeer){ if(d===dead || d.dead || d.gone) continue;
    if(Math.hypot(cellOf(d.px)-cellOf(dead.px), cellOf(d.py)-cellOf(dead.py)) <= 10){
      d.spookX=dead.px; d.spookY=dead.py; d.spookRun=true; d.path=[]; d.state='flee'; } }
}
const WEAPON_DMG = { club:[3,6], bow:[4,6], longbow:[6,9], sword:[7,11], gaxe:[24,36] };   // sword ≈ a blessed longbow; the Gleaming Axe = 2x an enchanted longbow
function rollDmg(w){ const r=WEAPON_DMG[w]||[1,1]; const base=r[0]+Math.floor(Math.random()*(r[1]-r[0]+1));
  return Math.round(base*(1+((player.magic&&player.magic[w])||0))); }   // that weapon's own blessing multiplies the blow
function alertGoblins(src){                          // an attacked goblin rallies its kin: all within 10 tiles turn on the player
  const sp=creaturePos('goblin', src);
  for(const g of goblins){ if(g.dead||g.gone) continue;
    if(Math.hypot(cellOf(g.px)-cellOf(sp.x), cellOf(g.py)-cellOf(sp.y)) <= 10) g.aggro=true; }
}
function damageCreature(kind, cr, amount, fromRemote){   // deal `amount` damage; kill at 0 HP, else wound
  if(creatureDead(kind, cr)) return;
  cr.hp = (cr.hp==null?1:cr.hp) - amount;
  const p=creaturePos(kind, cr);
  if(kind==='goblin') alertGoblins(cr);             // struck goblin summons nearby goblins onto the player
  if(cr.hp<=0) killCreature(kind, cr, fromRemote);
  else spawnBlood(p.x, p.y-CELL*0.35, 9, false);    // wounded — a smaller spray
}
function coopPlayerDamage(kind, cr, amount){         // a player's blow: host applies it; a guest relays it to the host
  if(typeof net!=='undefined' && net.mode==='guest'){ netSend({t:'dmg', map:mapMode, nid:cr.nid, kind, amount}); return; }
  damageCreature(kind, cr, amount);
}
function grantBossReward(){                        // the boss's hoard: a fortune and the key to the cave
  player.guld=(player.guld||0)+10000; player.goblinKey=1;
  addFloat('+10,000 GULD!', player.px, player.py-CELL*2.7, '#ffd44d');
  addFloat('+ the Goblin Key', player.px, player.py-CELL*2.2, '#e7c877');
}
function grantKingReward(){
  player.guld=(player.guld||0)+100000;
  addFloat('+100,000 GULD!', player.px, player.py-CELL*2.7, '#ffd44d');
  addFloat('The Goblin King is slain!', player.px, player.py-CELL*2.2, '#e7c877');
}
function kingSlain(fromRemote){
  grantKingReward();
  if(typeof net!=='undefined' && net.mode==='host' && net.connected) netSend({t:'kingKill'});
}
function bossSlain(fromRemote){
  grantBossReward();                                 // this screen's player collects…
  if(typeof net!=='undefined' && net.mode==='host' && net.connected) netSend({t:'bossKill'});   // …and the partner shares the spoils
}
function spawnMagicHit(x, y, tier){                  // a burst of arcane sparks when a magic weapon lands
  if(!(tier>0)) return;
  const t2=tier>=1;
  const cols=t2?['#ffa040','#ffd27a','#ff7b2e']:['#6b9dff','#a9c6ff','#4a7bff'];
  for(let i=0;i<12;i++){ const a=Math.random()*Math.PI*2, sp=40+Math.random()*120;
    addParticle({kind:'bit', x, y:y-CELL*0.3, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-40, g:60,
      life:0.4+Math.random()*0.35, max:0.8, size:CELL*(0.06+Math.random()*0.05), color:cols[(Math.random()*cols.length)|0]}); }
  addParticle({kind:'ripple', x, y:y-CELL*0.2, life:0.35, max:0.35, size:CELL*0.15, grow:CELL*0.9, color:t2?'#ffb050':'#7fa5ff'});
}
function fireArrow(cr, kind){
  const p=creaturePos(kind, cr), sx=player.px, sy=player.py-CELL*0.55;
  const bw2=player.equipRanged||'bow', mt=(player.magic&&player.magic[bw2])||0;
  const spd=CELL*9*(mt>=1?1.3:mt>0?1.1:1);                       // blessed arrows fly 10% faster; enchanted 30%
  const tx=p.x, ty=p.y-CELL*0.3, dist=Math.hypot(tx-sx, ty-sy)||1, dur=Math.max(0.28, dist/spd);
  addParticle({ kind:'arrow', x:sx, y:sy, x0:sx, y0:sy, tx, ty, t:0, dur, life:99, max:99,
    ang:Math.atan2(ty-sy, tx-sx), ref:cr, tkind:kind, w:bw2, mt });
  if(typeof netSendArrowFX==='function') netSendArrowFX(sx, sy, tx, ty, dur, mt);   // let the other player watch it fly
}
function startPunch(prop){                          // walk over to a crate/barrel and punch it apart
  player.propTarget=prop; player.punchT=0; player.attack=null; player.harvestTarget=null; player.carcassTarget=null; player.soulTarget=null;
  player.chopTree=null; player.chopping=false; player.goShop=false; player.repathP=0;
}
function pathToCell(cx,cy){
  const dest=nearestOpen(cx,cy); if(!dest) return;
  const cells=findPath(cellOf(player.px), cellOf(player.py), dest.x, dest.y);
  if(cells){ player.path=cells.map(c=>({x:(c.x+0.5)*CELL, y:(c.y+0.5)*CELL})); player.targetCell=dest; camFollow=true; }
}
function updatePunch(dt){
  const p=player.propTarget; if(!p) return true;
  if(world.shopProps.indexOf(p)<0){ player.propTarget=null; player.punchT=0; return true; }   // already gone
  const px=(p.x+0.5)*CELL, py=(p.y+0.5)*CELL;
  const dist=Math.hypot((player.px-px)/CELL, (player.py-py)/CELL);
  if(dist<=2.3){
    player.path=[]; player.targetCell=null; player.face=face8(px-player.px, py-player.py);
    player.punchT+=dt;                                                     // brief wind-up so it reads as a punch
    if(player.punchT>=0.24){ breakProp(p); player.propTarget=null; player.punchT=0; }
  } else {
    player.punchT=0; player.repathP-=dt;
    if(!player.path.length || player.repathP<=0){ pathToCell(p.x, p.y); player.repathP=0.45; }
  }
  return false;   // punching owns the player this frame
}
function updateCombat(dt){
  if(player.soulTarget){ if(!updateSoulLoot(dt)) return; }     // heading to / looting an enemy body for its soul
  if(player.carcassTarget){ if(!updateCarcass(dt)) return; }   // heading to / harvesting a carcass
  if(player.harvestTarget!=null){ if(!updateHarvest(dt)) return; }   // heading to / reaping wheat
  if(player.propTarget){ if(!updatePunch(dt)) return; }   // heading to / punching a crate
  if(player.swingCD==null) player.swingCD=0;         // belt & braces: never let the cooldown gate start undefined
  if(player._packMsgT>0) player._packMsgT-=dt;
  if(player.swingCD>0) player.swingCD-=dt;           // the weapon's rhythm lives on the PLAYER — retargeting can't reset it
  const A=player.attack; if(!A) return;
  if(creatureDead(A.kind, A.ref)){ player.attack=null; return; }
  const p=creaturePos(A.kind, A.ref);
  const distTiles=Math.hypot((player.px-p.x)/CELL, (player.py-p.y)/CELL);
  const range=A.ranged?8:1.6;
  if(distTiles<=range){
    player.path=[]; player.targetCell=null; player.face=face8(p.x-player.px, p.y-player.py);
    if(A.ranged){
      if(player.arrows<=0){ player.attack=null; }                        // out of arrows → stop
      else if(player.swingCD<=0){ player.swingCD=0.8; player.arrows--; fireArrow(A.ref, A.kind); }   // keep loosing arrows (each does the equipped bow's DMG on hit)
    } else if(A.fist){                                                   // bare-handed: punch for 2 HP
      if(player.punchT>0) player.punchT-=dt;
      if(player.swingCD<=0){ player.swingCD=0.7; player.punchT=0.24; coopPlayerDamage(A.kind, A.ref, 2); }
    } else if(player.swingCD<=0){ player.swingCD=0.6; const mk=player.equipMelee||'club'; coopPlayerDamage(A.kind, A.ref, rollDmg(mk));
      if((player.magic[mk]||0)>0){ const mp=creaturePos(A.kind, A.ref); spawnMagicHit(mp.x, mp.y, player.magic[mk]); } }  // keep swinging the equipped melee weapon
  } else {
    A.repath-=dt;
    if(!player.path.length || A.repath<=0){ pathNearCreature(A); A.repath=0.45; }
  }
}
function goblinDies(g){ g.dead=true; g.deadT=0; g.gone=false; g.hopAmt=0; g.jT=null; }

/* --- tree chopping with the axe tool --- */
function treeAt(cx,cy){
  if(!isTree(cx,cy)) return null;
  for(const t of world.trees) if(cx>=t.x&&cx<t.x+TILE&&cy>=t.y&&cy<t.y+TILE) return t;
  return null;
}
function chopApproach(tree){                       // nearest reachable neighbouring TILE centre beside the tree
  const cells=[], pcx=cellOf(player.px), pcy=cellOf(player.py);
  const ttx=Math.floor(tree.x/TILE), tty=Math.floor(tree.y/TILE);
  for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){
    if(!dx&&!dy) continue;
    const nx=ttx+dx, ny=tty+dy; if(!tileWalkable(nx,ny)) continue;
    cells.push({x:nx*TILE+1, y:ny*TILE+1});
  }
  cells.sort((a,b)=> (Math.hypot(a.x-pcx,a.y-pcy)-Math.hypot(b.x-pcx,b.y-pcy)));
  for(const c of cells){ const path=findPath(pcx,pcy,c.x,c.y); if(path) return {cell:c, path}; }
  return null;
}
function beginChop(tree){
  const ap=chopApproach(tree); if(!ap) return false;
  player.chopTree=tree; player.chopping=false; player.chopT=0; player.targetCell=null;
  player.path = ap.path.map(c=>({x:(c.x+0.5)*CELL, y:(c.y+0.5)*CELL}));
  return true;
}
function rockAt(cx,cy){ if(mapMode!=='dungeon'||!world.rocks) return null;
  for(const r of world.rocks){ if(!r.gone && r.x===cx && r.y===cy) return r; } return null; }
function beginMine(r){                             // walk to the ore and swing the pick
  player.mineRock=r; player.mineT=0; player.chopTree=null; player.chopping=false;
  player.attack=null; player.propTarget=null; player.harvestTarget=null; player.carcassTarget=null; player.soulTarget=null;
  const pcx=cellOf(player.px), pcy=cellOf(player.py), cands=[];
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){ if(!dx&&!dy) continue;
    const x=r.x+dx, y=r.y+dy; if(inGrid(x,y)&&!isBlocked(x,y)) cands.push({x,y}); }
  cands.sort((a,b)=>Math.hypot(a.x-pcx,a.y-pcy)-Math.hypot(b.x-pcx,b.y-pcy));
  for(const c of cands){ const path=findPath(pcx,pcy,c.x,c.y); if(path){ player.path=path.map(cc=>({x:(cc.x+0.5)*CELL, y:(cc.y+0.5)*CELL})); return true; } }
  player.mineRock=null; return false;
}
function updateMine(dt){
  const r=player.mineRock; if(!r) return;
  if(r.gone){ player.mineRock=null; return; }
  if(player.path.length) return;                   // still walking over
  if(Math.hypot(cellOf(player.px)-r.x, cellOf(player.py)-r.y)>1.6){ player.mineRock=null; return; }
  player.face=face4((r.x+0.5)*CELL-player.px, (r.y+0.5)*CELL-player.py);
  player.mineT+=dt; player.chipT=(player.chipT||0)-dt;
  if(player.chipT<=0){ player.chipT=0.55;          // stone chips fly
    for(let i=0;i<5;i++) addParticle({kind:'bit', x:(r.x+0.5)*CELL+(Math.random()-0.5)*CELL*0.5, y:(r.y+0.35)*CELL,
      vx:(Math.random()-0.5)*85, vy:-30-Math.random()*45, g:210, life:0.5, max:0.5, size:CELL*0.08,
      color: r.type==='silver'?'#aab4be':'#7d6a58'}); }
  const need=r.type==='silver'?25:10;              // silver is stubborn: 25s vs iron's 10s
  if(player.mineT>=need){
    const err=canCarry(5*(r.type==='silver'?ITEM_LBS.silver:ITEM_LBS.iron), r.type==='silver'?((player.silver||0)>0?0:1):((player.iron||0)>0?0:1));
    if(err){ packRefuse(err); player.mineRock=null; player.mineT=0; return; }   // the vein keeps — the ore stays in the rock
    r.gone=true; if(world.rockBlock) world.rockBlock.delete(gi(r.x,r.y));
    if(r.type==='silver'){ player.silver+=5; addFloat('+5 silver', player.px, player.py-CELL*1.6, '#c8d2dc'); }
    else { player.iron+=5; addFloat('+5 iron', player.px, player.py-CELL*1.6, '#b9885c'); }
    if(typeof net!=='undefined' && net.mode==='guest' && net.connected) netSend({t:'mined', map:mapMode, i:world.rocks.indexOf(r)});
    player.mineRock=null; player.mineT=0;
  }
}
function updateChop(dt){
  const tree=player.chopTree; if(!tree) return;
  if(!world.trees.includes(tree)){ player.chopTree=null; player.chopping=false; return; }
  if(player.path.length) return;                   // still walking over
  const pcx=cellOf(player.px), pcy=cellOf(player.py);
  if(!(pcx>=tree.x-2&&pcx<=tree.x+TILE+1 && pcy>=tree.y-2&&pcy<=tree.y+TILE+1)){ player.chopTree=null; return; }
  player.face = face4((tree.x+1.5)*CELL-player.px, (tree.y+1.5)*CELL-player.py);   // face the tree
  player.chopping=true; player.chopT+=dt;
  // a swing lands about once a second — burst of chips on each hit
  player.chipT-=dt; if(player.chipT<=0){ player.chipT=1.0; for(let i=0;i<7;i++) spawnChip((tree.x+1.5)*CELL, (tree.y+2.4)*CELL); }
  if(player.chopT>=CHOP_TIME){
    const err=canCarry(5*ITEM_LBS.wood, player.wood>0?0:1);
    if(err){ packRefuse(err); player.chopTree=null; player.chopping=false; player.chopT=0; return; }   // too laden to haul the timber — the tree stands
    startFell(tree); player.wood+=5; addFloat('+5 wood', player.px, player.py-CELL*1.5, PAL.plankHi); player.chopTree=null; player.chopping=false; player.chopT=0; }  // +5 wood
}
function fellTree(tree, fromWX){                     // topple a tree away from `fromWX`
  const dir = fromWX < (tree.x+1.5)*CELL ? 1 : -1;
  fallingTrees.push({ x:tree.x, y:tree.y, ang:0, dir, t:0 });
  const i=world.trees.indexOf(tree); if(i>=0) world.trees.splice(i,1);
  for(let dy=0;dy<TILE;dy++) for(let dx=0;dx<TILE;dx++) world.terrain[gi(tree.x+dx,tree.y+dy)]=0;
}
function startFell(tree){ fellTree(tree, player.px); }   // player chops → topple away from the player
function updateFelling(dt){
  for(let i=fallingTrees.length-1;i>=0;i--){ const ft=fallingTrees[i]; ft.t+=dt;
    ft.ang=Math.min(Math.PI/2, (ft.t/FALL_TIME)*(Math.PI/2));
    if(ft.t>=FALL_TIME){ treeImpact(ft.x, ft.y); world.stumps.push({x:ft.x, y:ft.y, regrow:STUMP_REGROW}); fallingTrees.splice(i,1); }
  }
}
function updateStumps(dt){
  for(let i=world.stumps.length-1;i>=0;i--){ const s=world.stumps[i]; s.regrow-=dt;
    if(s.regrow<=0){
      let ok=true; for(let dy=0;dy<TILE&&ok;dy++) for(let dx=0;dx<TILE&&ok;dx++) if(!inGrid(s.x+dx,s.y+dy) || world.terrain[gi(s.x+dx,s.y+dy)]!==0) ok=false;
      if(ok){ for(let dy=0;dy<TILE;dy++) for(let dx=0;dx<TILE;dx++) world.terrain[gi(s.x+dx,s.y+dy)]=1; world.trees.push({x:s.x,y:s.y,grow:0}); world.stumps.splice(i,1); }  // grow in
      else s.regrow=10;
    }
  }
  for(const t of world.trees){ if(t.grow!=null && t.grow<1) t.grow=Math.min(1, t.grow+dt/GROW_TIME); }
}
// crop plots (tilled 2x2 patches). Can't go over trees, buildings, crates/boxes, or water.
const cropBlocked = (x,y)=> !inGrid(x,y) || isTree(x,y) || isWater(x,y) || isShopCell(x,y) || isStallCell(x,y) || isArmorCell(x,y) || (world.shopBlock && world.shopBlock.has(gi(x,y)));
const isCrop = (x,y)=> world.crops.has(gi(x,y));
function tillOrUntill(cx,cy){
  const bx=cx-(cx%TILE), by=cy-(cy%TILE);                        // snap to the 3m tile — one plot IS one tile
  const cells=[]; for(let dy=0;dy<TILE;dy++) for(let dx=0;dx<TILE;dx++) cells.push([bx+dx,by+dy]);
  if(cells.some(([x,y])=> inGrid(x,y)&&isCrop(x,y))){            // already a plot → hoe the whole tile back to grass
    for(const [x,y] of cells) if(inGrid(x,y)) world.crops.delete(gi(x,y));
    if(typeof net!=='undefined' && net.mode==='guest') netSend({t:'cropAct', map:mapMode, op:'till', cx, cy});   // host toggles the same tile
    return;
  }
  if(cells.some(([x,y])=> cropBlocked(x,y))) return;             // the whole tile must be open ground — all or nothing
  for(const [x,y] of cells){
    const bi=world.bushes.findIndex(b=>b.x===x&&b.y===y); if(bi>=0) world.bushes.splice(bi,1);   // plow the bush under
    world.crops.set(gi(x,y), {stage:'till', t:0});
  }
  if(typeof net!=='undefined' && net.mode==='guest') netSend({t:'cropAct', map:mapMode, op:'till', cx, cy});   // mirror the plot on the host
}
function plantSeeds(cx,cy){                        // sow wheat: ONE seed plants the whole 3m plot
  if(player.seeds<=0) return;
  const bx=cx-(cx%TILE), by=cy-(cy%TILE), cells=[];
  for(let dy=0;dy<TILE;dy++) for(let dx=0;dx<TILE;dx++){ const c=world.crops.get(gi(bx+dx,by+dy));
    if(c && c.stage==='till') cells.push(c); }
  if(!cells.length) return;
  for(const c of cells){ c.stage='seed'; c.t=0; }
  player.seeds--; if(player.seeds<=0 && player.tool==='seeds') player.tool=null;   // out of seeds → nothing selected
  if(typeof net!=='undefined' && net.mode==='guest') netSend({t:'cropAct', map:mapMode, op:'plant', key:gi(bx,by)});   // host sows the same plot
}
function updateCrops(dt){                          // sown seeds sprout into wheat after 10s
  for(const c of world.crops.values()){ if(c.stage==='seed'){ c.t+=dt; if(c.t>=10) c.stage='wheat'; } }
}
function onTapWorld(wx,wy){
  const cx=Math.max(0,Math.min(GRID-1,Math.floor(wx/CELL))), cy=Math.max(0,Math.min(GRID-1,Math.floor(wy/CELL)));
  if(player.tool==='hoe'){ tillOrUntill(cx,cy); return; }        // till / untill a crop plot
  if(player.tool==='seeds'){ plantSeeds(cx,cy); return; }        // sow wheat on a plot
  if(player.tool==='pickaxe'){
    const rk=rockAt(cx,cy);
    if(rk){ beginMine(rk); return; }
    player.tool=null; return;                      // tapped ground with the pick → put it away
  }
  if(player.tool==='axe'){
    const tree=treeAt(cx,cy);
    if(tree){ beginChop(tree); return; }
    player.tool=null;                              // tapped ground with tool → deactivate
  } else if(player.tool==='club' || player.tool==='sword' || player.tool==='gaxe' || player.tool==='bow' || player.tool==='longbow'){
    const cr=creatureAt(wx,wy);
    if(cr){ startAttack(cr, player.tool==='bow'||player.tool==='longbow'); return; }   // hunt the tapped creature
  } else if(!player.tool){
    const cr=creatureAt(wx,wy);
    if(cr && cr.kind==='goblin'){ startAttack(cr, false, true); return; }   // bare-handed → walk up and punch the goblin
  }
  const carc=carcassAt(wx,wy);
  if(carc){ startCarcass(carc); return; }          // tapped a fresh carcass → skin it for hides (+ stamina)
  const body=goblinCorpseAt(wx,wy);
  if(body){ startSoulLoot(body); return; }         // tapped a slain enemy → walk over and take its soul
  if(henge.placed && Math.abs(cx-henge.altar.x)<=1 && Math.abs(cy-henge.altar.y)<=1){ approachAltar(); return; }   // tapped the altar
  if(cave.placed && (Math.abs(cx-cave.door.x)<=1 && Math.abs(cy-cave.door.y)<=1 || (cx>=cave.x&&cx<cave.x+5&&cy>=cave.y&&cy<cave.y+5))){
    player.goCave=true; player.goShop=false; player.goAltar=false; player.attack=null; player.propTarget=null;   // tapped the cave — walk to its door
    player.harvestTarget=null; player.carcassTarget=null; player.soulTarget=null; player.chopTree=null; player.chopping=false;
    pathToCell(cave.door.x, cave.door.y+1); return; }
  if(mapMode==='dungeon' && Math.abs(cx-dungeon.exit.x)<=1 && Math.abs(cy-dungeon.exit.y)<=1){       // tapped the way out
    player.goExit=true; player.attack=null; player.propTarget=null; player.soulTarget=null; player.chopTree=null; player.chopping=false; player.mineRock=null;
    pathToCell(dungeon.exit.x, dungeon.exit.y-1); return; }
  if(mapMode==='dungeon' && cx>=dungeon.forge.x-1 && cx<=dungeon.forge.x+2 && Math.abs(cy-dungeon.forge.y)<=1){   // tapped the forge
    player.goForge=true; player.attack=null; player.propTarget=null; player.soulTarget=null; player.chopTree=null; player.chopping=false; player.mineRock=null;
    pathToCell(dungeon.forge.x, dungeon.forge.y+1); return; }
  const site2=siteAt(cx,cy);
  if(site2){ siteUI.open=true; siteUI.id=site2.id; buildUI.open=false; shop.msg=''; shop.msgT=0;

function faceParams(f){

  if(!best) return;

function moveAlong(ent, dt, speed){
