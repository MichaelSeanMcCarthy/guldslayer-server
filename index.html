    if(!deerRoomToBreed()){ buck.wantMate=false; buck.mateTarget=null; buck.mateBob=0; buck.matingT=0; return false; }
    t.pregnant=true; t.pregT=0; t.mateHold=0;
    buck.wantMate=false; buck.mateTarget=null; buck.mateBob=0; buck.matingT=0;
  }
  return true;
}
function updateDeer(d, dt){
  if(d.dead){ d.deadT=(d.deadT||0)+dt; if(d.deadT>=DEER_FRESH_T+120) d.gone=true; return; }  // corpse (180s fresh) -> bones -> gone
  d.hunger += dt*2;   // deer and bucks get hungry twice as fast
  // --- lifecycle ticks ---
  if(d.fawn){ d.age=(d.age||0)+dt; if(d.age>=300){ matureFawn(d); } }            // fawn -> doe after 5 min
  if(d.pregnant){ d.pregT=(d.pregT||0)+dt; if(d.pregT>=60){ d.pregnant=false; d.pregT=0; birthFawn(d); } }  // 1 min gestation
  if(d.mateHold>0){ d.mateHold-=dt; d.path=[]; d.state='rest'; d.eatT=0; return; }  // held still by a courting buck
  // --- starvation: once hungry, a deer has STARVE_TIME seconds to eat or it dies.
  //     The timer freezes while it is actually eating so it can't die mid-meal. ---
  if(d.hunger >= HUNGER_TIME){ if(d.state!=='eat' && d.state!=='seek'){ d.starveT -= dt; if(d.starveT <= 0){ deerDies(d); return; } } }   // en route to food ('seek') counts as safe — a deer already walking to a bush won't starve
  else d.starveT = STARVE_TIME;
  // --- spooked by a fresh kill: bolt until 20 tiles from the body ---
  if(d.spookRun){
    if(Math.hypot(cellOf(d.px)-cellOf(d.spookX), cellOf(d.py)-cellOf(d.spookY)) >= 20){ d.spookRun=false; d.state='wander'; d.path=[]; }
    else { d.face=face8(d.px-d.spookX, d.py-d.spookY); spookStep(d, dt); return; }
  }
  // --- a mother holds still while her fawn is nursing ---
  const nurser=nursingChild(d);
  if(nurser){ d.path=[]; d.state='rest'; d.face=face8(nurser.px-d.px, nurser.py-d.py); return; }
  const hungry = d.hunger >= HUNGER_TIME;
  const pd = playerDist(d);
  if(d.antlers){                                                      // bucks are bold — they charge & attack
    if(pd <= 5) d.angry=true; else if(pd > 6){ d.angry=false; d.planted=false; }  // disengage & un-plant once 6+ away
    if(d.angry){ buckCharge(d, dt, pd); return; }                     // a threatened buck stands and fights — hungry or not
    if(!hungry && (d.wantMate || d.mateTarget)){ if(buckMate(d, dt)) return; }   // every 3rd meal, court the nearest doe (hunger comes first)
    if(d.state==='flee'||d.state==='alert'){ d.state='wander'; d.path=[]; }
  } else {                                                            // does & fawns are shy
    if(pd < 3){ d.state='flee'; fleeStep(d, dt, RUN_SPEED); return; } // too close — always bolt
    if(!hungry){
      if(pd < 8){ d.state='flee'; fleeStep(d, dt, RUN_SPEED); return; }
      if(pd < 12){                                                   // stop & watch for 3s, then edge away
        if(d.state!=='alert'){ d.state='alert'; d.alertT=3; d.path=[]; }
        d.faceLeft = player.px < d.px; d.face = face8(player.px-d.px, player.py-d.py);
        d.alertT -= dt;
        if(d.alertT <= 0) fleeStep(d, dt, BUCK_SPEED);
        return;
      }
    }
    if(d.state==='flee' || d.state==='alert'){ d.state='wander'; d.path=[]; }         // player left / went to feed
  }

  // strayed too far from the herd's buck? run back to it (avoiding the player) — but hunger comes first,
  // so a hungry deer keeps hunting for a bush instead of shuttling back to the herd (and starving)
  const bk=herdBuck(d);
  if(!hungry && bk!==d && Math.hypot(cellOf(d.px)-cellOf(bk.px), cellOf(d.py)-cellOf(bk.py)) > 20){
    d.state='regroup'; regroupStep(d, dt, bk); return;
  }
  if(d.state==='regroup'){ d.state='wander'; d.path=[]; }

  if(d.state==='wander'){
    if(hungry && !d.fawn && deerSeek(d)) return;      // feeding is the priority — grab a bush the instant one frees up
    if(!moveAlong(d,dt,BUCK_SPEED)){                 // arrived — prefer to stand still a few seconds
      if(hungry) deerDecide(d, true);
      else if(d.leader && leaderDist(d) > d.followDist) deerDecide(d, false);
      else { d.state='rest'; d.restT=3+Math.random()*4; }
    }
  } else if(d.state==='rest'){
    d.restT -= dt;
    if(hungry){
      if(d.fawn){ if(motherAlive(d)){ if(leaderDist(d)<=1.6) startNurse(d); else deerSeekMother(d); } }
      else deerSeek(d);
    }
    else if(occupied(cellOf(d.px),cellOf(d.py),d) && deerStepOff(d)){ /* don't share a tile — step off */ }
    else if(d.leader && leaderDist(d) > d.followDist){ deerFollow(d); }   // don't laze while the leader leaves
    else if(d.restT<=0){ if(!deerWander(d)) d.restT=1; }
  } else if(d.state==='seek'){
    if(d.fawn){                                                          // heading to mom to nurse
      if(!motherAlive(d)){ d.state='wander'; d.path=[]; return; }        // mother gone — can't nurse on a corpse or another deer
      if(leaderDist(d)<=1.6){ startNurse(d); return; }
      if(!d.path.length) deerSeekMother(d);                             // she moved — repath
      moveAlong(d,dt,BUCK_SPEED);
    } else {
      // drop the target if it's gone, still growing, or another deer got there first — then re-seek
      if(!d.targetBush || !world.bushes.includes(d.targetBush) || !bushAvailable(d.targetBush, d)){ if(!deerSeek(d)) d.state='wander'; return; }
      if(!moveAlong(d,dt,BUCK_SPEED)){ d.state='eat'; d.eatT=0; d.hunger=0; d.starveT=STARVE_TIME; }  // arrived — start eating, reset hunger
    }
  } else if(d.state==='eat'){
    if(d.fawn && !motherAlive(d)){ d.state='wander'; d.path=[]; return; }  // mother died mid-nurse — stop
    d.eatT += dt;                                                        // grazing / nursing
    d.emitT = (d.emitT||0) - dt;                                         // emit VFX particles
    if(d.emitT<=0){ d.emitT=0.16; if(d.fawn) spawnMilk(d); else spawnGraze(d); }
    const dur = d.fawn ? NURSE_TIME : EAT_TIME;
    if(d.eatT >= dur){
      if(!d.fawn){ eatBush(d.targetBush); d.targetBush=null; }           // fawns don't consume bushes
      if(d.antlers){ d.eatCount=(d.eatCount||0)+1; if(d.eatCount%3===0 && deerRoomToBreed()) d.wantMate=true; }  // every 3rd meal a buck seeks a mate — if the land can feed another mouth
      d.hunger=0; deerDecide(d, false);
    }
  }
}
function spawnHerd(){
  // herd spawns on the land to the RIGHT (east) of the creek
  const minX = Math.max(2, Math.min(GRID-4, (world.creekMaxX!=null?world.creekMaxX:0) + 2));
  const reset=(d)=>{ d.path=[]; d.state='wander'; d.eatT=0; d.restT=0; d.targetBush=null; d.faceLeft=false; d.dead=false; d.gone=false; d.deadT=0; d.starveT=STARVE_TIME; d.hunger=0; d.hp = d.fawn?1 : d.antlers?10 : 6; };
  const rightCell=()=>{ for(let i=0;i<600;i++){ const x=minX+((Math.random()*(GRID-minX))|0), y=(Math.random()*GRID)|0;
    if(x<GRID && spawnableCell(x,y)) return {x,y}; } return randOpenCell(); };
  const nearOpen=(bx,by,minR,maxR)=>{ for(let i=0;i<200;i++){ const r=minR+((Math.random()*(maxR-minR+1))|0), a=Math.random()*Math.PI*2;
    const x=Math.max(minX,Math.min(GRID-1, bx+Math.round(Math.cos(a)*r)));
    const y=Math.max(0,Math.min(GRID-1, by+Math.round(Math.sin(a)*r)));
    if(spawnableCell(x,y)) return {x,y}; } return {x:bx,y:by}; };
  const bc=rightCell();
  reset(buck); buck.hunger=0; buck.px=(bc.x+0.5)*CELL; buck.py=(bc.y+0.5)*CELL; deerWander(buck);
  for(const d of does){ reset(d); d.hunger=Math.random()*30;
    const c=nearOpen(bc.x,bc.y,3,10); d.px=(c.x+0.5)*CELL; d.py=(c.y+0.5)*CELL; deerWander(d); }
  for(const f of fawns){ reset(f); f.hunger=Math.random()*40; const m=f.leader||mother;
    const c=nearOpen(cellOf(m.px),cellOf(m.py),1,2); f.px=(c.x+0.5)*CELL; f.py=(c.y+0.5)*CELL; deerWander(f); }
}

/* --- vector drawing helpers (neon glow) --- */
function line(pts, color, o){ o=o||{}; ctx.save();
  ctx.lineJoin='round'; ctx.lineCap='round'; ctx.lineWidth=o.w||2;
  ctx.strokeStyle=color; ctx.shadowColor=color; ctx.shadowBlur=(o.glow==null?10:o.glow);
  ctx.beginPath(); pts.forEach((p,i)=> i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));
  if(o.close) ctx.closePath();
  if(o.fill){ ctx.fillStyle=o.fill; ctx.globalAlpha=0.14; ctx.fill(); ctx.globalAlpha=1; }
  ctx.stroke(); ctx.restore(); }
function ring(cx, cy, r, color, o){ o=o||{}; ctx.save();
  ctx.lineWidth=o.w||2; ctx.strokeStyle=color; ctx.shadowColor=color; ctx.shadowBlur=(o.glow==null?10:o.glow);
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.stroke(); ctx.restore(); }

function rect(x,y,w,h,color){ ctx.fillStyle=color; ctx.fillRect(x,y,w,h); }
function rectP(a,b,color){ ctx.fillStyle=color; ctx.fillRect(Math.min(a[0],b[0]),Math.min(a[1],b[1]),Math.abs(b[0]-a[0]),Math.abs(b[1]-a[1])); }
function circle(cx,cy,r,color){ ctx.fillStyle=color; ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill(); }
function ellipse(cx,cy,rx,ry,color){ ctx.fillStyle=color; ctx.beginPath(); ctx.ellipse(cx,cy,rx,ry,0,0,Math.PI*2); ctx.fill(); }
function tri(a,b,c,color){ ctx.fillStyle=color; ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.lineTo(c[0],c[1]); ctx.closePath(); ctx.fill(); }
function quad(a,b,c,d,color){ ctx.fillStyle=color; ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.lineTo(c[0],c[1]); ctx.lineTo(d[0],d[1]); ctx.closePath(); ctx.fill(); }
// a thick line segment as a rectangle (screen coords) — used for antler beams
function beam(ax,ay,bx,by,hw,color){ const dx=bx-ax,dy=by-ay,L=Math.hypot(dx,dy)||1,nx=-dy/L*hw,ny=dx/L*hw;
  quad([ax+nx,ay+ny],[bx+nx,by+ny],[bx-nx,by-ny],[ax-nx,ay-ny],color); }
// symmetric branched antler rack built from rectangles (for front/back facing)
function antlersFront(cx, hy, u, A){
  const hw=u*0.055, w2=hw*0.8;
  for(const s of [-1,1]){
    beam(cx+s*u*0.1, hy-u*0.1,  cx+s*u*0.34, hy-u*1.02, hw, A);   // main beam up-out
    beam(cx+s*u*0.2, hy-u*0.5,  cx+s*u*0.46, hy-u*0.66, w2, A);   // low tine
    beam(cx+s*u*0.27,hy-u*0.72, cx+s*u*0.14, hy-u*0.9,  w2, A);   // inner tine
    beam(cx+s*u*0.31,hy-u*0.86, cx+s*u*0.42, hy-u*1.12, w2, A);   // top tine
  }
}
function shadow(cx,cy,rx,ry){ ctx.save(); ctx.globalAlpha=0.4; ctx.fillStyle=PAL.shadow;
  ctx.beginPath(); ctx.ellipse(cx,cy,rx,ry,0,0,Math.PI*2); ctx.fill(); ctx.restore(); }

const floats = [];

function updateFloats(dt){ for(let i=floats.length-1;i>=0;i--){ const f=floats[i]; f.y+=f.vy*dt; f.life-=dt; if(f.life<=0) floats.splice(i,1); } }
function drawFloats(){

    const px=Math.max(9, CELL*cam.scale*0.34);

    ctx.globalAlpha=Math.min(1, f.life/0.5);
    ctx.lineWidth=Math.max(2, px*0.18); ctx.strokeStyle='rgba(0,0,0,0.65)'; ctx.strokeText(f.text, s.x, s.y);
    ctx.fillStyle=f.color; ctx.fillText(f.text, s.x, s.y);

// --- wooden plank bridge, drawn with a 3/4 raised look (deck thickness, side rails, corner posts) ---
function drawBridge(){
  if(!world.bridge || !world.bridge.length) return;
  const rw=Math.max(2, cam.scale*CELL*0.13);   // rail thickness
  for(const bp of world.bridge){
    const a=worldToScreen(bp.x*CELL,bp.y*CELL), b=worldToScreen((bp.x+1)*CELL,(bp.y+1)*CELL);
    if(a.x>canvas.width||a.y>canvas.height||b.x<0||b.y<0) continue;
    const w=b.x-a.x, h=b.y-a.y;
    rect(a.x, a.y, w+1, h+1, PAL.plank);                                        // flat deck
    ctx.strokeStyle=PAL.plankGap; ctx.lineWidth=Math.max(1,DPR); ctx.beginPath();   // a single plank seam across
    if(bp.vertical){ const yy=a.y+h*0.5; ctx.moveTo(a.x,yy); ctx.lineTo(b.x+1,yy); }
    else { const xx=a.x+w*0.5; ctx.moveTo(xx,a.y); ctx.lineTo(xx,b.y+1); }
    ctx.stroke();
    // one flat darker rail strip along each outer edge
    if(bp.edge==='n') rect(a.x, a.y, w+1, rw, PAL.plankSh);
    else if(bp.edge==='s') rect(a.x, b.y-rw, w+1, rw, PAL.plankSh);
    else if(bp.edge==='w') rect(a.x, a.y, rw, h+1, PAL.plankSh);
    else if(bp.edge==='e') rect(b.x-rw, a.y, rw, h+1, PAL.plankSh);
  }
}

  if(typeof netSendVFX==='function') netSendVFX(x,y,n,big);   // mirror the spray on the other player's screen
}
function spawnSmoke(x,y){                      // a puff of campfire smoke that rises, spreads and fades
  addParticle({kind:'smoke', x, y, vx:(Math.random()-0.5)*10, hz:CELL*0.7, vhz:CELL*(0.7+Math.random()*0.5),
    life:2.4+Math.random()*1.2, max:3.6, size:CELL*0.14, grow:CELL*0.4, color:PAL.smoke});
}
function spawnSplash(x,y){                     // a turtle diving/surfacing: rings + a burst of water droplets
  spawnRipple(x,y); spawnRipple(x,y);
  addParticle({kind:'ripple', x, y, life:0.6, max:0.6, size:CELL*0.1, grow:CELL*0.5, color:PAL.ripple});

    addParticle({kind:'bit', x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-60, g:230, life:0.5+Math.random()*0.3, max:0.8, size:CELL*0.06, color:PAL.ripple}); }
}
// ripples for any creature wading/swimming, same as the player's wake
function waterWake(e, dt){
  const cx=cellOf(e.px), cy=cellOf(e.py);
  if(!isWater(cx,cy) || onBridge(cx,cy)) return;      // no ripples on the wooden bridge
  e.rippleT=(e.rippleT||0)-dt;
  if(e.rippleT<=0){ e.rippleT=0.24; spawnRipple(e.px, e.py); }
}
function spawnChip(x,y){                       // wood chips flying off the tree while chopping (2x size)
  addParticle({kind:'bit', x:x+(Math.random()-0.5)*CELL*0.5, y, vx:(Math.random()-0.5)*95, vy:-34-Math.random()*55,
    g:230, life:0.6, max:0.6, size:CELL*0.14, color:PAL.pWood});
}
function treeImpact(tx,ty){                    // leaves + wood chunks burst when the trunk hits
  const bx=(tx+1.5)*CELL, by=(ty+2.2)*CELL;
  for(let i=0;i<28;i++){ const a=Math.random()*Math.PI*2, sp=50+Math.random()*180;
    addParticle({kind:'bit', x:bx+(Math.random()-0.5)*CELL*1.4, y:by+(Math.random()-0.5)*CELL*1.4,
      vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-50, g:210, life:0.7+Math.random()*0.6, max:1.3,
      size:CELL*(0.06+Math.random()*0.09), color: Math.random()<0.55?PAL.tree:PAL.pWood });
  }

function updateParticles(dt){
  for(let i=particles.length-1;i>=0;i--){ const p=particles[i]; p.life-=dt;
    if(p.life<=0){ particles.splice(i,1); continue; }
    if(p.kind==='bit'){ p.vy+=(p.g||0)*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; }
    else if(p.kind==='arrow'){ p.t+=dt; const f=Math.min(1,p.t/p.dur); p.x=p.x0+(p.tx-p.x0)*f; p.y=p.y0+(p.ty-p.y0)*f;
      if(p.arcH==null){ const dst=Math.hypot(p.tx-p.x0, p.ty-p.y0); p.arcH=Math.min(CELL*2.0, CELL*0.3+dst*0.10); }   // longer shots loft higher
      p.f=f; p.hz=p.arcH*4*f*(1-f);                                                            // parabolic lift, apex mid-flight
      p.angV=Math.atan2((p.ty-p.y0)-p.arcH*(4-8*f), (p.tx-p.x0));                              // nose follows the flight path
      if(p.t>=p.dur){
        if(p.fx){ /* another player's arrow — purely visual here; the shooter resolves the damage */ }
        else if(p.toPlayer){ if(p.toRemote){ if(p.tp && typeof netHitRemote==='function') netHitRemote(p.tp,5,false); } else if(!player.dead) playerHit(5, true); }   // goblin arrow → 5 HP to whichever player
        else if(!creatureDead(p.tkind,p.ref)){ coopPlayerDamage(p.tkind, p.ref, rollDmg(p.w||'bow')); spawnMagicHit(p.tx, p.ty, player.magic[p.w||'bow']||0); } // player arrow → that bow's DMG (+arcane sparks if enchanted)
        else spawnBlood(p.tx,p.ty,8,false);
        particles.splice(i,1); } continue; }
    else if(p.kind==='soul'){ p.t=(p.t||0)+dt;
      if(p.t>=p.delay){ const age=p.t-p.delay;
        p.hz=(p.hz||0)+p.vhz*dt; p.x+=Math.sin(p.t*4+p.sw)*CELL*0.4*dt;   // drift upward with a gentle sway
        if(age>=p.dur){ particles.splice(i,1); } }
      continue; }
    else if(p.kind==='bolt'){ p.t+=dt; const f=Math.min(1,p.t/p.dur);
      p.x=p.x0+(p.tx-p.x0)*f; p.y=p.y0+(p.ty-p.y0)*f;
      if(p.t>=p.dur){
        if(!p.fx){ if(p.toRemote){ if(p.tp && typeof netHitRemote==='function') netHitRemote(p.tp,8,false); } else if(!player.dead) playerHit(8, true); }
        for(let j=0;j<10;j++){ const a=Math.random()*Math.PI*2, sp=50+Math.random()*120;   // zap burst
          addParticle({kind:'bit', x:p.tx, y:p.ty-CELL*0.3, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-30, g:80,
            life:0.3+Math.random()*0.25, max:0.55, size:CELL*0.05, color: Math.random()<0.5?'#ffe97a':'#aee3ff'}); }
        particles.splice(i,1); } continue; }
    else if(p.kind==='boulder'){ p.t+=dt; const f=Math.min(1,p.t/p.dur);
      p.x=p.x0+(p.tx-p.x0)*f; p.y=p.y0+(p.ty-p.y0)*f; p.f=f; p.hz=Math.sin(Math.PI*f)*p.arc;   // a lobbed arc, not an arrow's line
      if(p.t>=p.dur){ boulderLand(p.tx, p.ty, !!p.fx); particles.splice(i,1); } continue; }
    else if(p.kind==='smoke'){ p.x+=p.vx*dt; p.hz+=p.vhz*dt; p.vhz*=(1-0.4*dt); }   // rise & slow
    else if(p.kind==='fish'){ p.x+=p.vx*dt; p.hz+=p.vhz*dt; p.vhz-=p.g*dt;
      if(p.hz<=0 && p.vhz<0){ if(!p.splashed){ spawnRipple(p.x,p.y); p.splashed=true; } particles.splice(i,1); } }
  }
}
function drawParticles(){
  for(const p of particles){ const s=worldToScreen(p.x,p.y), a=Math.max(0,p.life/p.max);
    ctx.save();
    if(p.kind==='bit'){ ctx.globalAlpha=a; circle(s.x, s.y, Math.max(1, p.size*cam.scale), p.color); }
    else if(p.kind==='arrow'){ const u=CELL*cam.scale;
      const up=Math.sin(Math.PI*(p.f||0)), sc=1+0.55*up;                                     // swells to the apex, shrinks to the landing
      const L=u*0.85*sc, th=Math.max(2.5,u*0.06*sc), ang=(p.angV!=null?p.angV:p.ang);
      const ay=s.y-(p.hz||0)*cam.scale;                                                      // lofted above its ground line
      ctx.globalAlpha=0.2*(1-up*0.5); ctx.fillStyle=PAL.shadow;                              // faint shadow racing along the ground
      ctx.beginPath(); ctx.ellipse(s.x, s.y, u*0.22*(1-up*0.3), u*0.22*TILT*(1-up*0.3), 0,0,Math.PI*2); ctx.fill();
      ctx.globalAlpha=1;
      if(p.mt>0){ const mc2=p.mt>=1?'rgba(255,150,50,':'rgba(90,140,255,';                   // a magic arrow burns as it flies
        circle(s.x, ay, u*0.34*sc, mc2+'0.35)'); circle(s.x, ay, u*0.2*sc, mc2+'0.5)'); }
      const tlx=s.x-Math.cos(ang)*u*0.9, tly=ay-Math.sin(ang)*u*0.9;                         // motion trail behind the arrow
      ctx.globalAlpha=0.3; ctx.strokeStyle=p.mt>0?(p.mt>=1?'#ffb050':'#7fa5ff'):PAL.pMilk; ctx.lineWidth=th*0.7;
      ctx.beginPath(); ctx.moveTo(tlx,tly); ctx.lineTo(s.x,ay); ctx.stroke(); ctx.globalAlpha=1;
      ctx.translate(s.x,ay); ctx.rotate(ang);
      rect(-L*0.5, -th/2, L, th, PAL.trunk);                                                // shaft
      tri([L*0.5,-th*1.8],[L*0.5,th*1.8],[L*0.5+u*0.18*sc,0], PAL.axeBlade);                 // arrowhead
      tri([-L*0.5,0],[-L*0.5-u*0.12*sc,-u*0.1*sc],[-L*0.5-u*0.12*sc,u*0.1*sc], PAL.pMilk); } // fletching
    else if(p.kind==='soul'){
      const age=(p.t||0)-p.delay;
      if(age>0){
        const al=age<0.15 ? age/0.15 : Math.max(0, 1-(age-0.15)/(p.dur-0.15));   // fade in fast, out slow
        const yy=s.y-(p.hz||0)*cam.scale, r=Math.max(2, CELL*cam.scale*0.15*(1+age*0.18));
        ctx.globalAlpha=al*0.95;
        circle(s.x, yy, r*1.7, 'rgba(185,167,232,.3)');                          // glow
        circle(s.x, yy, r, '#cabcf0');                                           // wisp body
        tri([s.x-r*0.7,yy+r*0.55],[s.x+r*0.7,yy+r*0.55],[s.x,yy+r*1.9], '#cabcf0');   // trailing tail
        circle(s.x-r*0.33, yy-r*0.18, r*0.17, '#4a3d6e');                        // little eyes
        circle(s.x+r*0.33, yy-r*0.18, r*0.17, '#4a3d6e');
      } }
    else if(p.kind==='bolt'){
      ctx.strokeStyle='#ffe97a'; ctx.lineWidth=Math.max(2, CELL*cam.scale*0.08); ctx.globalAlpha=0.95;
      const ox=worldToScreen(p.x0,p.y0), seg=5;
      ctx.beginPath(); ctx.moveTo(ox.x, ox.y);
      for(let k2=1;k2<=seg;k2++){ const f2=k2/seg, jx=(Math.random()-0.5)*CELL*cam.scale*0.35*(k2<seg?1:0);
        const px3=ox.x+(s.x-ox.x)*f2+jx, py3=ox.y+(s.y-ox.y)*f2+(Math.random()-0.5)*CELL*cam.scale*0.3*(k2<seg?1:0);
        ctx.lineTo(px3, py3); }
      ctx.stroke();
      ctx.strokeStyle='rgba(174,227,255,.55)'; ctx.lineWidth=Math.max(4, CELL*cam.scale*0.16); ctx.stroke();
      circle(s.x, s.y, CELL*cam.scale*0.16, '#ffffff'); }
    else if(p.kind==='boulder'){
      const f=p.f||0, up=Math.sin(Math.PI*f);
      ctx.globalAlpha=0.25*(1-up*0.55); ctx.fillStyle=PAL.shadow;                    // ground shadow, fainter while it's high
      ctx.beginPath(); ctx.ellipse(s.x, s.y, CELL*cam.scale*0.3*(1-up*0.35), CELL*cam.scale*0.3*TILT*(1-up*0.35), 0,0,Math.PI*2); ctx.fill();
      ctx.globalAlpha=1;
      const r=Math.max(3, CELL*cam.scale*0.34*(1+0.9*up));                            // swells to the apex, shrinks down to the landing
      const by=s.y - (p.hz||0)*cam.scale;
      circle(s.x, by, r, '#6f7175');                                                  // the rock
      circle(s.x-r*0.25, by-r*0.28, r*0.5, '#8a8d90');                                // highlight
      circle(s.x+r*0.3, by+r*0.26, r*0.2, '#5c5e61'); }                               // pit
    else if(p.kind==='smoke'){ const t=1-p.life/p.max, r=(p.size+p.grow*t)*cam.scale;
      ctx.globalAlpha=a*0.5; circle(s.x, s.y - p.hz*cam.scale, Math.max(1,r), p.color); }
    else if(p.kind==='fish'){
      const yy=s.y - p.hz*cam.scale, sz=p.size*cam.scale, ang=Math.atan2(-p.vhz, p.vx*3)*0.5;
      ctx.translate(s.x, yy); ctx.rotate(ang); ctx.fillStyle=p.color;
      ctx.beginPath(); ctx.ellipse(0,0, sz, sz*0.42, 0,0,Math.PI*2); ctx.fill();                 // body
      ctx.beginPath(); ctx.moveTo(-sz*0.9,0); ctx.lineTo(-sz*1.5,-sz*0.5); ctx.lineTo(-sz*1.5,sz*0.5); ctx.closePath(); ctx.fill();  // tail
    } else { ctx.globalAlpha=a; const t=1-p.life/p.max, r=(p.size+p.grow*t)*cam.scale;            // foreshortened ripple
      ctx.strokeStyle=p.color; ctx.lineWidth=Math.max(1,DPR*0.8); ctx.beginPath(); ctx.ellipse(s.x,s.y,r,r*TILT,0,0,Math.PI*2); ctx.stroke(); }
    ctx.restore();
  }
}

/* --- player: linen figure, 8-direction. Head is at a fixed height, joined to the
   torso by a neck (never detaches); the "look" pitch shifts the face internally.  */
function hairPile(cx, cy, r, color){                     // hair defined by several shapes
  const c=color||PAL.hair;
  circle(cx,          cy-r*0.05, r,      c);             // main mass
  circle(cx-r*0.55,   cy-r*0.45, r*0.5,  c);             // crown tufts
  circle(cx-r*0.02,   cy-r*0.72, r*0.52, c);
  circle(cx+r*0.55,   cy-r*0.45, r*0.5,  c);
  circle(cx-r*0.9,    cy+r*0.15, r*0.34, c);             // sideburns
  circle(cx+r*0.9,    cy+r*0.15, r*0.34, c);
}
function drawHair(cx, hcy, R, rc){                       // hair / mohawk in the race's colour
  if(rc.mohawk){
    circle(cx, hcy+R*0.02, R*0.92, rc.hair);            // close-cropped sides
    rect(cx-R*0.26, hcy-R*1.15, R*0.52, R*1.3, rc.hair);// tall crest
    tri([cx-R*0.26,hcy-R*1.1],[cx+R*0.26,hcy-R*1.1],[cx,hcy-R*1.6], rc.hair);
  } else hairPile(cx, hcy, R, rc.hair);
}
function drawEars(cx, hcy, R, rc, side, dir){            // pointed ears for elves & half-orcs
  if(!rc.ears) return; const c=rc.skin;
  if(side){ tri([cx-dir*R*0.55, hcy+R*0.02],[cx-dir*R*1.05, hcy-R*0.3],[cx-dir*R*0.5, hcy+R*0.34], c); }
  else { tri([cx-R*0.62,hcy-R*0.02],[cx-R*1.08,hcy-R*0.4],[cx-R*0.5,hcy+R*0.3], c);
         tri([cx+R*0.62,hcy-R*0.02],[cx+R*1.08,hcy-R*0.4],[cx+R*0.5,hcy+R*0.3], c); }
}
function drawBeard(cx, hcy, R, rc, dir, fo, side){       // beard styles: square / big / goatee
  if(rc.beard==='none') return; const c=rc.hair;
  if(side){
    if(rc.beard==='big'){ rectP([cx+dir*R*0.0, hcy+R*0.18-fo],[cx+dir*R*0.98, hcy+R*1.35-fo], c); }
    else if(rc.beard==='goatee'){ rectP([cx+dir*R*0.3, hcy+R*0.5-fo],[cx+dir*R*0.64, hcy+R*1.05-fo], c); }
    else { rectP([cx+dir*R*0.02, hcy+R*0.36-fo],[cx+dir*R*0.78, hcy+R*0.92-fo], c);
           rectP([cx+dir*R*0.2,  hcy+R*0.16-fo],[cx+dir*R*0.78, hcy+R*0.32-fo], c); }
  } else {
    if(rc.beard==='big'){ rect(cx-R*0.72, hcy+R*0.28, R*1.44, R*0.95, c); rect(cx-R*0.5,hcy+R*0.12,R*1.0,R*0.2,c); }
    else if(rc.beard==='goatee'){ rect(cx-R*0.17, hcy+R*0.46, R*0.34, R*0.5, c); rect(cx-R*0.36,hcy+R*0.16,R*0.72,R*0.14,c); }
    else { rect(cx-R*0.5, hcy+R*0.34, R*1.0, R*0.5, c); rect(cx-R*0.4, hcy+R*0.16, R*0.8, R*0.16, c); }
  }
}
function drawTusks(cx, hcy, R, rc, dir, fo, side){       // little upward fangs for half-orcs
  if(!rc.tusks) return; const c='#f3ead0';
  if(side){ tri([cx+dir*R*0.28, hcy+R*0.52-fo],[cx+dir*R*0.44, hcy+R*0.52-fo],[cx+dir*R*0.36, hcy+R*0.2-fo], c); }
  else { tri([cx-R*0.32,hcy+R*0.56],[cx-R*0.16,hcy+R*0.56],[cx-R*0.24,hcy+R*0.28], c);
         tri([cx+R*0.32,hcy+R*0.56],[cx+R*0.16,hcy+R*0.56],[cx+R*0.24,hcy+R*0.28], c); }
}
function drawDeadPlayer(pt){                       // corpse spewing blood, then a skeleton with flies
  const rc=RACES[player.race]||RACES.human;
  const u=Math.max(10, CELL*cam.scale)*rc.sc, fx=pt.x, fy=pt.y;

  if(player.deadT < 3.0){                          // fallen body
    ctx.fillStyle=PAL.playerBody; ctx.beginPath(); ctx.ellipse(fx, fy-u*0.16, u*0.52*rc.tw, u*0.24, 0,0,Math.PI*2); ctx.fill();  // torso
    for(const lx of [-0.22,0.22]) rect(fx+lx*u-u*0.06, fy-u*0.5, u*0.12, u*0.36, PAL.playerLegs);   // splayed legs
    circle(fx-u*0.6, fy-u*0.16, u*0.19, rc.skin);                                                   // head
    circle(fx-u*0.66, fy-u*0.3, u*0.17, rc.hair);                                                   // hair
    ctx.strokeStyle=PAL.blood; ctx.lineWidth=Math.max(1.5,DPR*1.4);                                 // X_X eyes
    for(const ex of [-0.7,-0.52]){ const cxp=fx+ex*u, cyp=fy-u*0.16;
      ctx.beginPath(); ctx.moveTo(cxp-u*0.04,cyp-u*0.04); ctx.lineTo(cxp+u*0.04,cyp+u*0.04);
      ctx.moveTo(cxp+u*0.04,cyp-u*0.04); ctx.lineTo(cxp-u*0.04,cyp+u*0.04); ctx.stroke(); }
  } else {                                         // skeleton
    circle(fx-u*0.5, fy-u*0.15, u*0.18, PAL.bone);                                                  // skull
    circle(fx-u*0.55, fy-u*0.1, u*0.045, PAL.shadow); circle(fx-u*0.45, fy-u*0.1, u*0.045, PAL.shadow);  // eye sockets
    rect(fx-u*0.34, fy-u*0.16, u*0.62, u*0.06, PAL.bone);                                           // spine
    for(let i=0;i<4;i++) rect(fx-u*0.2+i*u*0.14, fy-u*0.32, u*0.05, u*0.3, PAL.bone);               // ribs
    rect(fx+u*0.24, fy-u*0.2, u*0.12, u*0.1, PAL.bone);                                             // pelvis
    for(const lx of [0.3,0.42]) rect(fx+lx*u, fy-u*0.14, u*0.05, u*0.34, PAL.bone);                 // leg bones
    for(let i=0;i<3;i++){ const a=animT*3.0+i*2.1;                                                  // flies
      circle(fx+Math.cos(a)*u*0.5, fy-u*0.34+Math.sin(a*1.3)*u*0.22, Math.max(1,u*0.05), PAL.fly); }
  }
}
function drawPerson(pt){
  const rc=RACES[player.race]||RACES.human;
  const u=Math.max(10, CELL*cam.scale)*rc.sc, fx=pt.x, fy=pt.y, fp=faceParams(player.face||'S');
  const tw=rc.tw, hh=rc.hh, skin=rc.skin, eyeC=rc.eye;
  shadow(fx, fy, u*0.3*tw, u*0.11);
  const auraM=Math.max(player.helmet&&player.eqHelmet?(player.magic.helmet||0):0,
                       player.armor&&player.eqArmor?(player.magic.armor||0):0,
                       player.leggings&&player.eqLeggings?(player.magic.leggings||0):0);
  if(auraM>0 && scene==='game'){                                          // blessed armor sheathes the body in faint light
    const t2=auraM>=1, pu=0.5+0.5*Math.sin(animT*3);
    ctx.fillStyle=(t2?'rgba(255,150,50,':'rgba(90,140,255,')+(0.10+0.10*pu)+')';
    ctx.beginPath(); ctx.ellipse(fx, fy-u*0.75*hh, u*0.55*tw, u*0.95*hh, 0,0,Math.PI*2); ctx.fill();
    if(t2){ ctx.fillStyle='rgba(255,190,90,'+(0.06+0.08*pu)+')';
      ctx.beginPath(); ctx.ellipse(fx, fy-u*0.75*hh, u*0.75*tw, u*1.2*hh, 0,0,Math.PI*2); ctx.fill(); }
  }
  const R=u*0.23, hcy=fy-u*1.30*hh;                       // head height — fixed relative to the body
  // worn leather changes the look: leggings darken the legs, a cuirass covers the torso, a cap tops the head
  const wLegs=player.leggings&&player.eqLeggings, wChain=player.chainmail&&player.eqChainmail, wBody=(player.armor&&player.eqArmor)||wChain, wHelm=player.helmet&&player.eqHelmet;
  const legC=wLegs?'#5f3d22':PAL.playerLegs, bodyC=wChain?'#9aa4ae':(wBody?'#8a5a34':PAL.playerBody);
  if(fp.mode==='side'){
    const dir=fp.dir, fo=(fp.pitch||0)*R*0.22;            // small internal face shift (look up/down)
    rectP([fx-u*0.09*tw, fy-u*0.55*hh],[fx+u*0.09*tw, fy], legC);            // legs
    rectP([fx-u*0.16*tw, fy-u*1.05*hh],[fx+u*0.16*tw, fy-u*0.5*hh], bodyC);   // torso
    if(wBody){ rect(fx-u*0.16*tw, fy-u*0.62*hh, u*0.32*tw, u*0.05, '#5f3d22');            // belt
      circle(fx, fy-u*0.6*hh, u*0.035, '#e7c877'); }                                       // buckle
    rectP([fx+dir*u*0.04-u*0.07*tw, fy-u*0.98*hh],[fx+dir*u*0.04+u*0.07*tw, fy-u*0.58*hh], bodyC); // arm
    rectP([fx-u*0.055, fy-u*1.16*hh],[fx+u*0.07, fy-u*1.0*hh], skin);         // neck (joins head to torso)

function axeSwingAngle(){                          // radians: rest / recoil-up / strike-down
  if(!player.chopping) return -0.6;               // resting on the shoulder
  const c=player.chopT % 1.0;
  return c<0.6 ? 0.6 + (c/0.6)*(-2.0) : -1.4 + ((c-0.6)/0.4)*2.0;   // strike lands on the beat
}
const BOSS_SWING = 0.6;                            // seconds a boss club swing takes
function tickSwing(g, dt){                          // advance a club swing; the boss's blow lands as the club comes down
  if(!(g.swingT>0)) return;
  g.swingT-=dt;
  if(g.pendingHit && g.swingT <= BOSS_SWING*0.42){ coopHit(g.swingTarget||player, g.pendingHit, true); g.pendingHit=0; }
}
function bossSwingAngle(g){                        // radians: rest / wind-up / chop-down (like the player's axe)
  if(!g.swingT || g.swingT<=0) return -0.2;       // club held up at the ready
  const t=1-(g.swingT/BOSS_SWING);                // 0..1 through the swing
  return t<0.35 ? -0.2 - (t/0.35)*1.2 : -1.4 + ((t-0.35)/0.65)*2.25;  // rear back, then swing all the way through
}

}

function drawTimeHUD(){                        // the day dial: a 24-hour sky band with the sun (or moon) riding it

let mmCanvas=null, mmFor='', mmZoom=0.25, mmBtns=null;   // starts fully zoomed out — the whole world in the box
function buildMinimap(){                       // paint one pixel block per cell into an offscreen canvas
  const PX=4, c=document.createElement('canvas'); c.width=GRID*PX; c.height=GRID*PX;
  const g=c.getContext('2d');
  for(let y=0;y<GRID;y++) for(let x=0;x<GRID;x++){
    let col;
    if(mapMode==='dungeon'){
      const t=world.terrain[gi(x,y)];
      col = t===1 ? '#101114' : (world.dzone&&world.dzone[gi(x,y)]===2 ? '#3d2f3a' : world.dzone&&world.dzone[gi(x,y)]===1 ? '#2c2e33' : '#26221e');
    } else {
      const t=world.terrain[gi(x,y)];
      if(t===2||t===3||t===4) col = t===2?'#7ec8d8':t===3?'#4a9ec4':'#2c6ea8';       // water rings
      else col='#6da24e';                                                             // grass
    }
    g.fillStyle=col; g.fillRect(x*PX, y*PX, PX, PX);
  }
  if(mapMode==='forest'){
    g.fillStyle='#8a6a42'; for(const m of (world.pathDirt||[]).concat(world.campDirt||[], world.shopDirt||[])) g.fillRect(m.x*PX, m.y*PX, PX, PX);
    g.fillStyle='#3e6b34'; for(const t of world.trees){ g.fillRect(t.x*PX, t.y*PX, PX*TILE, PX*TILE); }
    g.fillStyle='#57904a'; for(const b of world.bushes){ g.fillRect(b.x*PX+1, b.y*PX+1, PX-1, PX-1); }
    g.fillStyle='#8a5a34';
    for(const s of [shop, stall, butcher, armorShop]){ if(s.placed) g.fillRect(s.x*PX, s.y*PX, s.w*PX, s.h*PX); }
    if(henge.placed){ g.fillStyle='#9aa4ae'; g.fillRect((henge.cx-3)*PX, (henge.cy-3)*PX, 7*PX, 7*PX); }
    if(cave.placed){ g.fillStyle='#5c5e61'; g.fillRect(cave.x*PX, cave.y*PX, 5*PX, 5*PX); }
  } else if(dungeon.forge){
    g.fillStyle='#d97b3f'; g.fillRect(dungeon.forge.x*PX, dungeon.forge.y*PX, PX*2, PX);
    g.fillStyle='#b98be0'; g.fillRect(dungeon.throne.x*PX, dungeon.throne.y*PX, PX*2, PX*2);
  }
  mmCanvas=c; mmFor=mapMode;
}

  if(!mmCanvas || mmFor!==mapMode) buildMinimap();
  const sz=Math.max(64, 88*DPR), pad=Math.max(10, 12*DPR), ic=Math.max(15, 17*DPR);
  const box=Math.max(140, 150*DPR);
  const bx=canvas.width-pad-box, by=pad+sz+ic*3.6;
  const PX=4, mmScale=(fitScale*15)/4*mmZoom;                  // the old default camera height, from 4x higher (± the +/- buttons)
  let pxPerCell=mmScale*CELL, viewCells=box/pxPerCell;
  if(viewCells>GRID){ viewCells=GRID; pxPerCell=box/viewCells; }   // fully zoomed out: the whole world fits the box
  let cx0=cellOf(player.px)-viewCells/2, cy0=cellOf(player.py)-viewCells/2;
  cx0=Math.max(0, Math.min(GRID-viewCells, cx0)); cy0=Math.max(0, Math.min(GRID-viewCells, cy0));
  ctx.save();
  ctx.globalAlpha=0.92;
  ctx.beginPath(); ctx.roundRect(bx, by, box, box, 8*DPR); ctx.clip();
  ctx.imageSmoothingEnabled=false;
  ctx.drawImage(mmCanvas, cx0*PX, cy0*PX, viewCells*PX, viewCells*PX, bx, by, box, box);
  if(mapMode==='forest'){                                      // night falls on the little map too
    const dark=nightDarkness(); if(dark>0.005){ ctx.fillStyle='rgba(13,17,46,'+(dark*0.8).toFixed(3)+')'; ctx.fillRect(bx,by,box,box); }
  }
  const dot=(wx,wy,r,col)=>{ const dx=bx+(wx/CELL-cx0)*pxPerCell, dy=by+(wy/CELL-cy0)*pxPerCell;
    if(dx>=bx-2&&dx<=bx+box+2&&dy>=by-2&&dy<=by+box+2) circle(dx, dy, r, col); };
  for(const RP of (typeof remotePlayers==='function'?remotePlayers():[])){                     // the rest of the party
    if(RP.active && !RP.dead && (RP.map||'forest')===mapMode) dot(RP.px, RP.py, Math.max(2.5,3*DPR), '#6bd3ff'); }
  for(const g of goblins){ if(g.dead||g.gone) continue;
    if(g.kind==='boss'||g.kind==='king') dot(g.px, g.py, Math.max(3,3.5*DPR), '#d43a2a'); }    // the big threats
  dot(player.px, player.py, Math.max(3,3.5*DPR), '#ffffff');                                   // you
  ctx.restore();
  ctx.save(); ctx.strokeStyle=PAL.trunk; ctx.lineWidth=Math.max(2, DPR*1.8);
  ctx.beginPath(); ctx.roundRect(bx, by, box, box, 8*DPR); ctx.stroke(); ctx.restore();
  // +/- buttons riding the minimap's bottom edge
  const bs=Math.max(24, 26*DPR), bg=bs*0.25;
  mmBtns={ minus:{x:bx+box-bs*2-bg-4*DPR, y:by+box-bs-4*DPR, w:bs, h:bs},
           plus: {x:bx+box-bs-4*DPR,      y:by+box-bs-4*DPR, w:bs, h:bs} };
  ctx.save();
  for(const [k,b] of Object.entries(mmBtns)){
    ctx.globalAlpha=0.9; ctx.fillStyle='rgba(20,14,9,.8)';
    ctx.beginPath(); ctx.roundRect(b.x, b.y, b.w, b.h, 5*DPR); ctx.fill();
    ctx.globalAlpha=1; ctx.strokeStyle=PAL.trunk; ctx.lineWidth=Math.max(1.5, DPR*1.3); ctx.stroke();
    ctx.strokeStyle='#f4e7cf'; ctx.lineWidth=Math.max(2, DPR*1.8);
    const cx2=b.x+b.w/2, cy2=b.y+b.h/2, ar=b.w*0.24;
    ctx.beginPath(); ctx.moveTo(cx2-ar, cy2); ctx.lineTo(cx2+ar, cy2); ctx.stroke();
    if(k==='plus'){ ctx.beginPath(); ctx.moveTo(cx2, cy2-ar); ctx.lineTo(cx2, cy2+ar); ctx.stroke(); }
  }
  ctx.restore();
}
function mmButtonTap(x, y){                     // a tap on the minimap's +/- : zoom the little map
  if(!mmBtns || scene!=='game') return false;
  const hit=b=> x>=b.x && x<=b.x+b.w && y>=b.y && y<=b.y+b.h;
  if(hit(mmBtns.plus)) { mmZoom=Math.min(4,    mmZoom*1.35); return true; }
  if(hit(mmBtns.minus)){ mmZoom=Math.max(0.25, mmZoom/1.35); return true; }
  return false;
}

function goblinSide(pt,g,u,skin,dir,pitch){
  const P=(x,y)=>[ pt.x+dir*x*u, pt.y+y*u ], ho=(pitch||0)*0.14;
  rectP(P(-0.18,-0.42),P(-0.02,0), PAL.goblinLoin);

  rectP(P(-0.24,-0.9), P(0.24,-0.4), skin);
  circle(P(0,-1.06-ho)[0],P(0,-1.06-ho)[1], u*0.26, skin);
  tri(P(-0.22,-1.12-ho),P(-0.44,-1.18-ho),P(-0.18,-1.0-ho), skin);
  tri(P(0.22,-1.12-ho), P(0.44,-1.18-ho), P(0.18,-1.0-ho),  skin);
  glowEye(P(0.08,-1.12-ho)[0], P(0.08,-1.12-ho)[1], u*0.06);     // red glowing eyes
  glowEye(P(0.2,-1.06-ho)[0],  P(0.2,-1.06-ho)[1],  u*0.055);
  if(g.kind==='boss'){ const piv=P(0.38,-0.5);                       // club swings from the hand
    ctx.save(); ctx.translate(piv[0],piv[1]); ctx.scale(dir,1); ctx.rotate(bossSwingAngle(g));
    rect(-u*0.08, -u*0.66, u*0.16, u*0.66, PAL.weapon);              // haft
    circle(0, -u*0.78, u*0.2, PAL.weapon);                          // heavy head
    ctx.restore(); }
  else if(g.kind==='archer'){ const bx=P(0.42,-0.62)[0], by=P(0.42,-0.62)[1], rr=u*0.5;
    ctx.save(); ctx.strokeStyle=PAL.weapon; ctx.lineWidth=Math.max(2,DPR*1.6); ctx.beginPath();
    if(dir>0) ctx.arc(bx,by,rr,-Math.PI*0.5,Math.PI*0.5); else ctx.arc(bx,by,rr,Math.PI*0.5,Math.PI*1.5);
    ctx.stroke(); ctx.beginPath(); ctx.moveTo(bx,by-rr); ctx.lineTo(bx,by+rr); ctx.stroke(); ctx.restore();
    rectP([bx-dir*u*0.1,by-u*0.03],[bx+dir*u*0.5,by+u*0.03], PAL.weapon);
  } else { const lh=P(-0.28,-0.55), rh=P(0.28,-0.55);
    tri(lh,[lh[0]-dir*u*0.18,lh[1]-u*0.05],[lh[0],lh[1]-u*0.16], PAL.claw);
    tri(rh,[rh[0]+dir*u*0.18,rh[1]-u*0.05],[rh[0],rh[1]-u*0.16], PAL.claw); }
}
function goblinFrontBack(pt,g,u,skin,front){
  const cx=pt.x, fy=pt.y;
  rectP([cx-u*0.18,fy-u*0.42],[cx-u*0.02,fy], PAL.goblinLoin);
  rectP([cx+u*0.02,fy-u*0.42],[cx+u*0.18,fy], PAL.goblinLoin);
  rectP([cx-u*0.24,fy-u*0.9],[cx+u*0.24,fy-u*0.4], skin);
  circle(cx, fy-u*1.06, u*0.26, skin);
  tri([cx-u*0.22,fy-u*1.12],[cx-u*0.44,fy-u*1.2],[cx-u*0.16,fy-u*0.98], skin);
  tri([cx+u*0.22,fy-u*1.12],[cx+u*0.44,fy-u*1.2],[cx+u*0.16,fy-u*0.98], skin);
  if(front){                                    // red glowing eyes
    glowEye(cx-u*0.09, fy-u*1.08, u*0.06); glowEye(cx+u*0.09, fy-u*1.08, u*0.06);
  }
  if(g.kind==='boss'){ const pivx=cx+u*0.34, pivy=fy-u*0.5;          // club swings from the hand
    ctx.save(); ctx.translate(pivx,pivy); ctx.rotate(bossSwingAngle(g));
    rect(-u*0.08, -u*0.68, u*0.16, u*0.68, PAL.weapon);              // haft
    circle(0, -u*0.8, u*0.2, PAL.weapon);                           // heavy head
    ctx.restore(); }
  else if(g.kind==='archer'){ const bx=cx+u*0.34, by=fy-u*0.6, rr=u*0.42;
    ctx.save(); ctx.strokeStyle=PAL.weapon; ctx.lineWidth=Math.max(2,DPR*1.5);
    ctx.beginPath(); ctx.arc(bx,by,rr,-Math.PI*0.5,Math.PI*0.5); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(bx,by-rr); ctx.lineTo(bx,by+rr); ctx.stroke(); ctx.restore(); }
  else { tri([cx-u*0.26,fy-u*0.52],[cx-u*0.44,fy-u*0.58],[cx-u*0.26,fy-u*0.72], PAL.claw);
         tri([cx+u*0.26,fy-u*0.52],[cx+u*0.44,fy-u*0.58],[cx+u*0.26,fy-u*0.72], PAL.claw); }
}

/* --- render (3/4 view) --- */
function draw(){
  // backdrop + grass field
  ctx.fillStyle=PAL.outside; ctx.fillRect(0,0,canvas.width,canvas.height);
  const g0=worldToScreen(0,0), g1=worldToScreen(WORLD,WORLD);
  rect(g0.x, g0.y, g1.x-g0.x, g1.y-g0.y, mapMode==='dungeon'?'#17181c':PAL.grass);
  if(mapMode==='dungeon') drawDungeonGround();   // rock and torchlight replace the meadow

  // moisture: transition ring (intermediate) then the darker core, so it eases into grass
  for(const m of world.moistRing){
    const a=worldToScreen(m.x*CELL,m.y*CELL), b=worldToScreen((m.x+1)*CELL,(m.y+1)*CELL);
    if(a.x>canvas.width||a.y>canvas.height||b.x<0||b.y<0) continue;
    rect(a.x, a.y, b.x-a.x+1, b.y-a.y+1, PAL.grassMoist2);
  }
  for(const m of world.moistCells){
    const a=worldToScreen(m.x*CELL,m.y*CELL), b=worldToScreen((m.x+1)*CELL,(m.y+1)*CELL);
    if(a.x>canvas.width||a.y>canvas.height||b.x<0||b.y<0) continue;
    rect(a.x, a.y, b.x-a.x+1, b.y-a.y+1, PAL.grassMoist);
  }

  // bare dirt ground: goblin camp + weapon-shop lot
  if(cave.placed){ for(const f of world.caveFloor){ const a=worldToScreen(f.x*CELL, f.y*CELL), b=worldToScreen((f.x+1)*CELL,(f.y+1)*CELL);
    rect(a.x, a.y, b.x-a.x+1, b.y-a.y+1, '#2e3136'); } }   // the cave's dark floor
  for(const m of (world.pathDirt||[]).concat(world.campDirt, world.shopDirt)){
    const a=worldToScreen(m.x*CELL,m.y*CELL), b=worldToScreen((m.x+1)*CELL,(m.y+1)*CELL);
    if(a.x>canvas.width||a.y>canvas.height||b.x<0||b.y<0) continue;
    rect(a.x, a.y, b.x-a.x+1, b.y-a.y+1, m.edge?PAL.dirtDark:PAL.dirt);
  }
  // tilled crop plots: ONE furrowed 3m-tile patch per plot, inset to leave a grass edge
  for(const [key] of world.crops){ const cx=key%GRID, cy=(key/GRID)|0;
    if(cx%TILE || cy%TILE) continue;                                        // draw once, from the plot's origin cell
    const a=worldToScreen(cx*CELL,cy*CELL), b=worldToScreen((cx+TILE)*CELL,(cy+TILE)*CELL);
    if(a.x>canvas.width||a.y>canvas.height||b.x<0||b.y<0) continue;
    const insx=(b.x-a.x)*0.05, insy=(b.y-a.y)*0.05, x0=a.x+insx, y0=a.y+insy, w=(b.x-a.x)-2*insx, h=(b.y-a.y)-2*insy;
    rect(x0, y0, w+1, h+1, PAL.farm);
    ctx.strokeStyle=PAL.farmFurrow; ctx.lineWidth=Math.max(1,DPR*0.9); ctx.beginPath();
    for(let k=1;k<=4;k++){ const yy=y0+h*k/5; ctx.moveTo(x0+1,yy); ctx.lineTo(x0+w-1,yy); }
    ctx.stroke();
  }
  for(const [key,c] of world.crops){ if(c.stage!=='seed') continue;         // scattered seeds, drawn once across the whole plot
    const cx=key%GRID, cy=(key/GRID)|0;
    if(cx%TILE || cy%TILE) continue;                                        // one scatter per plot, from its origin cell
    const a=worldToScreen(cx*CELL,cy*CELL), b=worldToScreen((cx+TILE)*CELL,(cy+TILE)*CELL);
    if(a.x>canvas.width||a.y>canvas.height||b.x<0||b.y<0) continue;
    const w=b.x-a.x, h=b.y-a.y;
    for(let i=0;i<12;i++){ const sx=a.x+w*(0.1+((i*53)%78)/100), sy=a.y+h*(0.12+((i*37)%72)/100); circle(sx,sy,Math.max(1,w*0.018),PAL.wheatSeed); }
  }

  // creek: shallow / mid / deep rings
  for(const c of world.water) drawWaterCell(c.x, c.y, c.ring);
  drawBridge();   // wooden 3/4 plank bridge over the creek (above the water so it isn't hidden)

  // subtle cell grid
  ctx.save();
  ctx.globalAlpha=0.10; ctx.strokeStyle=PAL.gridline; ctx.lineWidth=Math.max(1, DPR*0.6);
  ctx.beginPath();
  for(let k=0;k<=GRID;k+=3){                                   // the visible grid marks 3m tiles
    const a=worldToScreen(k*CELL,0), b=worldToScreen(k*CELL,WORLD);
    ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y);
    const c=worldToScreen(0,k*CELL), d=worldToScreen(WORLD,k*CELL);
    ctx.moveTo(c.x,c.y); ctx.lineTo(d.x,d.y);
  }
  ctx.stroke(); ctx.restore();

  // selection markers — flat ellipses (same aspect as the shadows)
  const selRing=(wx,wy,r)=>{ const c=worldToScreen(wx,wy); ctx.save(); ctx.strokeStyle=PAL.target;
    ctx.lineWidth=Math.max(1.5,DPR*1.4); ctx.beginPath(); ctx.ellipse(c.x,c.y,r,r*0.4,0,0,Math.PI*2); ctx.stroke(); ctx.restore(); };
  if(player.chopTree){ const tr=player.chopTree; selRing((tr.x+1.5)*CELL,(tr.y+2.9)*CELL, CELL*cam.scale*0.95); }
  else if(player.targetCell){
    if(mapMode==='forest'){                                                   // the destination TILE glows until you arrive
      const dtx=Math.floor(player.targetCell.x/TILE)*TILE, dty=Math.floor(player.targetCell.y/TILE)*TILE;
      const da=worldToScreen(dtx*CELL,dty*CELL), db=worldToScreen((dtx+TILE)*CELL,(dty+TILE)*CELL);
      ctx.save();
      rect(da.x, da.y, db.x-da.x, db.y-da.y, 'rgba(255,235,150,.16)');
      ctx.strokeStyle='rgba(255,235,150,.85)'; ctx.lineWidth=Math.max(2,DPR*1.8);
      ctx.strokeRect(da.x, da.y, db.x-da.x, db.y-da.y);
      ctx.restore();
    } else selRing((player.targetCell.x+0.5)*CELL,(player.targetCell.y+0.5)*CELL, CELL*cam.scale*0.42);
  }

  // upright sprites — painter's algorithm by depth (world y), back to front
  const items=[];
  if(shop.placed) items.push({wx:(shop.x+shop.w/2)*CELL, wy:(shop.y+shop.h)*CELL, kind:9});   // shop billboard, anchored at its front wall
  for(const s2 of (world.sites||[])) items.push({wx:(s2.tx*TILE+BUILDINGS[s2.kind].tiles*TILE/2)*CELL, wy:(s2.ty*TILE+BUILDINGS[s2.kind].tiles*TILE)*CELL, kind:29, ref:s2});   // build sites
  if(stall.placed) items.push({wx:(stall.x+stall.w/2)*CELL, wy:(stall.y+stall.h)*CELL, kind:13});   // seed stall
  if(butcher.placed) items.push({wx:(butcher.x+butcher.w/2)*CELL, wy:(butcher.y+butcher.h)*CELL, kind:28});   // butcher's stall
  if(armorShop.placed) items.push({wx:(armorShop.x+armorShop.w/2)*CELL, wy:(armorShop.y+armorShop.h)*CELL, kind:14});   // armor shop
  for(const p of world.shopProps) items.push({wx:(p.x+0.5)*CELL, wy:(p.y+0.9)*CELL, kind:11, ref:p});   // barrels & crates
  for(const [key,c] of world.crops){ if(c.stage==='wheat'){ const x=key%GRID, y=(key/GRID)|0;
    items.push({wx:(x+0.5)*CELL, wy:(y+0.95)*CELL, kind:12, cell:{x,y}}); } }   // grown wheat (9 stalks per plot)
  if(henge.placed){
    for(const st of henge.stones) items.push({wx:(st.x+0.5)*CELL, wy:(st.y+0.95)*CELL, kind:16});          // standing stones
    items.push({wx:(henge.altar.x+0.5)*CELL, wy:(henge.altar.y+0.95)*CELL, kind:17});                      // the altar
  }
  if(cave.placed) items.push({wx:(cave.x+2.5)*CELL, wy:(cave.y+4.95)*CELL, kind:18});                     // the cave: one great boulder, door and all
  if(mapMode==='dungeon'){
    for(const t2 of world.torches) items.push({wx:(t2.x+0.5)*CELL, wy:(t2.y+0.12)*CELL, kind:20, ref:t2});
    for(const r2 of world.rocks){ if(!r2.gone) items.push({wx:(r2.x+0.5)*CELL, wy:(r2.y+0.9)*CELL, kind:21, ref:r2}); }
    for(const pk2 of world.pickups){ if(!pk2.taken) items.push({wx:(pk2.x+0.5)*CELL, wy:(pk2.y+0.9)*CELL, kind:22, ref:pk2}); }
    items.push({wx:(dungeon.forge.x+1)*CELL, wy:(dungeon.forge.y+0.95)*CELL, kind:23});
    items.push({wx:(dungeon.throne.x+1)*CELL, wy:(dungeon.throne.y+0.9)*CELL, kind:24});
    for(const tp of world.tapestries) items.push({wx:(tp.x+0.5)*CELL, wy:(tp.y+0.95)*CELL, kind:25});
    items.push({wx:(dungeon.exit.x+0.5)*CELL, wy:(dungeon.exit.y+0.95)*CELL, kind:26});
  }
  for(const t of world.trees)    items.push({wx:(t.x+1.5)*CELL, wy:(t.y+2.9)*CELL, kind:0, grow:t.grow});   // one 3m tile per tree, trunk at the tile's south-centre
  for(const s2 of world.stumps)  items.push({wx:(s2.x+1.5)*CELL, wy:(s2.y+2.6)*CELL, kind:7});
  for(const ft of fallingTrees)  items.push({wx:(ft.x+1.5)*CELL, wy:(ft.y+2.9)*CELL, kind:8, ref:ft});
  for(const b of world.bushes)   items.push({wx:(b.x+0.5)*CELL, wy:(b.y+0.5)*CELL, kind:1, grow:b.grow});
  for(const c of world.cattails){ if(world.bridgeSet && world.bridgeSet.has(gi(c.x,c.y))) continue; items.push({wx:(c.x+0.5)*CELL, wy:(c.y+0.5)*CELL, kind:2, phase:c.x*0.7+c.y*1.3}); }  // hide cattails under the bridge
  // while chopping, draw the player just in front of the target tree so the swing is visible
  const pwy = (player.chopping && player.chopTree) ? (player.chopTree.y+1.9)*CELL + 1 : player.py;
  items.push({wx:player.px, wy:pwy, kind:3});
  if(net.mode!=='off'){ for(const RP of remotePlayers()){ if(RP.active && !RP.dead && (RP.map||'forest')===mapMode) items.push({wx:RP.px, wy:RP.py, kind:15, ref:RP}); } }   // fellow players (when on this map)
  for(const d of allDeer){ if(d.gone) continue; items.push({wx:d.px, wy:d.py, kind:4, ref:d}); }
  for(const tt of turtles){ if(tt.state==='hidden') continue; items.push({wx:tt.px, wy:tt.py, kind:10, ref:tt}); }   // turtles (hidden ones are underwater)
  if(campfire) items.push({wx:(campfire.x+0.5)*CELL, wy:(campfire.y+0.5)*CELL, kind:5});
  for(const g of goblins){ if(g.gone) continue; items.push({wx:(g.px!=null?g.px:(g.x+0.5)*CELL), wy:(g.py!=null?g.py:(g.y+0.5)*CELL), kind:6, ref:g}); }
  // target ring beneath the current objective — red for combat, blue for work (chop / harvest / loot).
  // Computed here, DRAWN after the world so canopies and bodies never hide it.
  let targetRing=null;
  {
    const u=CELL*cam.scale; let ring=null;
    if(player.attack && player.attack.ref && !creatureDead(player.attack.kind, player.attack.ref)){
      const tp=creaturePos(player.attack.kind, player.attack.ref), ref=player.attack.ref;
      ring={ x:tp.x, y:tp.y, rr:(ref.size>=2 ? u*1.5 : ref.big ? u*0.85 : ref.antlers ? u*0.68 : ref.fawn ? u*0.4 : u*0.55), col:'214,58,42' };
    }
    else if(player.propTarget && world.shopProps.includes(player.propTarget)){          // punching apart a barrel / crate — marked like an enemy
      const pr=player.propTarget; ring={ x:(pr.x+0.5)*CELL, y:(pr.y+0.8)*CELL, rr:u*0.45, col:'214,58,42' };
    }
    else if(player.chopTree && world.trees.includes(player.chopTree)){                  // felling a tree (one 3m tile)
      const t=player.chopTree; ring={ x:(t.x+1.5)*CELL, y:(t.y+2.6)*CELL, rr:u*0.85, col:'74,140,255' };
    }
    else if(player.harvestTarget!=null){                                               // reaping a wheat plot
      const k=player.harvestTarget, c=world.crops.get(k);
      if(c && c.stage==='wheat'){ const hx=k%GRID, hy=(k/GRID)|0, hbx=hx-(hx%TILE), hby=hy-(hy%TILE);
        ring={ x:(hbx+TILE/2)*CELL, y:(hby+TILE/2)*CELL, rr:u*1.5, col:'74,140,255' }; }   // the ring wraps the whole plot
    }
    else if(player.carcassTarget && player.carcassTarget.dead && !player.carcassTarget.gone){   // looting a deer carcass
      const d2=player.carcassTarget; ring={ x:d2.px, y:d2.py, rr:(d2.antlers?u*0.68:d2.fawn?u*0.4:u*0.55), col:'74,140,255' };
    }
    else if(player.soulTarget && player.soulTarget.dead && !player.soulTarget.gone){    // drawing a soul from a fallen enemy
      const gp2=creaturePos('goblin', player.soulTarget);
      ring={ x:gp2.x, y:gp2.y, rr:(player.soulTarget.size>=2?u*1.5:u*0.55), col:'74,140,255' };
    }
    targetRing=ring;
  }
  items.sort((a,b)=> a.wy - b.wy);
  const W=canvas.width, Hh=canvas.height;
  for(const it of items){
    const s=worldToScreen(it.wx,it.wy);
    if(s.x<-200||s.x>W+200||s.y<-260||s.y>Hh+200) continue;   // cull off-screen
    if(it.kind===0) drawTree(s, it.grow, it.wx, it.wy);
    else if(it.kind===1) drawBush(s, it.grow);
    else if(it.kind===2) drawCattail(s, it.phase);
    else if(it.kind===3){ const ps=worldToScreen(player.px, player.py); if(player.dead) drawDeadPlayer(ps); else drawPerson(ps); }   // real position; sorted in front of the tree
    else if(it.kind===4){ if(it.ref.dead) (it.ref.deadT>=DEER_FRESH_T ? drawBones : drawCorpse)(worldToScreen(it.ref.px,it.ref.py), it.ref); else drawDeer(s, it.ref); }
    else if(it.kind===5) drawFire(s);
    else if(it.kind===6){ if(it.ref.dead) ((it.ref.kind==='skeleton'||it.ref.kind==='bigskel'||it.ref.deadT>=60) ? drawBones : drawGoblinCorpse)(s, it.ref); else { drawGoblin(s, it.ref);
      if(it.ref.kind==='boss' && it.ref.hp<BOSS_HP){                                        // wounded boss: a red bar over his head
        const bu=CELL*cam.scale*2.85, bw=bu*1.1, bh=Math.max(3, bu*0.055), bx=s.x-bw/2, by=s.y-bu*2.15;
        rect(bx-2, by-2, bw+4, bh+4, 'rgba(15,10,8,.7)');
        rect(bx, by, bw*Math.max(0, Math.min(1, it.ref.hp/BOSS_HP)), bh, '#d43a2a');
      } } }
    else if(it.kind===7) drawStump(s);
    else if(it.kind===9) drawShop(s);
    else if(it.kind===12) drawWheat(it.cell);
    else if(it.kind===13) drawStall(s);
    else if(it.kind===29) drawSite(it.ref);
    else if(it.kind===28) drawButcher(s);
    else if(it.kind===14) drawArmorShop(s);
    else if(it.kind===10) drawTurtle(s, it.ref);
    else if(it.kind===11) drawProp(s, it.ref);
    else if(it.kind===15) drawRemote(worldToScreen(it.ref.px, it.ref.py), it.ref);   // a fellow player
    else if(it.kind===16) drawStandingStone(s);
    else if(it.kind===17) drawAltar(s);
    else if(it.kind===18) drawCaveBoulder(s, cave.unlocked);
    else if(it.kind===20) drawTorch(s, it.ref);
    else if(it.kind===21) drawOreRock(s, it.ref);
    else if(it.kind===22) drawPickupAxe(s);
    else if(it.kind===23) drawForge(s);
    else if(it.kind===24) drawThrone(s);
    else if(it.kind===25) drawTapestry(s);
    else if(it.kind===26) drawExitShaft(s);
    else drawFallingTree(s, it.ref);
  }

  if(targetRing){           // the objective ring rides above the world so nothing hides it
    const u=CELL*cam.scale, ts=worldToScreen(targetRing.x, targetRing.y), rr=targetRing.rr, pulse=0.5+0.5*Math.sin(animT*6);
    ctx.save();
    ctx.beginPath(); ctx.ellipse(ts.x, ts.y+u*0.04, rr, rr*TILT, 0, 0, Math.PI*2);
    ctx.fillStyle='rgba('+targetRing.col+','+(0.07+0.06*pulse).toFixed(3)+')'; ctx.fill();
    ctx.lineWidth=Math.max(2, u*0.07); ctx.strokeStyle='rgba('+targetRing.col+','+(0.6+0.35*pulse).toFixed(3)+')'; ctx.stroke();
    ctx.beginPath(); ctx.ellipse(ts.x, ts.y+u*0.04, rr*0.72, rr*0.72*TILT, 0, 0, Math.PI*2);   // inner ring, fainter
    ctx.lineWidth=Math.max(1, u*0.03); ctx.strokeStyle='rgba('+targetRing.col+','+(0.3+0.2*pulse).toFixed(3)+')'; ctx.stroke();
    ctx.restore();
  }
  drawParticles();          // VFX on top of the world
  if(mapMode==='forest'){   // the sky's mood washes over the meadow (the dungeon is forever torch-lit)
    const warm=duskWarmth(), dark=nightDarkness();
    if(warm>0.005) rect(0,0,canvas.width,canvas.height,'rgba(255,140,60,'+warm.toFixed(3)+')');
    if(dark>0.005) rect(0,0,canvas.width,canvas.height,'rgba(13,17,46,'+dark.toFixed(3)+')');
    drawFireflies(dark);    // and the fireflies come out along the banks
  }
  drawFloats();             // floating text (e.g. "+1 stamina")
  drawHurtFlash();          // red screen-edge flash when hurt
  drawChopTimer();          // countdown above a tree being chopped
  drawMineTimer();          // countdown above an ore rock being mined
  if(!player.dead){
    drawToolBar();          // tool buttons, bottom-centre
    drawInventory();        // wood count, left (only when you have wood)
    drawInvButton();        // satchel, bottom-right → opens the inventory screen
    drawBuildGhost();       // ground-select: the building's placement ghost
  }
  drawHearts();             // player HP, top-left
  drawStamina();            // stamina meter, under the hearts
  drawHudFace();            // player portrait, top-right
    drawGuldHUD();            // GULD purse under the portrait
  drawTimeHUD();            // the day dial — sun and moon riding the sky band
  drawMinimap();            // the world from on high, below the dial
  if(!player.dead){         // modal panels paint LAST — nothing (minimap, dial, hearts) may cover them
    drawShopUI();           // crafting modal, when the shop is open
    drawAltarUI();          // altar rites, when communing at the henge
    drawInvUI();            // inventory screen, when open
    drawBuildUI();          // the building catalog
    drawSiteUI();           // a build site's progress panel
  }
  // drawZoomHUD();         // zoom read-out retired — the 5×–10× band is settled (re-enable to tune again)
}
function drawHurtFlash(){
  if(player.hurtT<=0) return;
  const a=Math.min(0.8, (player.hurtT/0.5)*0.8), W=canvas.width, H=canvas.height;
  const g=ctx.createRadialGradient(W/2,H/2, Math.min(W,H)*0.2, W/2,H/2, Math.max(W,H)*0.62);
  g.addColorStop(0,'rgba(200,20,20,0)'); g.addColorStop(0.6,'rgba(200,20,20,'+(a*0.35).toFixed(3)+')'); g.addColorStop(1,'rgba(190,12,12,'+a.toFixed(3)+')');
  ctx.save(); ctx.fillStyle=g; ctx.fillRect(0,0,W,H); ctx.restore();
}
function drawMineTimer(){                          // countdown above an ore rock being mined
  const r=player.mineRock; if(!r || player.path.length) return;
  if(Math.hypot(cellOf(player.px)-r.x, cellOf(player.py)-r.y)>1.6) return;
  const u=CELL*cam.scale, s=worldToScreen((r.x+0.5)*CELL, (r.y+0.5)*CELL);
  const need=r.type==='silver'?25:10;

function updateHarvest(dt){
  const key=player.harvestTarget; const c=world.crops.get(key);
  if(!c || c.stage!=='wheat'){ player.harvestTarget=null; player.carcassTarget=null; return true; }   // gone / not ripe anymore
  const x=key%GRID, y=(key/GRID)|0, bx=x-(x%TILE), by=y-(y%TILE);
  const px=(bx+TILE/2)*CELL, py=(by+TILE/2)*CELL;                     // the plot's centre — one reap gathers the whole tile
  const dist=Math.hypot((player.px-px)/CELL, (player.py-py)/CELL);
  if(dist<=2.3){
    let est=0; for(let dy=0;dy<TILE;dy++) for(let dx=0;dx<TILE;dx++){ const cc=world.crops.get(gi(bx+dx,by+dy)); if(cc && cc.stage==='wheat') est++; }
    const err=canCarry(Math.ceil(est/3)*ITEM_LBS.wheat, (player.wheat||0)>0?0:1);
    if(err){ packRefuse(err); player.harvestTarget=null; player.path=[]; return true; }   // the wheat stands until you can carry it
    player.path=[]; player.targetCell=null; player.face=face8(px-player.px, py-player.py);
    let n=0;
    for(let dy=0;dy<TILE;dy++) for(let dx=0;dx<TILE;dx++){ const cc=world.crops.get(gi(bx+dx,by+dy));
      if(cc && cc.stage==='wheat'){ cc.stage='till'; cc.t=0; n++; } }
    const gain=Math.ceil(n/3);                                                      // a full plot yields 3 wheat — no stamina;
    player.wheat=(player.wheat||0)+gain;                                            // wheat only feeds you cooked into a meal
    addFloat('+'+gain+' wheat', player.px, player.py-CELL*1.9, PAL.wheatStalk);
    if(typeof net!=='undefined' && net.mode==='guest') netSend({t:'cropAct', map:mapMode, op:'harv', key});   // tell the host this plot was reaped
    spawnHarvestFX(px, py); player.harvestTarget=null; player.carcassTarget=null;
  } else {
    player.repathH-=dt;
    if(!player.path.length || player.repathH<=0){ pathToCell(bx+1,by+1); player.repathH=0.45; }
  }
  return false;   // harvesting owns the player this frame
}

function invUIClick(cx,cy){
  const L=invLayout(), inR=(r)=> cx>=r.x&&cx<=r.x+r.w&&cy>=r.y&&cy<=r.y+r.h;
  if(inR(L.closeBtn)){ invUI.open=false; return; }
  for(const t of L.tabs){ if(inR(t)){ invUI.tab=t.key; return; } }
  for(const sl of L.slots){ if(inR(sl)){ sl.def.toggle(); return; } }   // tap a slot: unequip what's worn / put on what's owned
  for(const c of L.cells){ if(c.it.kind==='weapon' && inR(c)){
    const w=c.it.def;
    if(w.slot==='melee')  player.equipMelee  = player.equipMelee===w.k ? null : w.k;   // tap toggles equip
    else                  player.equipRanged = player.equipRanged===w.k ? null : w.k;
    return; } }
  for(const c of L.cells){ if(c.it.kind==='armor' && inR(c)){ const a=c.it.def; player[a.eq]=player[a.eq]?0:1;
    if(a.k==='chainmail'&&player.eqChainmail) player.eqArmor=0;                        // chain and leather can't share the body
    if(a.k==='armor'&&player.eqArmor) player.eqChainmail=0; return; } }   // tap toggles worn
  if(cx<L.px||cx>L.px+L.pw||cy<L.py||cy>L.py+L.ph) invUI.open=false;     // tap outside closes
}
/* --- tool bar (screen-space, bottom-centre): axe always; club/bow once crafted --- */
function toolGroups(){
  const tools=['axe']; if(player.pickaxe>0) tools.push('pickaxe'); if(player.hoe>0) tools.push('hoe'); if(player.seeds>0) tools.push('seeds');
  const weapons=[];                                                                                 // weapon buttons appear only when EQUIPPED (see the inventory screen)
  if(player.equipMelee && player[player.equipMelee]>0) weapons.push(player.equipMelee);
  if((player.equipRanged==='bow'&&player.bow>0) || (player.equipRanged==='longbow'&&player.longbow>0)) weapons.push(player.equipRanged);
  const food=[];                                                                                    // tap a meal to eat it on the spot
  if((player.jerky||0)>0) food.push('jerky');
  if((player.meal||0)>0)  food.push('meal');
  return { tools, weapons, food };
}
function toolButtons(){
  const {tools, weapons, food}=toolGroups();
  const s=Math.max(76, 56*DPR), gap=s*0.2, groupGap=s*0.75;
  const wT=tools.length*s+(tools.length-1)*gap;
  const wW=weapons.length?weapons.length*s+(weapons.length-1)*gap:0;
  const wF=food.length?food.length*s+(food.length-1)*gap:0;
  const wB=(mapMode==='forest')?s:0;                                                                // the BUILD action (forest only)
  const total=wT + (weapons.length?groupGap+wW:0) + (food.length?groupGap+wF:0) + (wB?groupGap+wB:0);
  let x=canvas.width/2 - total/2; const y=canvas.height - s*1.34;
  const out=[];
  for(const k of tools){ out.push({key:k, x, y, w:s, h:s, group:'tools'}); x+=s+gap; }
  if(weapons.length){ x += groupGap - gap; for(const k of weapons){ out.push({key:k, x, y, w:s, h:s, group:'weapons'}); x+=s+gap; } }
  if(food.length){ x += groupGap - gap; for(const k of food){ out.push({key:k, x, y, w:s, h:s, group:'food'}); x+=s+gap; } }
  if(mapMode==='forest'){ x += groupGap - gap; out.push({key:'build', x, y, w:s, h:s, group:'build'}); }
  return out;
}

    player.jerky--; player.hp=Math.min(player.hpMax, player.hp+5); player.stamina=Math.min(100, player.stamina+20);
    addFloat('+5 HP', player.px, player.py-CELL*2.1, PAL.heartFull);
    addFloat('+20 stamina', player.px, player.py-CELL*1.7, PAL.stamFill);
    foodCD=FOOD_CD;
  } else if(k==='meal'){
    if((player.meal||0)<1) return;
    if(player.hp>=player.hpMax && player.stamina>=100){ addFloat('Already full!', player.px, player.py-CELL*1.9, '#cfd6de'); return; }
    player.meal--; player.hp=Math.min(player.hpMax, player.hp+40); player.stamina=100;
    addFloat('+40 HP — a hearty feast!', player.px, player.py-CELL*2.1, '#ffd44d');
    addFloat('stamina restored', player.px, player.py-CELL*1.7, PAL.stamFill);
    foodCD=FOOD_CD;
  }
}
function drawToolIcon(key, cx, cy, s){
  if(key==='build'){                                  // a mallet over a fresh plank
    rect(cx-s*0.3, cy+s*0.16, s*0.6, s*0.1, PAL.plankHi);
    beam(cx-s*0.16, cy+s*0.1, cx+s*0.12, cy-s*0.16, s*0.055, PAL.trunk);
    rect(cx+s*0.0, cy-s*0.34, s*0.32, s*0.18, PAL.steelDark);
    return;
  }
  if(key==='jerky'){                                  // a gnarled strip of smoked venison
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(-0.5);
    ctx.fillStyle='#7d3a22'; ctx.beginPath();
    ctx.moveTo(-s*0.3, -s*0.09); ctx.quadraticCurveTo(-s*0.1, -s*0.2, s*0.12, -s*0.07);
    ctx.quadraticCurveTo(s*0.3, s*0.02, s*0.32, s*0.1); ctx.lineTo(s*0.18, s*0.14);
    ctx.quadraticCurveTo(-s*0.05, s*0.02, -s*0.26, s*0.08); ctx.closePath(); ctx.fill();
    ctx.strokeStyle='#5e2a17'; ctx.lineWidth=Math.max(1.4,DPR*1.4);
    ctx.beginPath(); ctx.moveTo(-s*0.22, 0); ctx.quadraticCurveTo(0, -s*0.08, s*0.22, s*0.04); ctx.stroke();
    ctx.restore(); return;
  }
  if(key==='meal'){                                   // a steaming bowl of stew
    ctx.fillStyle='#8a5a3a'; ctx.beginPath(); ctx.ellipse(cx, cy+s*0.06, s*0.3, s*0.17, 0, 0, Math.PI); ctx.fill();   // bowl
    rect(cx-s*0.34, cy+s*0.02, s*0.68, s*0.06, '#8a5a3a');
    ctx.fillStyle='#b04a3a'; ctx.beginPath(); ctx.ellipse(cx, cy+s*0.03, s*0.28, s*0.08, 0, 0, Math.PI*2); ctx.fill(); // stew
    circle(cx-s*0.1, cy+s*0.015, s*0.05, '#d9a05a'); circle(cx+s*0.09, cy+s*0.035, s*0.045, '#7d3a22');               // chunks
    ctx.save(); ctx.strokeStyle='rgba(240,240,240,.75)'; ctx.lineWidth=Math.max(1.4,DPR*1.5);                          // steam
    for(const off of [-s*0.12, s*0.05]){ ctx.beginPath(); ctx.moveTo(cx+off, cy-s*0.08);
      ctx.quadraticCurveTo(cx+off-s*0.05, cy-s*0.2, cx+off+s*0.02, cy-s*0.32); ctx.stroke(); }
    ctx.restore(); return;
  }
  if(key==='longbow'){ drawToolIcon('bow', cx, cy, s*1.12); return; }   // long bow button: the same bow, grander
  if(key==='sword'||key==='gaxe'||key==='pickaxe'){
    if(key==='pickaxe'){ beam(cx-0.22*s, cy+0.3*s, cx+0.14*s, cy-0.18*s, s*0.055, PAL.trunk);   // pick: haft + curved head
      ctx.strokeStyle='#9aa4ae'; ctx.lineWidth=Math.max(3, s*0.08);
      ctx.beginPath(); ctx.arc(cx+0.1*s, cy-0.02*s, s*0.3, Math.PI*1.15, Math.PI*1.95); ctx.stroke(); return; }
    drawShopItemIcon(key, cx, cy, s*0.62); return; }
  if(key==='axe'){                                    // hatchet: short stout haft + a chunky curved head
    const gbx=cx-0.24*s, gby=cy+0.38*s, gtx=cx+0.04*s, gty=cy+0.02*s;   // short handle
    beam(gbx, gby, gtx, gty, s*0.062, PAL.trunk);
    beam(gbx, gby, gtx, gty, s*0.02, PAL.stump);                  // grain
    circle(gbx, gby, s*0.055, PAL.trunk);                         // butt knob
    const ex=gtx, ey=gty-0.15*s;                                  // head anchor
    rect(ex-0.16*s, ey+0.0*s, 0.13*s, 0.2*s, PAL.steelDark);      // hammer poll (back)
    ctx.fillStyle=PAL.axeBlade; ctx.beginPath();                  // wedge bit: flat top, convex cutting edge (hatchet)
    ctx.moveTo(ex-0.03*s, ey-0.13*s);                             // top-back at the eye
    ctx.lineTo(ex+0.38*s, ey-0.17*s);                             // toe (straight top edge angling up)
    ctx.quadraticCurveTo(ex+0.50*s, ey+0.08*s, ex+0.33*s, ey+0.36*s);   // convex cutting edge
    ctx.lineTo(ex-0.03*s, ey+0.29*s);                             // heel (bottom-back)
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle=PAL.steelDark; ctx.lineWidth=Math.max(1.4,DPR*1.6); ctx.beginPath();   // bevel near the edge
    ctx.moveTo(ex+0.33*s, ey-0.11*s); ctx.quadraticCurveTo(ex+0.42*s, ey+0.08*s, ex+0.27*s, ey+0.31*s); ctx.stroke();
  } else if(key==='seeds'){                           // wheat seed pouch: a wheat sheaf
    drawWheatSymbol(cx, cy-s*0.02, s*0.62);
  } else if(key==='hoe'){                             // garden hoe: long haft + flat angled blade
    const topx=cx+0.26*s, topy=cy-0.36*s, botx=cx-0.04*s, boty=cy+0.14*s;
    beam(topx, topy, botx, boty, s*0.055, PAL.trunk);
    beam(topx, topy, botx, boty, s*0.016, PAL.stump);            // grain
    beam(botx, boty, botx-0.04*s, boty+0.14*s, s*0.05, PAL.steelDark);   // gooseneck down
    quad([botx-0.28*s, boty+0.12*s],[botx+0.06*s, boty+0.16*s],[botx+0.04*s, boty+0.34*s],[botx-0.30*s, boty+0.30*s], PAL.axeBlade);  // flat blade
  } else if(key==='club'){                            // tapered wooden cudgel
    beam(cx-s*0.22, cy+s*0.34, cx+s*0.2, cy-s*0.34, s*0.07, PAL.trunk);
    circle(cx+s*0.2, cy-s*0.34, s*0.16, PAL.trunk); circle(cx+s*0.12, cy-s*0.2, s*0.08, PAL.stump);
    circle(cx+s*0.26, cy-s*0.4, s*0.05, PAL.stump); circle(cx+s*0.12, cy-s*0.44, s*0.045, PAL.stump);
  } else {                                            // bow + nocked arrow
    ctx.save(); ctx.strokeStyle=PAL.trunk; ctx.lineWidth=Math.max(2.5,DPR*2.6);
    ctx.beginPath(); ctx.arc(cx-s*0.12, cy, s*0.34, -Math.PI*0.62, Math.PI*0.62); ctx.stroke();
    ctx.strokeStyle=PAL.stump; ctx.lineWidth=Math.max(1,DPR); ctx.beginPath();
    ctx.moveTo(cx-s*0.12+Math.cos(-Math.PI*0.62)*s*0.34, cy+Math.sin(-Math.PI*0.62)*s*0.34);
    ctx.lineTo(cx-s*0.12+Math.cos(Math.PI*0.62)*s*0.34, cy+Math.sin(Math.PI*0.62)*s*0.34); ctx.stroke(); ctx.restore();
    rect(cx-s*0.28, cy-s*0.03, s*0.5, s*0.06, PAL.trunk); tri([cx+s*0.2,cy-s*0.1],[cx+s*0.2,cy+s*0.1],[cx+s*0.34,cy], PAL.axeBlade);
  }
}
function drawToolBar(){
  const btns=toolButtons(); if(!btns.length) return;
  // group headers above each cluster
  const groups={}; for(const b of btns){ (groups[b.group]=groups[b.group]||[]).push(b); }
  ctx.save(); ctx.fillStyle=PAL.target; ctx.font='bold '+Math.round(btns[0].w*0.17)+'px system-ui, sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='bottom';
  for(const gname in groups){ const gs=groups[gname], x0=gs[0].x, x1=gs[gs.length-1].x+gs[gs.length-1].w;
    ctx.fillText(gname==='tools'?'TOOLS':gname==='food'?'FOOD':gname==='build'?'BUILD':'WEAPONS', (x0+x1)/2, gs[0].y - Math.max(4,4*DPR)); }
  ctx.restore();
  for(const b of btns){
    const sel=player.tool===b.key || (b.key==='build' && (buildUI.open || !!buildMode));
    ctx.save();
    ctx.globalAlpha=0.9; ctx.fillStyle=PAL.outside; ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.globalAlpha=1; ctx.strokeStyle = sel?PAL.target:PAL.trunk;
    ctx.lineWidth=Math.max(2, DPR*(sel?2.4:1.4)); ctx.strokeRect(b.x, b.y, b.w, b.h);
    drawToolIcon(b.key, b.x+b.w/2, b.y+b.h*0.42, b.w);
    ctx.fillStyle='#ffffff'; ctx.font='bold '+Math.round(b.w*0.19)+'px system-ui, sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='alphabetic'; ctx.fillText(b.key, b.x+b.w/2, b.y+b.h*0.92);
    const badge = b.key==='seeds'?player.seeds : (b.key==='bow'||b.key==='longbow')?player.arrows : b.key==='jerky'?player.jerky : b.key==='meal'?player.meal : null;   // count badge (seeds / arrows / food)
    if(badge!=null){
      ctx.fillStyle=PAL.stamFill; ctx.font='bold '+Math.round(b.w*0.24)+'px system-ui, sans-serif';
      ctx.textAlign='right'; ctx.textBaseline='top'; ctx.fillText(badge, b.x+b.w-4*DPR, b.y+3*DPR);
    }
    if(b.group==='food' && foodCD>0){                                       // digestion: a clock-sweep shade drains away over 10 s
      const frac=foodCD/FOOD_CD, cx3=b.x+b.w/2, cy3=b.y+b.h/2, R3=b.w;      // radius > half-diagonal so the pie covers the corners
      ctx.save();
      ctx.beginPath(); ctx.rect(b.x, b.y, b.w, b.h); ctx.clip();
      ctx.beginPath(); ctx.moveTo(cx3, cy3);
      ctx.arc(cx3, cy3, R3, -Math.PI/2, -Math.PI/2 + frac*Math.PI*2, false);
      ctx.closePath(); ctx.fillStyle='rgba(10,8,6,.68)'; ctx.fill();
      ctx.fillStyle='#f4e7cf'; ctx.font='bold '+Math.round(b.w*0.3)+'px system-ui, sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(Math.ceil(foodCD), cx3, cy3);
      ctx.restore();
    }
    ctx.restore();
  }
}

function drawHudFace(){                            // player portrait (of the chosen race), top-right corner
  const im=(typeof RACE_FACES!=='undefined' && RACE_FACES[player.race]) || hudFace;
  if(!im || !im.complete || !im.naturalWidth) return;
  const sz=Math.max(64, 88*DPR), pad=Math.max(10, 12*DPR), x=canvas.width-sz-pad, y=pad;
  ctx.drawImage(im, x, y, sz, sz);
}
function heart(cx,cy,r,color){
  circle(cx-r*0.5, cy-r*0.3, r*0.55, color);
  circle(cx+r*0.5, cy-r*0.3, r*0.55, color);
  tri([cx-r*1.02, cy-r*0.05],[cx+r*1.02, cy-r*0.05],[cx, cy+r*1.2], color);
}
function heartBand(cx,cy,r, a, b, color, alpha){       // draw the heart, clipped to horizontal fraction a..b
  if(b<=a) return;
  ctx.save(); if(alpha!=null) ctx.globalAlpha=alpha;
  const bx=cx-r*1.05, bw=r*2.1, by=cy-r*0.95, bh=r*2.3;
  ctx.beginPath(); ctx.rect(bx+bw*a, by, bw*(b-a), bh); ctx.clip();
  heart(cx,cy,r,color); ctx.restore();
}
function drawHearts(){
  const r=Math.max(9, 11*DPR), gap=r*2.7, x0=r*1.9, y0=r*1.8;
  const hp=player.hp, top=hp+(player.lostHp||0);         // top = HP before the recent damage
  const alpha=player.dmgT>0 ? Math.min(1, player.dmgT/DMG_FLASH) : 0;
  const N=Math.ceil((player.hpMax||HP_PER_HEART*5)/HP_PER_HEART);   // one heart per 10 HP — count varies by race
  for(let i=0;i<N;i++){                                   // each heart = HP_PER_HEART points
    const cx=x0+i*gap, cy=y0, base=i*HP_PER_HEART;
    heart(cx,cy,r,PAL.heartEmpty);                        // empty base
    const fill=Math.max(0,Math.min(1,(hp-base)/HP_PER_HEART));
    heartBand(cx,cy,r, 0, fill, PAL.heartFull);           // current health (red)
    const lost=Math.max(0,Math.min(1,(top-base)/HP_PER_HEART));
    if(lost>fill && alpha>0) heartBand(cx,cy,r, fill, lost, PAL.pMilk, alpha);   // lost HP (white, fading)
  }
}
