let last=0, animT=0, fishTimer=6+Math.random()*10, smokeTimer=0, herdRespawnT=0;
/* --- day & night: one full cycle in 8 minutes, shared by the whole party --- */
const DAY_LEN=480;                                   // seconds per full day+night
let worldTime=DAY_LEN*0.35;                          // begin mid-morning (~8:24)
function dayHour(){ return ((worldTime%DAY_LEN)/DAY_LEN)*24; }   // 0..24, 12 = noon
function smoothstep01(t){ t=Math.max(0,Math.min(1,t)); return t*t*(3-2*t); }
function nightDarkness(){                            // 0 in daylight … 0.62 at deep night, smooth at the edges
  const h=dayHour();
  if(h>=7 && h<17) return 0;
  if(h>=17 && h<20) return smoothstep01((h-17)/3)*0.62;   // dusk
  if(h>=5 && h<7)  return (1-smoothstep01((h-5)/2))*0.62; // dawn
  return 0.62;                                            // night
}
function duskWarmth(){                               // an orange wash that swells at sunset & sunrise
  const h=dayHour();
  const g=(c,w)=>Math.exp(-((h-c)*(h-c))/(2*w*w));
  return 0.16*(g(18,0.9)+g(6,0.9));
}
let camFollow=true;                                  // camera trails the hero; dragging peeks, moving re-engages
/* --- fireflies: little green lights that gather near the water after dark --- */
let fireflies=null, ffSeeded='';
function seedFireflies(){                             // anchor a handful of fireflies to shallow-water banks
  fireflies=[]; ffSeeded=mapMode;
  if(mapMode!=='forest') return;
  const banks=[];
  for(let y=1;y<GRID-1;y++) for(let x=1;x<GRID-1;x++){
    if(world.terrain[gi(x,y)]!==3) continue;                      // shallow water…
    if(world.terrain[gi(x-1,y)]===0||world.terrain[gi(x+1,y)]===0||world.terrain[gi(x,y-1)]===0||world.terrain[gi(x,y+1)]===0)
      banks.push({x,y});                                          // …touching grass: a bank
  }
  for(let i=0;i<240 && banks.length;i++){
    const b=banks[(Math.random()*banks.length)|0];
    fireflies.push({ ax:(b.x+0.5)*CELL, ay:(b.y+0.5)*CELL,
      rx:CELL*(0.6+Math.random()*1.6), ry:CELL*(0.4+Math.random()*1.0),
      sp:0.25+Math.random()*0.5, p1:Math.random()*6.28, p2:Math.random()*6.28, fl:2+Math.random()*3 });
  }
}
function drawFireflies(dark){                         // drawn above the night wash so they truly glow
  if(mapMode!=='forest' || dark<0.12) return;
  if(!fireflies || ffSeeded!==mapMode) seedFireflies();
  const a0=Math.min(1,(dark-0.12)/0.3), u=CELL*cam.scale, W=canvas.width, H=canvas.height;
  ctx.save();
  for(const f of fireflies){
    const wx=f.ax+Math.sin(animT*f.sp+f.p1)*f.rx, wy=f.ay+Math.sin(animT*f.sp*1.37+f.p2)*f.ry;
    const s=worldToScreen(wx, wy-CELL*0.35);                      // hovering just above the reeds
    if(s.x<-30||s.x>W+30||s.y<-30||s.y>H+30) continue;
    const tw=0.3+0.7*Math.abs(Math.sin(animT*f.fl+f.p2));         // slow twinkle
    ctx.globalAlpha=a0*tw*0.35; circle(s.x, s.y, Math.max(2,u*0.085), '#b8e86a');   // soft halo
    ctx.globalAlpha=a0*tw;      circle(s.x, s.y, Math.max(1,u*0.035), '#eaffb0');   // bright core
  }
  ctx.restore();
}
function respawnHerd(){                      // a fresh little herd wanders in east of the creek
  const minX=Math.max(2, Math.min(GRID-4, (world.creekMaxX!=null?world.creekMaxX:0)+2));
  let bc=null;
  for(let i=0;i<600 && !bc;i++){ const x=minX+((Math.random()*(GRID-minX))|0), y=(Math.random()*GRID)|0;
    if(spawnableCell(x,y) && !occupied(x,y,null)) bc={x,y}; }
  if(!bc) bc={x:Math.min(GRID-2,minX+5), y:(GRID/2)|0};
  const nb=makeDeer(null, true, C_BUCK, 0.945);
  nb.px=(bc.x+0.5)*CELL; nb.py=(bc.y+0.5)*CELL;
  const herd=[nb];
  for(let i=0;i<3;i++){ const d=makeDeer(nb, false, C_DOE, 0.81);
    const c=nearestOpen(bc.x+((Math.random()*7)|0)-3, bc.y+((Math.random()*7)|0)-3) || bc;
    d.px=(c.x+0.5)*CELL; d.py=(c.y+0.5)*CELL; herd.push(d); }
  for(const d of herd){ if(allDeer.length<DEER_CAP){ allDeer.push(d); deerWander(d); } }
}
function updateCamFollow(dt){                     // glide the camera after the hero (a drag pauses it; moving resumes it)
  if(!camFollow || player.dead) return;
  const pp=projOf(player.px, player.py);
  const tx=pp.x-(canvas.width/2)/cam.scale, ty=pp.y-(canvas.height/2)/cam.scale;
  const k=1-Math.exp(-dt*4);
  cam.ox+=(tx-cam.ox)*k; cam.oy+=(ty-cam.oy)*k; clampCam();
}
function loop(ts){
  const dt=Math.min(0.05, ((ts-last)/1000)||0); last=ts; animT+=dt;
  if(scene!=='game'){                          // title / character-select: nothing simulates yet
    if(scene==='tavern') drawTavern(dt);
    requestAnimationFrame(loop); return;
  }
  if(player.hurtT>0) player.hurtT-=dt;                                                           // fade the hurt flash
  if(player.dmgT>0){ player.dmgT-=dt; if(player.dmgT<=0){ player.dmgT=0; player.lostHp=0; } }   // fade the lost-HP chunks
  // --- death sequence: centre + slow zoom, spew blood, then a skeleton ---
  if(player.dead){
    player.deadT+=dt;
    cam.scale=Math.min(maxScale, cam.scale*(1+0.11*dt));                                          // slow zoom-in
    const pp=projOf(player.px, player.py); cam.ox=pp.x-(canvas.width/2)/cam.scale; cam.oy=pp.y-(canvas.height/2)/cam.scale;
    if(player.deadT<2.6){ player.spewT-=dt; if(player.spewT<=0){ player.spewT=0.11;              // spew blood
      spawnBlood(player.px+(Math.random()-0.5)*CELL*0.4, player.py-CELL*0.45, 7, false); } }
    for(const g of goblins){ if(g.swingT>0) g.swingT-=dt; }                                       // let the killing club swing finish
    updateParticles(dt); draw();
    if(player.deadT>=3.2) drawPlayAgain(); else playAgainBtn=null;                                // offer a restart once the zoom settles
    requestAnimationFrame(loop); return;
  }
  if(net.mode==='guest'){                        // co-op guest: the world is streamed from the host; only run the local hero
    player.stamina = Math.max(0, player.stamina - dt*(10/60));
    if(player.stamina<=0){ player.starveHp=(player.starveHp||0)+dt; if(player.starveHp>=60){ player.starveHp=0; playerHit(1, false, true); } } else player.starveHp=0;
    if(shop.msgT>0) shop.msgT-=dt;
    if(player.tool){ const g=toolGroups(); if(!g.tools.includes(player.tool) && !g.weapons.includes(player.tool)) player.tool=null; }
    updateCombat(dt); updatePlayer(dt); updateChop(dt); updateMine(dt); updateFelling(dt); updateStumps(dt);
    if(mapMode==='dungeon' && world.pickups){ for(const pk2 of world.pickups){ if(pk2.taken) continue;
      if(Math.hypot(player.px-(pk2.x+0.5)*CELL, player.py-(pk2.y+0.5)*CELL)<CELL*1.2){
        const err=canCarry(ITEM_LBS.pickaxe, player.pickaxe>0?0:1); if(err){ packRefuse(err); continue; }
        pk2.taken=true; player.pickaxe=1; addFloat('+ Pickaxe!', player.px, player.py-CELL*1.9, '#cfd6de');
        netSend({t:'pick', map:mapMode, i:world.pickups.indexOf(pk2)}); } } }
    for(const t2 of turtles) updateTurtle(t2, dt);   // local ambience the host doesn't stream: turtles bask & dive…
    fishTimer-=dt; if(fishTimer<=0){ fishTimer=6+Math.random()*8; if(mapMode==='forest') spawnFishAtDeep(); }   // …and fish jump
    updateFloats(dt); updateParticles(dt);
    worldTime+=dt;                                  // the sun keeps moving between server snapshots
    if(foodCD>0) foodCD=Math.max(0, foodCD-dt);
    updateCamFollow(dt);
    netUpdate(dt); draw(); requestAnimationFrame(loop); return;
  }
  player.stamina = Math.max(0, player.stamina - dt*(10/60));                                     // stamina drains 10/min
  if(player.stamina<=0){ player.starveHp=(player.starveHp||0)+dt; if(player.starveHp>=60){ player.starveHp=0; playerHit(1, false, true); } }  // starving: -1 HP / min (armor doesn't help)
  else player.starveHp=0;
  if(shop.msgT>0) shop.msgT-=dt;                                                                 // fade the shop message
  if(player.tool){ const g=toolGroups(); if(!g.tools.includes(player.tool) && !g.weapons.includes(player.tool)) player.tool=null; }  // deselect a tool that's no longer owned
  updateCombat(dt); updatePlayer(dt); updateChop(dt); updateMine(dt); updateFelling(dt); updateStumps(dt); updateBushes(dt);
  updateGoblins(dt); updateCrops(dt);
  if(mapMode==='dungeon' && world.pickups){                       // a pickaxe on the floor is yours for the taking
    for(const pk2 of world.pickups){ if(pk2.taken) continue;
      if(Math.hypot(player.px-(pk2.x+0.5)*CELL, player.py-(pk2.y+0.5)*CELL)<CELL*1.2){
        const err=canCarry(ITEM_LBS.pickaxe, player.pickaxe>0?0:1); if(err){ packRefuse(err); continue; }
        pk2.taken=true; player.pickaxe=1; addFloat('+ Pickaxe!', player.px, player.py-CELL*1.9, '#cfd6de');
        if(typeof net!=='undefined' && net.mode==='guest' && net.connected) netSend({t:'pick', map:mapMode, i:world.pickups.indexOf(pk2)}); } } }
  fishTimer-=dt; if(fishTimer<=0){ fishTimer=6+Math.random()*8; if(mapMode==='forest') spawnFishAtDeep(); }   // fish jump (2x more likely)
  smokeTimer-=dt; if(smokeTimer<=0 && campfire){ smokeTimer=0.22+Math.random()*0.18;   // campfire smoke
    spawnSmoke((campfire.x+0.5)*CELL+(Math.random()-0.5)*CELL*0.3, (campfire.y+0.4)*CELL); }
  for(const d of allDeer){ const ox=d.px, oy=d.py; updateDeer(d, dt);
    if(!d.dead && !d.gone) separate(d, dt);                                                 // don't stack on another creature's tile
    if(!d.dead && (Math.abs(d.px-ox)>0.001||Math.abs(d.py-oy)>0.001)) waterWake(d, dt); }   // creatures ripple when moving in water
  if(pendingDeer.length){ for(const nd of pendingDeer) if(allDeer.length<DEER_CAP) allDeer.push(nd); pendingDeer.length=0; }  // add newborn fawns
  // herd & goblin renewal only applies to the forest above ground
  if(mapMode==='forest'){
    if(!allDeer.some(d=>!d.dead && !d.gone)){ herdRespawnT+=dt; if(herdRespawnT>=300){ herdRespawnT=0; respawnHerd(); } }
    else herdRespawnT=0;
    if(!goblins.some(g=>(g.kind==='claw'||g.kind==='archer') && !g.dead && !g.gone)) respawnGoblins();
  }
  updateFloats(dt);
  for(const t of turtles) updateTurtle(t, dt);
  // ripples when the player wades through shallow water (but not on the wooden bridge)
  if(player.path.length && isShallow(cellOf(player.px), cellOf(player.py)) && !onBridge(cellOf(player.px), cellOf(player.py))){
    player.rippleT=(player.rippleT||0)-dt;
    if(player.rippleT<=0){ player.rippleT=0.24; spawnRipple(player.px, player.py); }
  }
  updateParticles(dt);
  worldTime+=dt;                                  // the sun arcs on — one full day every 8 minutes
  if(foodCD>0) foodCD=Math.max(0, foodCD-dt);
  if(!DEDICATED) updateCamFollow(dt);
  if(net.mode==='host') netUpdate(dt);            // stream the shared world to the guest
  simulateOtherMap(dt);                           // …and tick whichever map the partner is on
  if(!DEDICATED) draw();                          // a headless server skips rendering entirely
  requestAnimationFrame(loop);
}

/* --- input : pointers (mouse + touch unified) --- */
const pointers = new Map();
let downPt=null, lastPt=null, movedFar=false, dragging=false, pinching=false, pinchDist=0, pinchMid=null;
const TAP_PX = 8; // movement (device px) under which a press counts as a tap

function evToCanvas(ev){
  const r=canvas.getBoundingClientRect();
  return { x:(ev.clientX-r.left)*(canvas.width/r.width), y:(ev.clientY-r.top)*(canvas.height/r.height) };
}
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const mid =(a,b)=>({x:(a.x+b.x)/2,y:(a.y+b.y)/2});

canvas.addEventListener('pointerdown', (ev)=>{
  ev.preventDefault();
  try{ canvas.setPointerCapture(ev.pointerId); }catch(e){}
  const c=evToCanvas(ev); pointers.set(ev.pointerId, c);
  if(pointers.size===1){ downPt=c; lastPt=c; movedFar=false; dragging=false; }
  else if(pointers.size===2){ pinching=true; dragging=false;
    const p=[...pointers.values()]; pinchDist=dist(p[0],p[1]); pinchMid=mid(p[0],p[1]); }
});
canvas.addEventListener('pointermove', (ev)=>{
  if(!pointers.has(ev.pointerId)) return;
  ev.preventDefault();
  const c=evToCanvas(ev); pointers.set(ev.pointerId, c);
  if(pinching && pointers.size>=2){
    const p=[...pointers.values()]; const nd=dist(p[0],p[1]), nm=mid(p[0],p[1]);
    if(pinchDist>0) zoomAt(nm.x, nm.y, nd/pinchDist);   // pinch zooms; the camera stays glued to the hero
    if(player.freeCam){ panBy(nm.x-pinchMid.x, nm.y-pinchMid.y); camFollow=false; }   // …unless the cheat hero is looking around
    pinchDist=nd; pinchMid=nm; return;
  }
  if(pointers.size===1){
    if(!movedFar && dist(c, downPt) > TAP_PX*DPR){ movedFar=true; dragging=true; }   // still tracked so a drag isn't a tap
    if(dragging && player.freeCam){ panBy(c.x-lastPt.x, c.y-lastPt.y); camFollow=false; }   // free pan is god mode's privilege
    lastPt=c;                                            // for everyone else the camera never leaves the player
  }
});
function endPointer(ev){
  const wasPinch=pinching;
  const c = pointers.has(ev.pointerId)? pointers.get(ev.pointerId) : evToCanvas(ev);
  pointers.delete(ev.pointerId);
  if(pointers.size<2) pinching=false;
  if(pointers.size===0){
    if(!wasPinch && !movedFar && player.dead && playAgainBtn &&                                       // death screen: restart
       c.x>=playAgainBtn.x && c.x<=playAgainBtn.x+playAgainBtn.w && c.y>=playAgainBtn.y && c.y<=playAgainBtn.y+playAgainBtn.h){ playAgain(); dragging=false; return; }
    if(scene==='tavern' && !wasPinch && !movedFar){ tavernTap(c.x, c.y); dragging=false; return; }   // pick a hero
    if(!wasPinch && !movedFar && !player.dead){
      if(buildUI.open){ buildUIClick(c.x, c.y); }    // the building catalog captures the tap
      else if(siteUI.open){ siteUIClick(c.x, c.y); } // a build site's panel captures the tap
      else if(shopUI.open){ shopUIClick(c.x, c.y); }      // modal captures the tap
      else if(altarUI.open){ altarClick(c.x, c.y); } // altar rites capture the tap
      else if(invUI.open){ invUIClick(c.x, c.y); }   // inventory screen captures the tap
      else {
        let hitTool=false;
        if(mmButtonTap(c.x, c.y)) hitTool=true;                                                      // minimap +/- buttons
        const IB=invButtonBox();
        if(!hitTool && c.x>=IB.x&&c.x<=IB.x+IB.w&&c.y>=IB.y&&c.y<=IB.y+IB.h){ invUI.open=true; hitTool=true; }   // satchel → open inventory
        for(const b of toolButtons()){ if(hitTool) break; if(c.x>=b.x&&c.x<=b.x+b.w&&c.y>=b.y&&c.y<=b.y+b.h){
          const wasBuilding=!!buildMode; buildMode=null; _buildConfirmBox=null;                       // picking ANY action icon leaves ground-select
          if(b.key==='build'){ if(!wasBuilding) buildUI.open=!buildUI.open; siteUI.open=false; hitTool=true; break; }
          if(b.group==='food'){ eatFood(b.key); hitTool=true; break; }                                // food buttons eat, they don't equip
          player.tool = player.tool===b.key ? null : b.key; setTool(player.tool); hitTool=true; break; } }
        if(!hitTool && buildMode){                                                                 // ground-select mode: taps place the ghost
          if(_buildConfirmBox && c.x>=_buildConfirmBox.x && c.x<=_buildConfirmBox.x+_buildConfirmBox.w &&
             c.y>=_buildConfirmBox.y && c.y<=_buildConfirmBox.y+_buildConfirmBox.h){ confirmBuildSite(); }
          else { const w2=screenToWorld(c.x,c.y);
            buildMode.tx=Math.max(0,Math.min(GRID/TILE-BUILDINGS[buildMode.kind].tiles, Math.floor(w2.x/CELL/TILE)));
            buildMode.ty=Math.max(0,Math.min(GRID/TILE-BUILDINGS[buildMode.kind].tiles, Math.floor(w2.y/CELL/TILE))); }
          hitTool=true;
        }
        if(!hitTool){
          const wheatKey=wheatAtScreen(c.x, c.y);
          const prop=wheatKey==null ? propAtScreen(c.x, c.y) : null;
          if(wheatKey!=null){ startHarvest(wheatKey); }  // tap grown wheat → walk over and reap it
          else if(prop){ startPunch(prop); }             // tap a barrel/crate → walk over and punch it
          else { const w=screenToWorld(c.x,c.y); onTapWorld(w.x,w.y); }
        }
      }
    }
    dragging=false;
  } else if(pointers.size===1){
    // a finger lifted after a pinch: keep tracking the remaining one, but don't treat as a tap
    const rem=[...pointers.entries()][0]; downPt=rem[1]; lastPt=rem[1]; movedFar=true; dragging=false;
  }
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);

// mouse wheel : zoom anchored on cursor (the meter up top reads out the factor)
canvas.addEventListener('wheel', (ev)=>{
  ev.preventDefault();
  const c=evToCanvas(ev);

// keyboard (no on-screen controls: zoom via wheel/pinch, pan via drag)
document.addEventListener('keydown', (ev)=>{

function placePlayerStart(){                        // begin ON the dirt road, well out toward the east edge of the map
  const road=(world.pathDirt||[]).filter(c=>!isBlocked(c.x,c.y));
  if(road.length){
    const targetX=Math.floor(GRID*0.78);            // right-hand stretch of the road, past the village
    let best=null, bd=1e9;
    for(const c of road){ const d=Math.abs(c.x-targetX); if(d<bd){ bd=d; best=c; } }
    player.px=(best.x+0.5)*CELL; player.py=(best.y+0.5)*CELL; player.path=[]; player.targetCell=null; player.face='S';
    return;
  }
  let tx=SPAWN.x, ty=SPAWN.y;                       // fallback: dry grass ~20 tiles east of the weapon shop
  if(shop.placed){ tx=Math.round(shop.x+shop.w/2)+20; ty=Math.round(shop.y+shop.h/2); }
  tx=Math.max(1,Math.min(GRID-2,tx)); ty=Math.max(1,Math.min(GRID-2,ty));
  const grass=(x,y)=> inGrid(x,y) && world.terrain[gi(x,y)]===0 && !isBlocked(x,y) && !isShopCell(x,y) && !isStallCell(x,y) && !isArmorCell(x,y);
  let cx=tx, cy=ty;                                 // spiral out to the nearest real grass tile (never water/tree/building)
  if(!grass(cx,cy)){ for(let r=1;r<50;r++){ let found=false;
    for(let dy=-r;dy<=r && !found;dy++) for(let dx=-r;dx<=r && !found;dx++){ const x=tx+dx,y=ty+dy; if(grass(x,y)){ cx=x; cy=y; found=true; } }
    if(found) break; } }
  player.px=(cx+0.5)*CELL; player.py=(cy+0.5)*CELL; player.path=[]; player.targetCell=null; player.face='S';
}
function startAsRace(k){ player.race=k; closeRaceModal(); resetPlayerStats(); scene='game'; placePlayerStart(); setDefaultView(); }   // Yes -> begin the game east of the shop

  const rs=RACE_STATS[player.race]||RACE_STATS.human;   // race sets max hearts + move speed
  player.hpMax=rs.hpMax; player.speedMul=rs.speed;
  player.hp=player.hpMax; player.dead=false; player.deadT=0; player.hurtT=0; player.dmgT=0; player.lostHp=0; player.spewT=0; player.starveHp=0; player.freeCam=false; player.swingCD=0; player.pack='small'; player._packMsgT=0;
  player.stamina=100; player.wood=10; player.club=0; player.bow=1; player.longbow=0; player.arrows=10; player.hoe=0; player.seeds=0; player.wheat=0; player.meat=0; player.jerky=0; player.meal=0;
  if(mapMode==='dungeon') exitDungeon(false);   // a fresh hero wakes back in the forest
  player.skins=0; player.souls=0; player.guld=100; player.goblinKey=0; player.helmet=0; player.armor=0; player.leggings=0;
  player.equipMelee=null; player.equipRanged='bow';   // fresh hero sets out with a short bow equipped
  player.eqHelmet=1; player.eqArmor=1; player.eqLeggings=1;
  player.magic={club:0, bow:0, longbow:0, sword:0, gaxe:0, helmet:0, armor:0, leggings:0, chainmail:0}; player.witchEye=0; player.goAltar=false;
  player.iron=0; player.silver=0; player.pickaxe=0; player.sword=0; player.gaxe=0; player.chainmail=0; player.eqChainmail=0; player.goCave=false; player.goForge=false; player.mineRock=null; player.mineT=0;
  player.tool=null; player.attack=null; player.propTarget=null; player.harvestTarget=null; player.carcassTarget=null; player.soulTarget=null; player.punchT=0;
  player.chopTree=null; player.chopping=false; player.chopT=0; player.path=[]; player.targetCell=null; player.goShop=false; player.goStall=false; player.goArmor=false;
}
function playAgain(){                                // death-screen restart -> SAME map, a fresh hero
  playAgainBtn=null; resetPlayerStats();
  spawnHerd(); spawnHerd2(); spawnGoblins(); spawnRoamers(); spawnTurtles();   // fresh creatures, but keep the same terrain/map
  scene='tavern';
}
function drawPlayAgain(){                            // "You Died" + a Play Again button, screen space
  const W=canvas.width, H=canvas.height;
  const bw=Math.max(180, W*0.26), bh=Math.max(52, H*0.088), bx=(W-bw)/2, by=H*0.60;
  playAgainBtn={x:bx, y:by, w:bw, h:bh};
  ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.textAlign='center';
  ctx.fillStyle='rgba(190,26,26,0.96)'; ctx.shadowColor='rgba(0,0,0,.65)'; ctx.shadowBlur=12;
  ctx.font='800 '+Math.round(Math.max(30,H*0.075))+'px system-ui,sans-serif';
  ctx.fillText('You Died', W/2, by-bh*0.55); ctx.shadowBlur=0;
  ctx.fillStyle='#3f9d4b'; ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(bx,by,bw,bh,12); else ctx.rect(bx,by,bw,bh);
  ctx.fill(); ctx.strokeStyle='rgba(0,0,0,.4)'; ctx.lineWidth=Math.max(2,DPR*2); ctx.stroke();
  ctx.fillStyle='#fff'; ctx.textBaseline='middle';
  ctx.font='700 '+Math.round(Math.max(20,bh*0.42))+'px system-ui,sans-serif';
  ctx.fillText('Play Again', W/2, by+bh*0.54); ctx.textBaseline='alphabetic'; ctx.restore();
}
function tavernTap(x,y){
  // secret tester's door: an invisible button in the lower-left corner starts god mode
  if(x<=canvas.width*0.12 && y>=canvas.height*0.86){ startGodMode(); return; }
  let best=null;
  for(const s of tavernSeats){ if(x>=s.x0&&x<=s.x1&&y>=s.y0&&y<=s.y1 && (!best||s.cy>best.cy)) best=s; }
  if(best) openRaceModal(best.race);
}
function startGodMode(){                    // testing loadout: a human with everything, moving like the wind
  player.race='human'; closeRaceModal(); resetPlayerStats();
  player.speedMul=4;                                                       // 4x a human's pace
  player.freeCam=true;                                                     // and an untethered lens: pan & zoom without limits
  player.club=1; player.bow=1; player.longbow=1; player.sword=1; player.gaxe=1;      // every weapon in the game…
  player.pack='large';                                                     // and the biggest pack made
  player.helmet=1; player.armor=1; player.leggings=1; player.chainmail=1;             // …and every piece of armor
  player.equipMelee='gaxe'; player.equipRanged='longbow';                             // best of each equipped
  player.eqHelmet=1; player.eqLeggings=1; player.eqChainmail=1; player.eqArmor=0;     // chain on the body (leather in the pack)
  player.hoe=1; player.pickaxe=1;                                                     // and the tools, so everything is testable
  player.wood=100; player.arrows=100; player.seeds=100; player.wheat=100; player.meat=100; player.jerky=10; player.meal=5;  // 100 of everything (plus a full larder)
  player.skins=100; player.souls=100; player.witchEye=100; player.guld=10000; player.goblinKey=1;
  scene='game'; placePlayerStart(); setDefaultView();
}
/* --- the tavern interior, rendered on the canvas with the actual race body assets --- */
function tavernSeatLayout(){
  const W=canvas.width, H=canvas.height, cx=W/2;
  return [
    {race:'human',   x:cx - W*0.31,  y:H*0.60, face:'E'},
    {race:'dwarf',   x:cx - W*0.155, y:H*0.73, face:'E'},
    {race:'halfling',x:cx,           y:H*0.84, face:'S'},
    {race:'halforc', x:cx + W*0.155, y:H*0.73, face:'W'},
    {race:'elf',     x:cx + W*0.31,  y:H*0.60, face:'W'},
  ];
}
function drawHearthFire(x, baseY, w){
  for(let i=0;i<5;i++){ const off=i-2, ph=i*1.3;
    const fh=w*(0.7+0.4*Math.abs(Math.sin(animT*7+ph)))*(1-Math.abs(off)/5), fx=x+off*w*0.28;
    ctx.fillStyle = i%2 ? PAL.fire : PAL.fireInner;
    ctx.beginPath(); ctx.moveTo(fx-w*0.13, baseY); ctx.quadraticCurveTo(fx-w*0.05, baseY-fh*0.5, fx, baseY-fh);
    ctx.quadraticCurveTo(fx+w*0.05, baseY-fh*0.5, fx+w*0.13, baseY); ctx.closePath(); ctx.fill(); }
  ctx.fillStyle=PAL.ember; ctx.beginPath(); ctx.ellipse(x, baseY, w*0.42, w*0.13, 0,0,Math.PI*2); ctx.fill();
}
function drawTavTable(x,y,r){                        // 3/4 round table with legs
  shadow(x, y+r*0.42, r*1.05, r*0.4);
  rect(x-r*0.66, y, r*0.13, r*0.72, '#3a2412'); rect(x+r*0.53, y, r*0.13, r*0.72, '#3a2412');  // legs
  ctx.fillStyle='#5f3f22'; ctx.beginPath(); ctx.ellipse(x, y+r*0.06, r, r*0.5,0,0,Math.PI*2); ctx.fill();   // underside
  ctx.fillStyle='#7d5730'; ctx.beginPath(); ctx.ellipse(x, y-r*0.04, r, r*0.48,0,0,Math.PI*2); ctx.fill();  // top
  ctx.fillStyle='#8a6238'; ctx.beginPath(); ctx.ellipse(x, y-r*0.04, r*0.9, r*0.42,0,0,Math.PI*2); ctx.fill();
}
function drawMug(x,y,s){                             // pewter tankard of ale with foam
  const w=s, h=s*1.1;
  rect(x-w/2, y-h, w, h, '#8f8f96');                 // body
  rect(x-w/2, y-h, w, h*0.3, '#e6ba53');             // ale showing
  ctx.fillStyle='#f4efe0'; ctx.beginPath(); ctx.ellipse(x, y-h, w*0.52, h*0.14,0,0,Math.PI*2); ctx.fill();  // foam
  ctx.strokeStyle='#6f6f77'; ctx.lineWidth=Math.max(2,s*0.16); ctx.beginPath(); ctx.arc(x+w*0.52, y-h*0.5, h*0.3, -1.2, 1.2); ctx.stroke();  // handle
}
function drawPipe(x,y,dir,len){                      // long wizard pipe with rising smoke
  ctx.save(); ctx.strokeStyle='#5a3a1e'; ctx.lineCap='round'; ctx.lineWidth=Math.max(2,len*0.09);
  const ex=x+dir*len, ey=y+len*0.18;
  ctx.beginPath(); ctx.moveTo(x,y); ctx.quadraticCurveTo(x+dir*len*0.6, y-len*0.12, ex, ey); ctx.stroke();  // long stem
  ctx.beginPath(); ctx.moveTo(ex,ey); ctx.lineTo(ex, ey+len*0.3); ctx.stroke();                             // down to bowl
  circle(ex, ey+len*0.36, len*0.14, '#3a2412'); circle(ex, ey+len*0.32, len*0.09, '#1c120a');               // bowl
  for(let i=0;i<4;i++){ const t=((animT*0.45)+i*0.25)%1; ctx.globalAlpha=(1-t)*0.45;
    circle(ex+Math.sin((animT+i*1.6)*2)*len*0.12, ey+len*0.3 - t*len*1.6, len*0.09*(0.6+t*1.4), '#d3d7da'); }
  ctx.globalAlpha=1; ctx.restore();
}
function drawBarShelf(x,y,w){                        // bottles on the back wall
  rect(x, y, w, Math.max(5,w*0.045), '#2c1a0d');
  const cols=['#6a8f5a','#8a5a3a','#5a6a8a','#7a7a4a'];
  for(let i=0;i<9;i++){ const bx=x+w*(0.05+i*0.104), bh=w*0.05+(i%3)*w*0.016;
    rect(bx, y-bh, w*0.02, bh, cols[i%4]); }
}
function drawBarCounter(x,y,w,h){                    // bar front + overhanging top
  rect(x, y, w, h, '#5a3a1e');
  ctx.strokeStyle='rgba(0,0,0,.25)'; ctx.lineWidth=Math.max(1,DPR);
  for(let vx=x+w*0.12; vx<x+w; vx+=w*0.12){ ctx.beginPath(); ctx.moveTo(vx,y); ctx.lineTo(vx,y+h); ctx.stroke(); }
  rect(x-w*0.02, y-h*0.2, w*1.04, h*0.22, '#6e4a26');
  for(let i=0;i<3;i++) drawMug(x+w*(0.2+i*0.3), y-h*0.06, w*0.05);   // a few mugs on the bar
}
function drawHearth(hx, hy, W, H, scl){
  const w=Math.min(W*0.24, H*0.34)*(scl||1), h=w*0.92;
  let gg=ctx.createRadialGradient(hx,hy,w*0.1,hx,hy,w*1.7);                 // warm glow
  gg.addColorStop(0,'rgba(255,170,70,.38)'); gg.addColorStop(1,'rgba(255,150,50,0)');
  ctx.fillStyle=gg; ctx.fillRect(hx-w*1.9,hy-w*1.9,w*3.8,w*3.8);
  rect(hx-w*0.58, hy-h*0.5-h*0.1, w*1.16, h*0.13, '#7d7168');              // mantel
  rect(hx-w/2, hy-h*0.5, w, h, '#6b6058');                                 // stone surround
  ctx.strokeStyle='rgba(0,0,0,.28)'; ctx.lineWidth=Math.max(1,DPR);
  ctx.strokeRect(hx-w/2, hy-h*0.5, w, h);
  for(let ry=0;ry<3;ry++){ const yy=hy-h*0.5+h*(0.25+ry*0.25);             // stone courses
    ctx.beginPath(); ctx.moveTo(hx-w/2,yy); ctx.lineTo(hx+w/2,yy); ctx.stroke(); }
  const ow=w*0.56, oh=h*0.6, oy=hy-h*0.5+h*0.3;
  rect(hx-ow/2, oy, ow, oh, '#140d09');                                    // fire opening
  rect(hx-ow*0.34, oy+oh-h*0.12, ow*0.68, h*0.09, PAL.log);               // log
  drawHearthFire(hx, oy+oh-h*0.06, ow*0.5);
}
function drawBar3q(bx, baseY, bw, cw, ch, frontH, depth){   // 3/4 bar counter sitting on the tile grid
  ctx.save(); ctx.globalAlpha=0.28; ctx.fillStyle=PAL.shadow; ctx.fillRect(bx-cw*0.12, baseY-ch*0.14, bw+cw*0.24, ch*0.4); ctx.restore();
  rect(bx, baseY-frontH, bw, frontH, '#5a3a1e');                          // front face
  ctx.strokeStyle='rgba(0,0,0,.28)'; ctx.lineWidth=Math.max(1,DPR); ctx.beginPath();
  for(let vx=bx+cw; vx<bx+bw; vx+=cw){ ctx.moveTo(vx, baseY-frontH); ctx.lineTo(vx, baseY); } ctx.stroke();
  const topY=baseY-frontH;
  rect(bx-cw*0.16, topY-depth, bw+cw*0.32, depth, '#7a5330');             // bar-top surface (looked down on)
  rect(bx-cw*0.16, topY-depth, bw+cw*0.32, Math.max(2,depth*0.18), '#8c6338');   // lit front lip
  ctx.strokeStyle='rgba(0,0,0,.15)'; ctx.beginPath();
  for(let vx=bx; vx<bx+bw; vx+=cw){ ctx.moveTo(vx, topY-depth); ctx.lineTo(vx, topY); } ctx.stroke();
  for(let i=0;i<3;i++) drawMug(bx+bw*(0.22+i*0.28), topY-depth*0.35, cw*0.28);   // mugs on the bar top
  return topY;
}
function drawHearth3q(hx, baseY, hw){               // 3/4 stone hearth + chimney; all dimensions scale with hw
  const frontH=hw*0.5, mantel=hw*0.1, chimH=hw*0.3, chimW=hw*0.44, cx=hx+hw/2;
  let gg=ctx.createRadialGradient(cx, baseY-frontH*0.5, hw*0.12, cx, baseY-frontH*0.5, hw*1.5);
  gg.addColorStop(0,'rgba(255,170,70,.46)'); gg.addColorStop(1,'rgba(255,150,50,0)');
  ctx.fillStyle=gg; ctx.fillRect(hx-hw, baseY-frontH-hw, hw*3, hw*3);
  rect(cx-chimW/2, Math.max(0, baseY-frontH-mantel-chimH), chimW, baseY-frontH-mantel-Math.max(0,baseY-frontH-mantel-chimH), '#544a42');  // chimney up the wall
  rect(hx-hw*0.05, baseY-frontH-mantel, hw*1.1, mantel, '#867769');            // mantel shelf (top face)
  rect(hx-hw*0.05, baseY-frontH-mantel, hw*1.1, mantel*0.35, '#968677');       // lit mantel lip
  rect(hx, baseY-frontH, hw, frontH, '#6b6058');                              // stone front
  ctx.strokeStyle='rgba(0,0,0,.28)'; ctx.lineWidth=Math.max(1,DPR); ctx.beginPath();
  for(let r=1;r<4;r++){ const yy=baseY-frontH+frontH*r/4; ctx.moveTo(hx,yy); ctx.lineTo(hx+hw,yy); }   // stone courses
  for(let vx=hx+hw*0.33; vx<hx+hw; vx+=hw*0.33){ ctx.moveTo(vx, baseY-frontH); ctx.lineTo(vx, baseY); }
  ctx.stroke();
  const ow=hw*0.58, oh=frontH*0.66, ox=cx-ow/2, oy=baseY-oh-frontH*0.08;
  rect(ox, oy, ow, oh, '#140d09');                                            // fire opening
  ctx.fillStyle='#241812'; ctx.beginPath(); ctx.moveTo(ox,oy); ctx.lineTo(ox+ow,oy); ctx.lineTo(ox+ow*0.82,oy+oh*0.18); ctx.lineTo(ox+ow*0.18,oy+oh*0.18); ctx.closePath(); ctx.fill();  // arch lintel
  rect(ox+ow*0.12, oy+oh-hw*0.06, ow*0.76, hw*0.07, PAL.log);                 // logs
  drawHearthFire(cx, oy+oh-hw*0.03, ow*0.52);
}
function drawBigTableBase(tcx,tcy,rx,ry){           // legs + shadow + rim (drawn behind the seated heroes)
  ctx.save(); ctx.globalAlpha=0.32; ctx.fillStyle=PAL.shadow; ctx.beginPath(); ctx.ellipse(tcx, tcy+ry*0.6, rx*1.02, ry*0.72,0,0,Math.PI*2); ctx.fill(); ctx.restore();
  for(const lx of [-0.72,-0.36,0.36,0.72]) rect(tcx+lx*rx-rx*0.035, tcy+ry*0.2, rx*0.07, ry*1.6, '#3a2412');   // legs
  ctx.fillStyle='#5a3a20'; ctx.beginPath(); ctx.ellipse(tcx, tcy+ry*0.18, rx, ry,0,0,Math.PI*2); ctx.fill();   // edge/thickness
}
function drawBigTableTop(tcx,tcy,rx,ry){            // top surface + tankards (drawn OVER seated heroes' laps)
  ctx.fillStyle='#7d5730'; ctx.beginPath(); ctx.ellipse(tcx, tcy, rx, ry,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#8a6238'; ctx.beginPath(); ctx.ellipse(tcx, tcy-ry*0.03, rx*0.93, ry*0.9,0,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.10)'; ctx.lineWidth=Math.max(1,DPR); ctx.beginPath(); ctx.ellipse(tcx,tcy,rx*0.6,ry*0.6,0,0,Math.PI*2); ctx.stroke();
  for(const [mx,my] of [[-0.52,-0.15],[0.12,0.2],[0.55,-0.1],[-0.12,-0.32],[0.34,0.32]]) drawMug(tcx+mx*rx, tcy+my*ry, rx*0.1);  // tankards
}
function drawRug(cx,cy,rx,ry){                       // a woven hearth rug on the floor
  ctx.save();
  ctx.fillStyle='#7c2f30'; ctx.beginPath(); ctx.ellipse(cx,cy,rx,ry,0,0,Math.PI*2); ctx.fill();          // deep-red field
  ctx.strokeStyle='#caa24a'; ctx.lineWidth=Math.max(2,rx*0.035); ctx.beginPath(); ctx.ellipse(cx,cy,rx*0.9,ry*0.9,0,0,Math.PI*2); ctx.stroke();  // gold border
  ctx.fillStyle='#5e2324'; ctx.beginPath(); ctx.ellipse(cx,cy,rx*0.55,ry*0.55,0,0,Math.PI*2); ctx.fill(); // inner medallion
  ctx.strokeStyle='#caa24a'; ctx.lineWidth=Math.max(1.5,rx*0.02); ctx.beginPath(); ctx.ellipse(cx,cy,rx*0.55,ry*0.55,0,0,Math.PI*2); ctx.stroke();
  ctx.fillStyle='#caa24a'; ctx.beginPath(); ctx.moveTo(cx,cy-ry*0.28); ctx.lineTo(cx+rx*0.18,cy); ctx.lineTo(cx,cy+ry*0.28); ctx.lineTo(cx-rx*0.18,cy); ctx.closePath(); ctx.fill();  // centre diamond
  ctx.strokeStyle='#8a3a3a'; ctx.lineWidth=Math.max(1,DPR);                                              // fringe on the ends
  ctx.beginPath(); for(let i=-4;i<=4;i++){ const fx=cx+i*rx*0.09; ctx.moveTo(fx,cy-ry*0.98); ctx.lineTo(fx,cy-ry*1.06); ctx.moveTo(fx,cy+ry*0.98); ctx.lineTo(fx,cy+ry*1.06); } ctx.stroke();
  ctx.restore();
}
function drawCandle(x, baseY, s){                    // a lit candle in a brass holder
  let g=ctx.createRadialGradient(x, baseY-s*2.4, s*0.3, x, baseY-s*2.4, s*4);
  g.addColorStop(0,'rgba(255,200,90,.5)'); g.addColorStop(1,'rgba(255,180,60,0)');
  ctx.fillStyle=g; ctx.fillRect(x-s*4, baseY-s*6.4, s*8, s*8);                                            // warm glow
  ctx.fillStyle='#b8892f'; ctx.beginPath(); ctx.ellipse(x, baseY, s*1.25, s*0.42, 0,0,Math.PI*2); ctx.fill();  // brass dish
  rect(x-s*0.28, baseY-s*0.5, s*0.56, s*0.6, '#a87b28');                                                 // stem
  rect(x-s*0.4, baseY-s*2.5, s*0.8, s*2.0, '#f0e6c8');                                                   // wax candle
  rect(x-s*0.4, baseY-s*2.5, s*0.8, s*0.22, '#fff7e0'); rect(x+s*0.18, baseY-s*2.5, s*0.14, s*2.0, '#d9cdaa');  // lit rim + shade
  rect(x-s*0.05, baseY-s*2.8, s*0.1, s*0.32, '#3a2a1a');                                                 // wick
  const fl=s*(0.62+0.16*Math.sin(animT*11));
  ctx.fillStyle=PAL.fireInner; ctx.beginPath(); ctx.ellipse(x, baseY-s*3.0, s*0.28, fl, 0,0,Math.PI*2); ctx.fill();  // flame
  ctx.fillStyle=PAL.fire;      ctx.beginPath(); ctx.ellipse(x, baseY-s*2.9, s*0.15, fl*0.6, 0,0,Math.PI*2); ctx.fill();
}
function drawTavHero(s, U){                          // a seated/standing hero with their prop
  const rc=RACES[s.race], u=U*rc.sc, hh=rc.hh;
  if(s.dance){ ctx.save(); const bob=Math.abs(Math.sin(animT*7))*u*0.14;
    ctx.translate(s.x, s.y-bob); ctx.rotate(Math.sin(animT*3.5)*0.16);
    player.race=s.race; player.face=s.face; drawPerson({x:0,y:0}); ctx.restore(); }
  else { player.race=s.race; player.face=s.face; drawPerson({x:s.x, y:s.y}); }
  if(s.mug){ const dir=s.face==='E'?1:-1; drawMug(s.x+dir*u*0.34, s.y-u*0.5, u*0.24); }
  if(s.pipe){ const dir=s.face==='W'?-1:1; drawPipe(s.x+dir*u*0.24, s.y-u*1.16*hh, dir, u*0.7); }
}
function drawBarMaid(x,y,face,U){                    // buxom barmaid: long flowing hair, dress + apron, carrying ale
  const rc=RACES.maid, u=U*rc.sc, dress='#8a4656', dressD='#63313b', apron='rgba(246,240,226,.97)', dir=face==='W'?-1:1;
  const hcy=y-u*1.30*rc.hh;
  // long hair BEHIND the figure — a full mane framing the face and spilling to the chest (rounded, never stick-like)
  ctx.fillStyle=rc.hair;
  ctx.beginPath(); ctx.ellipse(x, hcy+u*0.06, u*0.36, u*0.46, 0,0,Math.PI*2); ctx.fill();          // mane behind head
  ctx.beginPath(); ctx.ellipse(x-u*0.28, hcy+u*0.4, u*0.15, u*0.46, 0,0,Math.PI*2); ctx.fill();     // left tress to the chest
  ctx.beginPath(); ctx.ellipse(x+u*0.28, hcy+u*0.4, u*0.15, u*0.46, 0,0,Math.PI*2); ctx.fill();     // right tress
  drawFolk(x,y,face,'maid',1);                                                 // head/face/body via player assets
  quad([x-u*0.2,y-u*0.5],[x+u*0.2,y-u*0.5],[x+u*0.4,y],[x-u*0.4,y], dress);    // full flared skirt (covers legs)
  rect(x-u*0.4, y-u*0.06, u*0.8, u*0.06, dressD);                              // hem
  rect(x-u*0.24, y-u*0.86, u*0.48, u*0.4, dress);                             // bodice (covers linen arms/torso)
  circle(x-u*0.14, y-u*0.68, u*0.17, dress); circle(x+u*0.14, y-u*0.68, u*0.17, dress);  // buxom bust

    ang:Math.atan2(m.ty-m.y0, m.tx-m.x0), fx:true, mt:m.mt||0 }); }                                        // the other player's arrow, visual only
  else if(m.t==='vfx'){ net._vfxIn=true; try{ spawnBlood(m.x, m.y, m.n, !!m.big); }finally{ net._vfxIn=false; } }   // blood from the other side, visual only
  else if(m.t==='bfx'){ addParticle({kind:'boulder', x:m.x0, y:m.y0, x0:m.x0, y0:m.y0, tx:m.tx, ty:m.ty, t:0, dur:m.dur, life:99, max:99, arc:m.arc, fx:true}); }   // the boss's boulder, mirrored
  else if(m.t==='sfx'){ net._vfxIn=true; try{ spawnSoulFX(m.x, m.y, m.n); }finally{ net._vfxIn=false; } }   // the other player's soul harvest, mirrored
  else if(m.t==='bossKill'){ grantBossReward(); }                                               // the boss fell — everyone shares the hoard
  else if(m.t==='kingKill'){ grantKingReward(); }                                               // the king fell — a fortune for all
  else if(m.t==='mined'){ if(net.mode==='host' && mapMode==='dungeon' && world.rocks && world.rocks[m.i]){ const r=world.rocks[m.i];
    if(!r.gone){ r.gone=true; if(world.rockBlock) world.rockBlock.delete(gi(r.x,r.y)); } } }
  else if(m.t==='pick'){ if(net.mode==='host' && mapMode==='dungeon' && world.pickups && world.pickups[m.i]) world.pickups[m.i].taken=true; }
  else if(m.t==='cave'){ setCaveUnlocked(); }                                                   // partner turned the key — open for all
  else if(m.t==='loot'){ if(net.mode==='host'){ const f=findByNid(m.nid);                       // guest looted a carcass → strip it to bones here too
    if(f && f.kind==='deer' && f.cr.dead && !f.cr.gone && (f.cr.deadT||0)<DEER_FRESH_T) f.cr.deadT=DEER_FRESH_T; } }
  else if(m.t==='lootg'){ if(net.mode==='host'){ const f=findByNid(m.nid);                      // guest took an enemy's soul → mark the body spent here too
    if(f && f.kind==='goblin' && f.cr.dead && !f.cr.gone && !f.cr.looted){ f.cr.looted=true; f.cr.deadT=Math.max(f.cr.deadT||0,60); } } }
  else if(m.t==='siteNew'){ if(net.mode==='host') addSite(m.kind, m.tx|0, m.ty|0); }
  else if(m.t==='siteWood'){ if(net.mode==='host'){ const s=(world.sites||[]).find(x2=>x2.id===m.i); siteAddWood(s, Math.max(0, Math.min(50, m.n|0))); } }
  else if(m.t==='cropAct'){ if(net.mode==='host'){                                              // guest farmed — apply the same change here (snapshots echo it back)
    if(m.op==='till'){ tillOrUntill(m.cx, m.cy); }
    else if(m.op==='plant'){ const px2=m.key%GRID, py2=(m.key/GRID)|0, x0=px2-(px2%TILE), y0=py2-(py2%TILE);
      for(let dy=0;dy<TILE;dy++) for(let dx=0;dx<TILE;dx++){ const c=world.crops.get(gi(x0+dx,y0+dy)); if(c && c.stage==='till'){ c.stage='seed'; c.t=0; } } }
    else if(m.op==='harv'){ const px2=m.key%GRID, py2=(m.key/GRID)|0, x0=px2-(px2%TILE), y0=py2-(py2%TILE);
      let n=0; for(let dy=0;dy<TILE;dy++) for(let dx=0;dx<TILE;dx++){ const c=world.crops.get(gi(x0+dx,y0+dy)); if(c && c.stage==='wheat'){ c.stage='till'; c.t=0; n++; } }
      if(n) spawnHarvestFX((x0+TILE/2)*CELL,(y0+TILE/2)*CELL); } } }
}
function netUpdate(dt){
  if(net.mode==='off' || !net.connected) return;
  net.outT-=dt; if(net.outT>0) return; net.outT=1/20;
  if(net.mode==='host'){ const sn=buildSnap(); sn.map=mapMode; sn.hostMap=mapMode; netSend(sn); } else netSend(buildMe());
}
function drawRemote(ps, R){
  if(!R) return;
  const sr=player.race, sf=player.face, st=player.tool, sp=player.punchT, sc=player.chopping, sd=player.dead;
  const sm=player.magic, sh=player.helmet, sa=player.armor, sl2=player.leggings, seh=player.eqHelmet, sea=player.eqArmor, sel=player.eqLeggings, sch=player.chainmail, sec=player.eqChainmail;
  player.race=R.race||'human'; player.face=R.face||'S'; player.tool=R.tool||null; player.punchT=R.punchT||0; player.chopping=!!R.chopping; player.dead=false;
  player.magic={club:R.mw||0, bow:R.mw||0, longbow:R.mw||0, sword:R.mw||0, gaxe:R.mw||0, helmet:R.ma||0, armor:R.ma||0, leggings:R.ma||0, chainmail:R.ma||0};   // their enchantments glow on your screen too
  player.helmet=R.wh||0; player.armor=R.wa||0; player.leggings=R.wl||0; player.chainmail=R.wc||0; player.eqHelmet=1; player.eqArmor=1; player.eqLeggings=1; player.eqChainmail=R.wc?1:0;   // and their armor shows
  drawPerson(ps);
  player.race=sr; player.face=sf; player.tool=st; player.punchT=sp; player.chopping=sc; player.dead=sd;
  player.magic=sm; player.helmet=sh; player.armor=sa; player.leggings=sl2; player.eqHelmet=seh; player.eqArmor=sea; player.eqLeggings=sel; player.chainmail=sch; player.eqChainmail=sec;
}

/* --- connection setup --- */
function makeCode(){ const CH='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s=''; for(let i=0;i<5;i++) s+=CH[(Math.random()*CH.length)|0]; return s; }
function mpEnterTavern(){ const t=document.getElementById('title'); scene='tavern'; if(t){ t.classList.add('fade'); setTimeout(()=>{ t.style.display='none'; }, 380); } }
const NET_BLOCKED_MSG='Couldn’t reach the matchmaking server. If this game is running inside an app preview panel, that panel blocks the connection multiplayer needs — download the file and open it in a real browser tab (Chrome, Edge, Firefox…), then try again.';
function netReset(){ if(net.openTimer){ clearTimeout(net.openTimer); net.openTimer=null; } if(net.peer){ try{ net.peer.destroy(); }catch(_){} } if(net.ws){ try{ net.ws.close(); }catch(_){} } net.peer=null; net.ws=null; net.conn=null; net.clients=[]; net.remotes=[]; net.myId=0; net.mode='off'; net.connected=false; net.peerOpen=false; mpResetMenu(); }
function mpResetMenu(){ if(_mpMainRow) _mpMainRow.style.display='flex'; if(_mpBeginRow) _mpBeginRow.style.display='none'; if(typeof mpAllowRetry==='function') mpAllowRetry(); }
function netArmTimeout(sec, msg){ if(net.openTimer) clearTimeout(net.openTimer); net.openTimer=setTimeout(()=>{ if(!net.connected){ mpStatus(msg); netReset(); } }, sec*1000); }
function wireClient(c){                                // HOST: a new player is joining the party
  if(net.clients.filter(cl=>cl.open).length>=MAX_CLIENTS){ try{ c.close(); }catch(e){} return; }
  const client={ conn:c, id:(net.clients.length+1), open:false, p:blankRemote(net.clients.length+1) };
  net.clients.push(client);
  c.on('open', ()=>{ client.open=true; net.connected=true;
    if(net.openTimer){ clearTimeout(net.openTimer); net.openTimer=null; }
    try{ c.send({t:'wel', id:client.id, seed:worldSeed, cv:cave.unlocked?1:0}); }catch(e){}
    const n=net.clients.filter(cl=>cl.open).length;
    mpStatus(n+' player'+(n>1?'s':'')+' connected — press Begin when you’re ready!');
    if(_mpBeginRow) _mpBeginRow.style.display='flex';
  });
  c.on('data', (m)=>netOnData(m, client));
  c.on('close', ()=>{ client.open=false; client.p.active=false;
    net.connected=net.clients.some(cl=>cl.open);
    mpStatus(net.connected ? 'A player left — '+net.clients.filter(cl=>cl.open).length+' still connected.' : 'All players have left.'); });
  c.on('error', e=>{ mpStatus('Link error: '+((e&&e.type)||e)); });
}
function wireConn(c){                                  // GUEST: our one line to the host
  net.conn=c;
  c.on('open', ()=>{ net.connected=true; if(net.openTimer){ clearTimeout(net.openTimer); net.openTimer=null; } });
  c.on('data', (m)=>netOnData(m, null));
  c.on('close', ()=>{ net.connected=false; mpStatus('Lost the connection to the host.'); });
  c.on('error', e=>{ mpStatus('Link error: '+((e&&e.type)||e)); });
}
/* --- multiplayer plumbing: on-demand PeerJS loader + ICE (relay) config.
       Everything here resolves or falls back on a timer — the menu can never hang on it. --- */
let _peerJSLoading=null;
function loadPeerJS(){                                   // fetch the PeerJS library when first needed (keeps this file self-contained)
  if(window.Peer) return Promise.resolve(true);
  if(_peerJSLoading) return _peerJSLoading;
  _peerJSLoading=new Promise(res=>{
    let done=false; const fin=()=>{ if(!done){ done=true; res(!!window.Peer); } };
    try{
      const s=document.createElement('script');
      s.src='https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js';
      s.onload=fin; s.onerror=fin;
      document.head.appendChild(s);
    }catch(e){ fin(); }
    setTimeout(fin, 12000);                              // stuck download → give up cleanly instead of hanging
  });
  _peerJSLoading.then(()=>{ if(!window.Peer) _peerJSLoading=null; });   // allow a retry after a failure
  return _peerJSLoading;
}
const METERED_APP='';                                    // optional: your own metered.ca app name…
const METERED_KEY='';                                    // …and API key, for a private TURN relay
const SERVER_URL='wss://guldslayer-server-production.up.railway.app';   // the always-on dedicated server — adds a Play Online button
function netJoinWS(url){                                 // join an always-on dedicated server over a plain WebSocket
  if(net.mode!=='off') return;
  url=(url||'').trim(); if(!url) return;
  net.mode='guest'; net.code=''; mpStatus('Connecting to the server…');
  let ws; try{ ws=new WebSocket(url); }catch(err){ mpStatus('Couldn’t reach the server: '+err.message); netReset(); return; }
  const handlers={};                                     // a PeerJS-conn-shaped shim around the raw socket
  const conn={ open:false,
    send:m=>{ try{ ws.send(JSON.stringify(m)); }catch(e){} },
    on:(ev,cb)=>{ handlers[ev]=cb; },
    close:()=>{ try{ ws.close(); }catch(e){} } };
  ws.onopen   =()=>{ conn.open=true;  if(handlers.open) handlers.open(); };
  ws.onmessage=e=>{ let m=null; try{ m=JSON.parse(e.data); }catch(_){ return; } if(handlers.data) handlers.data(m); };
  ws.onclose  =()=>{ conn.open=false; if(handlers.close) handlers.close(); };
  ws.onerror  =()=>{ if(!net.connected){ mpStatus('Couldn’t reach the server — is it running? Check the address.'); } };
  net.ws=ws; wireConn(conn);
  netArmTimeout(15, 'Couldn’t reach the server. Check the address and your connection, then try again.');
}
async function openRelayCreds(){                         // time-limited credentials for the free Open Relay TURN fleet
  const username=String(Math.floor(Date.now()/1000)+12*3600);          // valid for 12 hours
  const enc=new TextEncoder();
  const key=await crypto.subtle.importKey('raw', enc.encode('openrelayprojectsecret'), {name:'HMAC', hash:'SHA-1'}, false, ['sign']);
  const sig=await crypto.subtle.sign('HMAC', key, enc.encode(username));
  return { username, credential: btoa(String.fromCharCode(...new Uint8Array(sig))) };
}
async function getIceServers(){                          // STUN for easy networks, TURN relay for the hard ones
  const ice=[{urls:['stun:stun.l.google.com:19302','stun:stun1.l.google.com:19302']}];
  if(METERED_APP && METERED_KEY){
    try{ const r=await fetch('https://'+METERED_APP+'.metered.live/api/v1/turn/credentials?apiKey='+METERED_KEY);
      const list=await r.json(); if(Array.isArray(list)&&list.length) return ice.concat(list); }catch(e){}
  }
  try{
    const {username, credential}=await openRelayCreds();
    for(const u of ['turn:staticauth.openrelay.metered.ca:80',
                    'turn:staticauth.openrelay.metered.ca:443',
                    'turn:staticauth.openrelay.metered.ca:443?transport=tcp',
                    'turns:staticauth.openrelay.metered.ca:443?transport=tcp'])
      ice.push({urls:u, username, credential});
  }catch(e){}                                            // no WebCrypto → STUN alone still covers most networks
  return ice;
}
function makePeerOpts(){                                 // options for new Peer() — never rejects, never hangs
  const fallback={ debug:0, config:{ iceServers:[{urls:'stun:stun.l.google.com:19302'}] } };
  return Promise.race([
    getIceServers().then(ice=>({ debug:0, config:{ iceServers:ice, iceCandidatePoolSize:2 } })),
    new Promise(res=>setTimeout(()=>res(fallback), 6000))
  ]).catch(()=>fallback);
}
function netStartHost(){
  if(net.mode!=='off'){ return; }
  net.mode='host'; net.peerOpen=false; net.code=makeCode(); mpStatus('Getting a code… (a few seconds)');
  loadPeerJS().then(ok=>{
  if(!ok){ mpStatus('Couldn’t load the multiplayer library — check your internet connection, or open the file in a normal browser tab.'); netReset(); return; }
  return makePeerOpts().then(opts=>{
  if(net.mode!=='host') return;                 // user backed out while we fetched relay credentials
  try{ net.peer=new Peer('GULDSLAYER-'+net.code, opts); }
  catch(err){ mpStatus('Couldn’t start hosting: '+err.message); netReset(); return; }
  net.peer.on('open', ()=>{ net.peerOpen=true; if(net.openTimer){ clearTimeout(net.openTimer); net.openTimer=null; } mpShowCode(net.code); });
  net.peer.on('connection', c=>{ wireClient(c); });
  net.peer.on('disconnected', ()=>{ if(net.connected || !net.peer || net.peer.destroyed) return; try{ net.peer.reconnect(); }catch(_){} });   // broker hiccup — quietly re-link
  net.peer.on('error', e=>{ const t=(e&&e.type)||e;
    if(t==='unavailable-id'){ mpStatus('That code was taken — tap Create again for a new one.'); netReset(); }
    else if(t==='network' || t==='server-error' || t==='socket-error' || t==='socket-closed'){ mpStatus('Matchmaking server hiccup — tap Create to try again.'); netReset(); }
    else { mpStatus('Error ('+t+'). '+NET_BLOCKED_MSG); netReset(); } });
  netArmTimeout(15, NET_BLOCKED_MSG);
  });
  });
}
function netJoin(code){
  code=(code||'').trim(); if(!code){ mpStatus('Enter your friend’s code first.'); return; }
  if(/^wss?:\/\//i.test(code)){ netJoinWS(code); return; }   // a server address works here too
  code=code.toUpperCase();
  if(net.mode!=='off'){ return; }
  net.mode='guest'; net.peerOpen=false; net.code=code; _guestRetry=0; mpStatus('Connecting to '+code+'… (this can take up to 20s across networks)');
  loadPeerJS().then(ok=>{
  if(!ok){ mpStatus('Couldn’t load the multiplayer library — check your internet connection, or open the file in a normal browser tab.'); netReset(); return; }
  return makePeerOpts().then(opts=>{
  if(net.mode!=='guest') return;                // user backed out while we fetched relay credentials
  try{ net.peer=new Peer(undefined, opts); }
  catch(err){ mpStatus('Couldn’t start: '+err.message); netReset(); return; }
  net.peer.on('open', ()=>{ net.peerOpen=true; guestConnect(); });
  net.peer.on('disconnected', ()=>{ if(net.connected || !net.peer || net.peer.destroyed) return; try{ net.peer.reconnect(); }catch(_){} });   // broker hiccup — quietly re-link, then retry the join
  net.peer.on('error', e=>{ const t=(e&&e.type)||e;
    if(t==='peer-unavailable'){ mpStatus('No game found with code '+code+'. Double-check it and make sure your friend is still on the Create screen.'); netReset(); }
    else if(t==='network' || t==='server-error' || t==='socket-error' || t==='socket-closed'){ mpStatus('Matchmaking server hiccup — tap Join to try again.'); netReset(); }
    else { mpStatus('Couldn’t connect ('+t+'). '+NET_BLOCKED_MSG); netReset(); } });
  netArmTimeout(30, 'Couldn’t connect. Check the code is exactly right and your friend’s Create screen is still open. If it keeps failing, the relay may be busy — try again in a minute, or put both devices on the same Wi-Fi. '+NET_BLOCKED_MSG);
  });
  });
}
let _guestRetry=0;
function guestConnect(){                                 // (re)attempt the data connection to the host
  if(!net.peer || net.mode!=='guest' || net.connected) return;
  mpStatus('Found the server — reaching your friend’s game…');
  let c; try{ c=net.peer.connect('GULDSLAYER-'+net.code, {reliable:true}); }catch(_){ c=null; }
  if(!c){ if(_guestRetry++<3){ setTimeout(guestConnect, 1500); } else { mpStatus('Could not reach that game — check the code.'); netReset(); } return; }
  wireConn(c);
  // if the channel hasn't opened in a few seconds, try once more (helps flaky cross-network setups)
  setTimeout(()=>{ if(net.mode==='guest' && !net.connected && _guestRetry++<3){ guestConnect(); } }, 6000);
}

/* --- title-screen menu (DOM overlay on #title): Create a Game / Join a Game --- */
let _mpStatusEl=null, _mpBeginRow=null, _mpCodeBadge=null, _mpMainRow=null;
function mpStatus(msg){ if(_mpStatusEl) _mpStatusEl.textContent=msg; }
function mpShowCode(code){
  if(_mpStatusEl) _mpStatusEl.innerHTML='Your game code: <b style="letter-spacing:.18em;color:#ffe08a;font-size:18px">'+code+'</b><br>'+
    '<span style="opacity:.85">Share it with a friend so they can join — or just press Begin to start.</span>';
  if(_mpBeginRow) _mpBeginRow.style.display='flex';
}
function mpBegin(){                                     // leave the title and start playing
  if(_mpCodeBadge && net.mode==='host' && net.code){ _mpCodeBadge.textContent='Game code: '+net.code; _mpCodeBadge.style.display='block'; }
  mpEnterTavern();
}
let _mpStarted=false;                                  // one tap begins the game; errors re-arm it
function beginOnline(){
  if(_mpStarted) return; _mpStarted=true;
  const startTxt=document.getElementById('title') && document.getElementById('title').querySelector('.start');
  if(startTxt) startTxt.style.display='none';
  if(SERVER_URL){ mpStatus('Connecting…'); netJoinWS(SERVER_URL); }
  else mpEnterTavern();                                // no server configured (local build) — head straight to the tavern
}
function initMPMenu(){
  const title=document.getElementById('title'); if(!title) return;
  const startTxt=title.querySelector('.start'); if(startTxt) startTxt.textContent='Tap to Begin';   // the old red pulse, back where it belongs
  const bd=document.createElement('div'); bd.textContent=BUILD;                 // tiny build stamp so anyone can tell which version they're running
  bd.style.cssText='position:absolute;right:14px;bottom:10px;color:#e03030;font:600 12px system-ui,sans-serif;letter-spacing:.14em;opacity:.95';
  title.appendChild(bd);
  const st=document.createElement('style');
  st.textContent=
    '#mpMenu{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:8px;font-family:system-ui,sans-serif;z-index:120;pointer-events:none}'+
    '#mpMenu .status{min-height:20px;color:#f4e7cf;font-size:15px;opacity:.95;text-align:center;max-width:82vw;line-height:1.5}';
  document.head.appendChild(st);
  const mp=document.createElement('div'); mp.id='mpMenu';
  mp.innerHTML='<div class="status"></div>';
  title.appendChild(mp);
  _mpStatusEl=mp.querySelector('.status'); _mpBeginRow=null; _mpMainRow=null; _mpCodeBadge=null;
  title.style.cursor='pointer';
  title.addEventListener('pointerup', ()=>beginOnline());
}
function mpAllowRetry(){                               // connection failed — bring the pulse back for another tap
  _mpStarted=false;
  const t=document.getElementById('title'), s=t && t.querySelector('.start');
  if(s) s.style.display='';
}
initMPMenu();
</script>
